<script id="conv-js">
/* PATCH-CONV-IDB-V1 (Onda 1 / W1 -- paridade llama.ui: conversas em IndexedDB)
   Nao destrutivo: nao toca em nenhuma variavel/funcao existente, so envolve
   window.saveConvs (padrao _orig + flag, igual dir-js/modelstore-js) e observa
   o DOM (#thread) via MutationObserver. Se indexedDB nao existir ou qualquer
   etapa de setup falhar, o script inteiro vira no-op silencioso: o console
   continua funcionando exatamente como hoje (localStorage puro). */
(function(){
  'use strict';
  if(window.__convIdbPatchInstalled) return;
  window.__convIdbPatchInstalled = true;

  if(!window.indexedDB){ return; }

  /* ---------------------------------------------------------------- */
  /* 0) Constantes / helpers                                          */
  /* ---------------------------------------------------------------- */
  var DB_NAME = 'cylinderui-conversations-db';
  var DB_VERSION = 1;
  /* Onda 1 (VF4): os 3 modos legados continuam aqui como BASELINE fixa (nunca
     removidos, nunca mudam de chave) -- garante que o conv-js funcione
     sozinho, sem visions-js instalado, exatamente como hoje. Modos dinamicos
     (visoes custom, ou builtins remapeados) sao acrescentados por cima em
     tempo de leitura via getModeKeys(), nunca substituindo esta base. */
  var LEGACY_MODE_KEYS = [
    { mode:'home',    cv:'cylinderui-conversations', cur:'cylinderui-current' }
  ];
  var MIGRATED_LS_FLAG = 'cylinderui-idb-migrated-v1';
  /* IndexedDB nao aceita `null`/`undefined` como chave de indice valida --
     um registro com parent_id=null simplesmente NAO entra no indice
     'parent_id' (fica invisivel pra getAll/dbGetAllByIndex), o que quebra
     o find-or-create de mensagens-raiz. Por isso usamos um sentinel string
     no lugar de null para "sem pai" em toda a arvore. */
  var ROOT_KEY = '__root__';

  function el(t,c,h){ var e=document.createElement(t); if(c) e.className=c; if(h!=null) e.innerHTML=h; return e; }

  /* `MODES` e `let/const` de nivel superior no script principal (index.html
     real) -- nao vira window.MODES, mas fica visivel como IDENTIFICADOR SOLTO
     para qualquer outro <script> na MESMA pagina (todos os <script id="..."-js>
     do index.html compartilham um unico ambiente lexico global do documento;
     visions-js usa exatamente o mesmo truque: `typeof MODES === 'undefined'`).
     Por isso o acesso aqui e sempre via `typeof MODES` antes de tocar na
     variavel -- nunca `window.MODES` (nao existe) -- com try/catch em volta
     de tudo para nunca lancar caso o script principal ainda nao tenha
     rodado (boot cedo demais) ou tenha uma forma inesperada. */
  function readMainModes(){
    try{
      if(typeof MODES!=='undefined' && MODES && typeof MODES==='object') return MODES;
    }catch(e){}
    return null;
  }

  /* Onda 1 (VF4) -- resolve (a) do context-pack: modos dinamicos (visoes
     custom, ou builtins com cvKey remapeada) alem dos 3 legados fixos.
     Fontes, em ordem de prioridade (a que aparece por ultimo GANHA, pois so
     sobrescreve merge por `mode`):
       1) LEGACY_MODE_KEYS -- baseline, sempre presente (nunca falta).
       2) `MODES` do script principal -- fonte de verdade quando existe (e'
          o proprio ensureModeEntry() do visions-js que grava `cvKey`/`curKey`
          aqui para toda visao, builtin ou custom).
       3) `window.__visions.getState().visions` -- fallback defensivo, para o
          caso raro de uma visao ja existir no estado do visions-js mas
          `MODES` ainda nao ter sido atualizado (nunca deveria acontecer na
          ordem real de boot, mas nao custa cobrir).
     Sempre recalculado NA HORA (nunca cacheado) -- assim nao ha problema de
     "rodar antes/depois" de installSaveConvsWrap()/MutationObserver: cada
     chamada ja reflete o estado mais recente de MODES/visoes. */
  function getModeKeys(){
    var byMode = {};
    LEGACY_MODE_KEYS.forEach(function(e){ byMode[e.mode] = e; });

    var modesObj = readMainModes();
    if(modesObj){
      for(var k in modesObj){
        if(!Object.prototype.hasOwnProperty.call(modesObj,k)) continue;
        var m = modesObj[k];
        if(m && typeof m.cvKey==='string' && typeof m.curKey==='string'){
          byMode[k] = { mode:k, cv:m.cvKey, cur:m.curKey };
        }
      }
    }

    try{
      if(window.__visions && typeof window.__visions.getState==='function'){
        var state = window.__visions.getState();
        var visions = (state && state.visions) || [];
        for(var i=0;i<visions.length;i++){
          var v = visions[i];
          if(!v) continue;
          var internalMode = v.__internalMode || v.id;
          if(!internalMode || byMode[internalMode]) continue; /* MODES ja cobriu */
          var cv = v.conversationKey || (internalMode + '-conversations');
          var cur = internalMode + '-current';
          byMode[internalMode] = { mode:internalMode, cv:cv, cur:cur };
        }
      }
    }catch(e){}

    var out = [];
    for(var kk in byMode){ if(Object.prototype.hasOwnProperty.call(byMode,kk)) out.push(byMode[kk]); }
    return out;
  }

  function findModeKeyEntry(mode){
    var keys = getModeKeys();
    for(var i=0;i<keys.length;i++){ if(keys[i].mode===mode) return keys[i]; }
    return null;
  }

  function isLegacyMode(mode){
    for(var i=0;i<LEGACY_MODE_KEYS.length;i++){ if(LEGACY_MODE_KEYS[i].mode===mode) return true; }
    return false;
  }

  function computeConvIdbConvKey(internalMode, localId){
    return internalMode + ':' + localId;
  }

  function detectMode(){
    try{
      var p = (window.location && window.location.pathname) || '';


      /* Visao dinamica ja ativa (visions-js instalado) mas ainda sem
         conversa viva/gravada -- resolveActiveMode() cai aqui antes de
         chegar no default 'home'. Puramente defensivo: window.__visions e'
         o unico ponto de contato publico documentado do visions-js. */
      try{
        if(window.__visions && typeof window.__visions.getState==='function'){
          var state = window.__visions.getState();
          if(state && state.activeId){
            var visions = state.visions || [];
            for(var i=0;i<visions.length;i++){
              if(visions[i] && visions[i].id===state.activeId){
                return visions[i].__internalMode || visions[i].id;
              }
            }
            return state.activeId;
          }
        }
      }catch(e){}
      var m = localStorage.getItem('cylinderui-mode');
      return m || 'home';
    }catch(e){ return 'home'; }
  }

  function lsGetArr(key){
    try{ var v = localStorage.getItem(key); if(v==null) return []; var p = JSON.parse(v); return Array.isArray(p)?p:[]; }
    catch(e){ return []; }
  }

  /* detectMode() e uma HEURISTICA (pathname / localStorage['cylinderui-mode'])
     que so e confiavel se ela realmente refletir o MODE ativo do script
     principal -- e ha um jeito bem mais direto e sempre correto de saber
     isso: window.curConv() ja retorna a conversa VIVA do modo em que o
     usuario esta agora (confirmado em runtime). Por isso resolveActiveMode()
     usa curConv() como fonte de verdade PRIMARIA: procura em qual das 3
     chaves `<modo>-conversations` do localStorage existe uma conversa com o
     MESMO id da conversa viva -- essa e a chave (logo o modo) realmente
     ativo, sem depender de conseguirmos ler a variavel MODE do script
     principal (que e `let`/`const` e nao vira window.*) nem de a URL/flag
     'cylinderui-mode' estarem sincronizadas com o modo atual. detectMode()
     fica como fallback para quando ainda nao ha conversa viva (boot, painel
     aberto sem nenhuma msg enviada) ou window.curConv nao existe. */
  function findModeForConv(convId){
    if(convId==null) return null;
    var keys = getModeKeys();
    for(var i=0;i<keys.length;i++){
      var arr = lsGetArr(keys[i].cv);
      for(var j=0;j<arr.length;j++){
        if(arr[j] && arr[j].id===convId) return keys[i].mode;
      }
    }
    return null;
  }

  function resolveActiveMode(){
    try{
      if(typeof window.curConv==='function'){
        var live = window.curConv();
        if(live && live.id!=null){
          var m = findModeForConv(live.id);
          if(m) return m;
        }
      }
    }catch(e){}
    return detectMode();
  }

  function nowTs(){ return Date.now(); }

  function newMsgId(){
    return 'm' + nowTs().toString(36) + Math.random().toString(36).slice(2,8);
  }

  /* ---------------------------------------------------------------- */
  /* 1) Camada IndexedDB (promise-based, sempre com fallback silencioso) */
  /* ---------------------------------------------------------------- */
  var dbPromise = null;

  function openDb(){
    if(dbPromise) return dbPromise;
    dbPromise = new Promise(function(resolve, reject){
      var req;
      try{ req = indexedDB.open(DB_NAME, DB_VERSION); }
      catch(e){ reject(e); return; }
      req.onupgradeneeded = function(ev){
        var db = req.result;
        try{
          if(!db.objectStoreNames.contains('conversations')){
            var cs = db.createObjectStore('conversations', { keyPath:'id' });
            cs.createIndex('mode', 'mode', { unique:false });
            cs.createIndex('updated', 'updated', { unique:false });
          }
          if(!db.objectStoreNames.contains('messages')){
            var ms = db.createObjectStore('messages', { keyPath:'id' });
            ms.createIndex('conv_id', 'conv_id', { unique:false });
            ms.createIndex('parent_id', 'parent_id', { unique:false });
          }
          if(!db.objectStoreNames.contains('meta')){
            db.createObjectStore('meta', { keyPath:'key' });
          }
        }catch(e){ /* upgrade defensivo: se algo falhar aqui, onsuccess/onerror decidem o resto */ }
      };
      req.onsuccess = function(){ resolve(req.result); };
      req.onerror = function(){ reject(req.error || new Error('idb open failed')); };
      req.onblocked = function(){ reject(new Error('idb blocked')); };
    });
    return dbPromise;
  }

  function tx(storeNames, mode){
    return openDb().then(function(db){ return db.transaction(storeNames, mode||'readonly'); });
  }

  function reqToPromise(req){
    return new Promise(function(resolve, reject){
      req.onsuccess = function(){ resolve(req.result); };
      req.onerror = function(){ reject(req.error || new Error('idb request failed')); };
    });
  }

  function dbPut(storeName, value){
    return tx([storeName], 'readwrite').then(function(t){
      return new Promise(function(resolve, reject){
        var st = t.objectStore(storeName);
        var r = st.put(value);
        r.onsuccess = function(){ resolve(value); };
        r.onerror = function(){ reject(r.error); };
      });
    });
  }

  function dbGet(storeName, key){
    return tx([storeName], 'readonly').then(function(t){
      return reqToPromise(t.objectStore(storeName).get(key));
    });
  }

  function dbDelete(storeName, key){
    return tx([storeName], 'readwrite').then(function(t){
      return reqToPromise(t.objectStore(storeName)['delete'](key));
    });
  }

  function dbGetAll(storeName){
    return tx([storeName], 'readonly').then(function(t){
      return reqToPromise(t.objectStore(storeName).getAll());
    });
  }

  function dbGetAllByIndex(storeName, indexName, value){
    return tx([storeName], 'readonly').then(function(t){
      var idx = t.objectStore(storeName).index(indexName);
      return reqToPromise(idx.getAll(value));
    });
  }

  function noop(){}

  /* ---------------------------------------------------------------- */
  /* 2) Reconciliacao: flat (localStorage) -> arvore (IndexedDB)       */
  /*    Usado tanto pela migracao inicial quanto pela captura continua */
  /*    (mesmo algoritmo = idempotente por natureza: casa por          */
  /*    role+content entre irmaos antes de criar no novo).             */
  /* ---------------------------------------------------------------- */
  function findChild(convId, parentId, role, content){
    /* IMPORTANTE: o indice `parent_id` nao e exclusivo de uma conversa
       (parent_id=null, por exemplo, vale para a RAIZ de toda conversa) --
       por isso filtramos por conv_id em memoria antes de comparar
       role/content, para nunca cruzar mensagens de conversas diferentes. */
    return dbGetAllByIndex('messages', 'parent_id', parentId).then(function(children){
      for(var i=0;i<children.length;i++){
        if(children[i].conv_id===convId && children[i].role===role && children[i].content===content) return children[i];
      }
      return null;
    });
  }

  function reconcileConv(mode, localConv){
    if(!localConv || !localConv.id) return Promise.resolve(null);
    var convId = computeConvIdbConvKey(mode, localConv.id);
    var msgs = Array.isArray(localConv.messages) ? localConv.messages : [];
    var parentId = ROOT_KEY;
    var i = 0;

    function step(){
      if(i>=msgs.length) return Promise.resolve();
      var m = msgs[i];
      var role = m.role, content = (m.content==null?'':m.content);
      return findChild(convId, parentId, role, content).then(function(existing){
        if(existing){
          var changed = false;
          if(m.tools && JSON.stringify(m.tools)!==JSON.stringify(existing.tools)){ existing.tools=m.tools; changed=true; }
          var p = changed ? dbPut('messages', existing) : Promise.resolve(existing);
          return p.then(function(node){ parentId = node.id; i++; return step(); });
        }
        var node = {
          id: newMsgId(),
          conv_id: convId,
          parent_id: parentId,
          role: role,
          content: content,
          tools: m.tools || null,
          created: nowTs(),
          ts: nowTs()
        };
        return dbPut('messages', node).then(function(saved){ parentId = saved.id; i++; return step(); });
      });
    }

    return step().then(function(){
      return dbGet('conversations', convId).then(function(existingConv){
        var rec = existingConv || { id: convId, mode: mode, created: localConv.updated || nowTs() };
        rec.mode = mode;
        rec.title = localConv.title || rec.title || 'Nova conversa';
        rec.updated = localConv.updated || nowTs();
        rec.root_msg_id = rec.root_msg_id || null;
        rec.current_leaf_id = parentId; /* ultimo no da cadeia processada agora */
        if(msgs.length && !rec.root_msg_id){
          /* precisamos do id do primeiro no da cadeia: refaz busca rapida */
          return dbGetAllByIndex('messages', 'conv_id', convId).then(function(all){
            var byId = {}; all.forEach(function(x){ byId[x.id]=x; });
            var rootId = parentId;
            var guard = 0;
            while(rootId && byId[rootId] && byId[rootId].parent_id!==ROOT_KEY && guard<10000){ rootId = byId[rootId].parent_id; guard++; }
            rec.root_msg_id = rootId || null;
            return dbPut('conversations', rec);
          });
        }
        return dbPut('conversations', rec);
      });
    });
  }

  /* saveConvs() dispara 2x por turno (apos empurrar a msg do usuario, e de
     novo apos a resposta do assistente); cada uma aciona uma reconciliacao
     assincrona. Sem serializar, duas chamadas sobrepostas podem ambas
     deixar de encontrar a mesma mensagem-raiz ainda nao commitada e criar
     duplicatas (cada dbGet/dbPut abre sua propria transacao curta, sem
     lock entre "achar" e "criar"). Uma fila global resolve isso: toda
     reconciliacao (captura continua, migracao, chamadas de teste) passa
     por aqui e roda em sequencia, nunca em paralelo. */
  var reconcileQueue = Promise.resolve();

  function reconcileModeInner(mode){
    var entry = findModeKeyEntry(mode);
    if(!entry) return Promise.resolve();
    var arr = lsGetArr(entry.cv);
    var chain = Promise.resolve();
    arr.forEach(function(c){
      chain = chain.then(function(){ return reconcileConv(mode, c)['catch'](noop); });
    });
    return chain;
  }

  function reconcileMode(mode){
    reconcileQueue = reconcileQueue.then(function(){ return reconcileModeInner(mode); })['catch'](noop);
    return reconcileQueue;
  }

  function reconcileAllModes(){
    var last = Promise.resolve();
    getModeKeys().forEach(function(entry){ last = reconcileMode(entry.mode); });
    return last;
  }

  /* ---------------------------------------------------------------- */
  /* 2b) Migracao one-shot por VISAO (Onda 1 / VF4): os 3 modos legados */
  /*    continuam 100% sob o flag global MIGRATED_LS_FLAG (runMigration */
  /*    abaixo, intocado). Visoes dinamicas (custom, criadas depois do  */
  /*    primeiro boot -- portanto depois do flag global ja ter virado   */
  /*    '1') ganham um flag PROPRIO por slug, generalizando o mesmo     */
  /*    nome-base (`cylinderui-idb-migrated-v1:<slug>`), guardado so na    */
  /*    1a vez que essa visao e' vista -- seja na inicializacao         */
  /*    (migrateKnownDynamicModes, chamado no boot) seja ao ativar a    */
  /*    visao (via captureNow(), disparado pelo wrap de saveConvs() que */
  /*    o proprio applyMode() nativo chama durante activateVision()).   */
  /*    reconcileMode() em si ja e' idempotente (casa irmaos por        */
  /*    role+content) -- o flag e' so uma otimizacao pra nao rescanear  */
  /*    o array inteiro de novo a cada saveConvs() sucessivo. */
  function modeMigratedFlagKey(mode){ return MIGRATED_LS_FLAG + ':' + mode; }

  function ensureModeMigrated(mode){
    if(mode==null || isLegacyMode(mode)) return Promise.resolve();
    var flagKey = modeMigratedFlagKey(mode);
    var already = false;
    try{ already = localStorage.getItem(flagKey)==='1'; }catch(e){}
    if(already) return Promise.resolve();
    return reconcileMode(mode).then(function(){
      try{ localStorage.setItem(flagKey,'1'); }catch(e){}
    })['catch'](noop);
  }

  function migrateKnownDynamicModes(){
    var entries = getModeKeys();
    var chain = Promise.resolve();
    entries.forEach(function(entry){
      if(isLegacyMode(entry.mode)) return;
      chain = chain.then(function(){ return ensureModeMigrated(entry.mode); });
    });
    return chain['catch'](noop);
  }

  /* ---------------------------------------------------------------- */
  /* 3) Migracao inicial (idempotente por flag + pelo proprio          */
  /*    algoritmo de reconciliacao, que nunca duplica).                */
  /* ---------------------------------------------------------------- */
  function runMigration(){
    var already = false;
    try{ already = localStorage.getItem(MIGRATED_LS_FLAG)==='1'; }catch(e){}
    var check = already ? Promise.resolve(true) : dbGet('meta','migrated_from_localstorage').then(function(m){ return !!(m && m.value); })['catch'](function(){ return false; });
    return check.then(function(done){
      if(done) return;
      return reconcileAllModes().then(function(){
        return dbPut('meta', { key:'migrated_from_localstorage', value:true, migrated_at: nowTs() });
      }).then(function(){
        try{ localStorage.setItem(MIGRATED_LS_FLAG,'1'); }catch(e){}
      });
    })['catch'](noop);
  }

  /* ---------------------------------------------------------------- */
  /* 4) Captura continua: encadeia sobre window.saveConvs (padrao      */
  /*    _orig + flag, igual dir-js/modelstore-js). Nunca deixa erro    */
  /*    escapar para o chamador original.                              */
  /* ---------------------------------------------------------------- */
  function captureNow(){
    try{
      var mode = resolveActiveMode();
      /* Migracao one-shot por visao (2b): so faz trabalho de verdade na
         1a vez que `mode` e' visto (custom/dinamico); pra modos legados e'
         sempre um no-op imediato. Cobre "ao ativar visao" -- activateVision()
         do visions-js chama applyMode(), que chama saveConvs() nativo, que e'
         exatamente o que dispara este captureNow() via installSaveConvsWrap. */
      return ensureModeMigrated(mode)['catch'](noop).then(function(){
        return reconcileMode(mode)['catch'](noop);
      }).then(function(){
        /* re-decora o thread apos a reconciliacao assentar -- assim a
           navegacao ‹ i/n › aparece assim que o branch e persistido, sem
           esperar o proximo render completo. */
        try{ decorateThread(); }catch(e){}
      });
    }catch(e){ /* nunca propaga */ return Promise.resolve(); }
  }

  function installSaveConvsWrap(){
    if(typeof window.saveConvs==='function' && !window.saveConvs.__convIdbPatched){
      var _origSaveConvs = window.saveConvs;
      window.saveConvs = function(){
        var r = _origSaveConvs.apply(this, arguments);
        try{ captureNow(); }catch(e){}
        return r;
      };
      window.saveConvs.__convIdbPatched = true;
      return true;
    }
    return typeof window.saveConvs==='function' && !!window.saveConvs.__convIdbPatched;
  }

  /* ---------------------------------------------------------------- */
  /* 5) Branching: irmaos por parent_id, navegacao e edicao            */
  /* ---------------------------------------------------------------- */
  function walkBack(byId, leafId){
    var path = [];
    var cur = leafId, guard=0;
    while(cur && byId[cur] && guard<10000){ path.unshift(byId[cur]); cur = byId[cur].parent_id; guard++; }
    return path;
  }

  function latestChild(byParent, parentId, excludeId){
    var kids = byParent[parentId] || [];
    var best = null;
    kids.forEach(function(k){
      if(excludeId!=null && k.id===excludeId) return;
      if(!best || (k.created||0) > (best.created||0)) best = k;
    });
    return best;
  }

  function forwardExtend(byParent, startNode){
    var path = [startNode];
    var cur = startNode;
    var guard = 0;
    while(guard<10000){
      var next = latestChild(byParent, cur.id, null);
      if(!next) break;
      path.push(next); cur = next; guard++;
    }
    return path;
  }

  function loadTreeForConv(convId){
    return dbGetAllByIndex('messages','conv_id',convId).then(function(all){
      var byId = {}, byParent = {};
      all.forEach(function(m){
        byId[m.id] = m;
        var pk = (m.parent_id==null?'null':m.parent_id);
        if(!byParent[pk]) byParent[pk] = [];
        byParent[pk].push(m);
      });
      return { all:all, byId:byId, byParent:byParent };
    });
  }

  function siblingsOf(tree, node){
    var pk = (node.parent_id==null?'null':node.parent_id);
    var list = (tree.byParent[pk] || []).slice().sort(function(a,b){ return (a.created||0)-(b.created||0); });
    var idx = -1;
    for(var i=0;i<list.length;i++){ if(list[i].id===node.id){ idx=i; break; } }
    return { list:list, index:idx };
  }

  /* Reescreve a conversa VIVA (window.curConv()) a partir de um caminho
     de nos (role/content/tools) e re-renderiza usando as proprias funcoes
     nativas expostas em window (renderConvs/renderThread/saveConvs), que
     operam por referencia sobre o array fechado `convs`/`currentId` -- por
     isso funcionam mesmo sem acesso direto a essas variaveis. */
  function applyPathToLiveConv(path){
    if(typeof window.curConv!=='function' || typeof window.saveConvs!=='function') return false;
    var c = window.curConv();
    if(!c) return false;
    c.messages = path.map(function(n){ return { role:n.role, content:n.content, tools:n.tools||undefined }; });
    window.saveConvs();
    if(typeof window.renderConvs==='function') window.renderConvs();
    if(typeof window.renderThread==='function') window.renderThread();
    return true;
  }

  function currentModeConvId(){
    var mode = resolveActiveMode();
    var entry = findModeKeyEntry(mode);
    if(!entry) return null;
    var curId = null;
    try{ curId = JSON.parse(localStorage.getItem(entry.cur) || 'null'); }catch(e){}
    if(curId==null){
      /* entry.cur pode estar preso no modo do load inicial (mesma limitacao
         registrada pro pack); se a chave `<modo>-current` nao bater, cai pro
         id da conversa viva direto -- window.curConv() ja e a fonte que
         resolveActiveMode() usou pra achar `mode` em primeiro lugar. */
      try{
        if(typeof window.curConv==='function'){
          var live = window.curConv();
          if(live && live.id!=null) curId = live.id;
        }
      }catch(e){}
    }
    if(curId==null) return null;
    return { mode:mode, localId:curId, convId: computeConvIdbConvKey(mode, curId) };
  }

  /* Editar mensagem de usuario no indice `idx` (posicao dentro do
     array vivo `c.messages`): trunca o array vivo a partir de idx e
     reenvia o texto editado pelo fluxo nativo (window.sendMessage),
     que gera nova resposta. A reconciliacao (item 2) detecta a
     divergencia de conteudo na mesma posicao e cria um IRMAO novo,
     preservando o ramo antigo intacto no IndexedDB. */
  function editUserMessageAt(idx, newText){
    if(typeof window.curConv!=='function') return;
    var c = window.curConv();
    if(!c || !Array.isArray(c.messages)) return;
    if(idx<0 || idx>=c.messages.length) return;
    c.messages.length = idx; /* trunca -- remove a mensagem editada e tudo depois */
    if(typeof window.renderThread==='function') window.renderThread();
    if(typeof window.sendMessage==='function'){
      window.sendMessage(newText);
    } else if(typeof window.saveConvs==='function'){
      c.messages.push({ role:'user', content:newText });
      window.saveConvs();
      if(typeof window.renderConvs==='function') window.renderConvs();
      if(typeof window.renderThread==='function') window.renderThread();
    }
  }

  /* Troca para o irmao `targetNode` na posicao `idx`: reconstroi o
     caminho ate ali + continuacao (heuristica: filho mais recente em
     cada bifurcacao seguinte) e aplica na conversa viva. */
  function switchSiblingAt(convId, idx, targetNode){
    return loadTreeForConv(convId).then(function(tree){
      var ext = forwardExtend(tree.byParent, targetNode);
      var prefix = [];
      if(idx>0){
        var cur = tree.byId[targetNode.parent_id];
        var back = [];
        var guard=0;
        while(cur && guard<10000){ back.unshift(cur); cur = tree.byId[cur.parent_id]; guard++; }
        prefix = back;
      }
      var full = prefix.concat(ext);
      applyPathToLiveConv(full);
    })['catch'](noop);
  }

  /* ---------------------------------------------------------------- */
  /* 6) UI: decoracao de balao de usuario (editar + navegacao ‹ i/n ›) */
  /* ---------------------------------------------------------------- */
  var EDIT_ICON = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 13.5V16h2.5l7-7-2.5-2.5-7 7z"/><path d="M12.5 5l2.5 2.5"/></svg>';

  function decorateThread(){
    var thread = document.getElementById('thread');
    if(!thread) return;
    var nodes = thread.querySelectorAll ? thread.querySelectorAll('.msg') : [];
    var info = currentModeConvId();
    if(!info){
      /* sem conversa atual: ainda assim garante que nao ha resto de UI orfa */
      return;
    }
    loadTreeForConv(info.convId).then(function(tree){
      /* mapeamento posicional: usamos a ordem dos nos no caminho ATIVO
         (root..current_leaf_id da conversa), que deve ter o mesmo
         tamanho que o array `messages` renderizado, pois a reconciliacao
         roda a cada saveConvs(). */
      return dbGet('conversations', info.convId).then(function(convRec){
        if(!convRec || convRec.current_leaf_id==null) return;
        var activePath = walkBack(tree.byId, convRec.current_leaf_id);
        for(var i=0;i<nodes.length && i<activePath.length;i++){
          decorateNode(nodes[i], tree, activePath[i], i, info.convId);
        }
      });
    })['catch'](noop);
  }

  function decorateNode(domNode, tree, treeNode, idx, convId){
    if(!domNode) return;
    /* Reconstroi o controle sempre (em vez de decorar so uma vez): o
       numero de irmaos pode mudar depois que o DOM ja foi montado, porque
       a reconciliacao com o IndexedDB roda em segundo plano (assincrona,
       apos o saveConvs() que disparou o append do balao). Sem isso, o
       primeiro branch de uma mensagem podia nunca ganhar a navegacao ‹ i/n
       › ate o proximo render completo. */
    var old = domNode.querySelector ? domNode.querySelector('.conv-ctrl-row') : null;
    if(old && old.parentNode) old.parentNode.removeChild(old);
    domNode.setAttribute('data-conv-decorated','1');
    var body = domNode.querySelector ? domNode.querySelector('.body') : null;
    var isUser = (domNode.className||'').indexOf('user')>=0;
    var ctrlRow = el('span','conv-ctrl-row');

    if(isUser){
      var editBtn = el('button','conv-edit-btn',EDIT_ICON);
      editBtn.type = 'button';
      editBtn.title = 'Editar mensagem (cria um novo ramo)';
      editBtn.onclick = function(ev){
        ev.stopPropagation();
        var cur = treeNode.content;
        var next = (typeof window.prompt==='function') ? window.prompt('Editar mensagem:', cur) : null;
        if(next==null) return;
        next = next.trim();
        if(!next || next===cur) return;
        editUserMessageAt(idx, next);
      };
      ctrlRow.appendChild(editBtn);
    }

    var sib = siblingsOf(tree, treeNode);
    if(sib.list.length>1){
      var nav = el('span','conv-nav');
      var prevBtn = el('button','',''); prevBtn.type='button'; prevBtn.textContent='‹';
      var label = el('span','',(sib.index+1)+'/'+sib.list.length);
      var nextBtn = el('button','',''); nextBtn.type='button'; nextBtn.textContent='›';
      prevBtn.disabled = sib.index<=0;
      nextBtn.disabled = sib.index>=sib.list.length-1;
      prevBtn.onclick = function(ev){
        ev.stopPropagation();
        if(sib.index<=0) return;
        switchSiblingAt(convId, idx, sib.list[sib.index-1]);
      };
      nextBtn.onclick = function(ev){
        ev.stopPropagation();
        if(sib.index>=sib.list.length-1) return;
        switchSiblingAt(convId, idx, sib.list[sib.index+1]);
      };
      nav.appendChild(prevBtn); nav.appendChild(label); nav.appendChild(nextBtn);
      ctrlRow.appendChild(nav);
    }

    if(ctrlRow.childNodes.length && body && body.parentNode){
      body.parentNode.appendChild(ctrlRow);
    }
  }

  function installThreadObserver(){
    var thread = document.getElementById('thread');
    if(!thread || typeof MutationObserver==='undefined') return;
    var mo = new MutationObserver(function(){ try{ decorateThread(); }catch(e){} });
    mo.observe(thread, { childList:true });
    try{ decorateThread(); }catch(e){}
  }

  /* ---------------------------------------------------------------- */
  /* 7) Sidebar/painel de conversas (busca, renomear, apagar, carregar) */
  /* ---------------------------------------------------------------- */
  var panelOv, panelModal, panelList, panelSearch, panelMsg, importInput;

  function fmtDate(ts){ try{ return new Date(ts).toLocaleString(); }catch(e){ return ''; } }

  function setPanelMsg(t, err){
    if(!panelMsg) return;
    if(!t){ panelMsg.style.display='none'; return; }
    panelMsg.style.display='block';
    panelMsg.className = 'conv-msg' + (err?' err':'');
    panelMsg.textContent = t;
  }

  function loadPathForConv(convRec, tree){
    if(!convRec || convRec.current_leaf_id==null) return [];
    return walkBack(tree.byId, convRec.current_leaf_id);
  }

  function refreshPanel(filterText){
    if(!panelList) return;
    setPanelMsg('Carregando...');
    var mode = resolveActiveMode();
    dbGetAllByIndex('conversations','mode',mode).then(function(convs){
      convs = convs.slice().sort(function(a,b){ return (b.updated||0)-(a.updated||0); });
      var q = (filterText||'').trim().toLowerCase();
      var filterPromise = Promise.resolve(convs);
      if(q){
        filterPromise = dbGetAll('messages').then(function(allMsgs){
          var contentByConv = {};
          allMsgs.forEach(function(m){
            if(!contentByConv[m.conv_id]) contentByConv[m.conv_id]='';
            contentByConv[m.conv_id]+= ' ' + (m.content||'');
          });
          return convs.filter(function(c){
            var hay = ((c.title||'') + ' ' + (contentByConv[c.id]||'')).toLowerCase();
            return hay.indexOf(q)>=0;
          });
        });
      }
      return filterPromise;
    }).then(function(convs){
      setPanelMsg('');
      panelList.innerHTML='';
      if(!convs.length){
        panelList.appendChild(el('div','conv-empty','Nenhuma conversa encontrada.'));
        return;
      }
      convs.forEach(function(c){
        var row = el('div','conv-row');
        var t = el('div','conv-t');
        var titleEl = el('b'); titleEl.textContent = c.title || '(sem titulo)';
        var dateEl = el('i'); dateEl.textContent = fmtDate(c.updated);
        t.appendChild(titleEl); t.appendChild(dateEl);
        var acts = el('div','conv-acts');
        var rn = el('button','','✎'); rn.type='button'; rn.title='Renomear';
        var dl = el('button','conv-del','✕'); dl.type='button'; dl.title='Apagar (somente do IndexedDB)';
        rn.onclick = function(ev){ ev.stopPropagation(); renamePanelConv(c); };
        dl.onclick = function(ev){ ev.stopPropagation(); deletePanelConv(c); };
        acts.appendChild(rn); acts.appendChild(dl);
        row.appendChild(t); row.appendChild(acts);
        row.onclick = function(){ loadPanelConv(c); };
        panelList.appendChild(row);
      });
    })['catch'](function(e){ setPanelMsg('Falha ao listar: '+e, true); });
  }

  function renamePanelConv(c){
    var n = (typeof window.prompt==='function') ? window.prompt('Renomear conversa:', c.title) : null;
    if(n==null) return;
    n = n.trim(); if(!n) return;
    c.title = n; c.updated = nowTs();
    dbPut('conversations', c).then(function(){ refreshPanel(panelSearch?panelSearch.value:''); })['catch'](noop);
  }

  function deletePanelConv(c){
    var ok = (typeof window.confirm==='function') ? window.confirm('Apagar esta conversa do historico (IndexedDB)? O localStorage nao e alterado.') : true;
    if(!ok) return;
    dbGetAllByIndex('messages','conv_id',c.id).then(function(msgs){
      var chain = Promise.resolve();
      msgs.forEach(function(m){ chain = chain.then(function(){ return dbDelete('messages', m.id); }); });
      return chain;
    }).then(function(){ return dbDelete('conversations', c.id); })
      .then(function(){ refreshPanel(panelSearch?panelSearch.value:''); })
      ['catch'](noop);
  }

  function loadPanelConv(c){
    loadTreeForConv(c.id).then(function(tree){
      var path = loadPathForConv(c, tree);
      var localId = c.id.indexOf(':')>=0 ? c.id.slice(c.id.indexOf(':')+1) : c.id;
      if(typeof window.newConv!=='function' || typeof window.saveConvs!=='function') return;
      var nc = window.newConv();
      nc.id = localId;
      nc.title = c.title;
      nc.messages = path.map(function(n){ return { role:n.role, content:n.content, tools:n.tools||undefined }; });
      window.saveConvs();
      if(typeof window.renderConvs==='function') window.renderConvs();
      if(typeof window.renderThread==='function') window.renderThread();
      closePanel();
    })['catch'](noop);
  }

  function buildPanel(){
    panelOv = el('div','conv-ov'); panelOv.id='convPanelOv';
    panelModal = el('div','conv-modal');
    var head = el('div','conv-head','<b>Histórico de conversas</b>');
    var close = el('button','conv-x',null); close.type='button'; close.innerHTML='&#10005;'; close.onclick=closePanel;
    head.appendChild(close);

    var bar = el('div','conv-bar');
    panelSearch = el('input'); panelSearch.type='text'; panelSearch.placeholder='Buscar por título ou conteúdo...';
    panelSearch.oninput = function(){ refreshPanel(panelSearch.value); };
    var expCur = el('button','ex-btn',null); expCur.type='button'; expCur.textContent='Exportar esta';
    expCur.onclick = exportCurrent;
    var expAll = el('button','ex-btn',null); expAll.type='button'; expAll.textContent='Exportar tudo';
    expAll.onclick = exportAll;
    var impBtn = el('button','ex-btn',null); impBtn.type='button'; impBtn.textContent='Importar';
    importInput = el('input','conv-import-input'); importInput.type='file'; importInput.accept='application/json,.json';
    importInput.onchange = function(){ if(importInput.files && importInput.files[0]) importFile(importInput.files[0]); };
    impBtn.onclick = function(){ importInput.value=''; importInput.click(); };
    bar.appendChild(panelSearch); bar.appendChild(expCur); bar.appendChild(expAll); bar.appendChild(impBtn); bar.appendChild(importInput);

    panelMsg = el('div','conv-msg'); panelMsg.style.display='none';
    panelList = el('div','conv-list-wrap');

    panelModal.appendChild(head); panelModal.appendChild(bar); panelModal.appendChild(panelMsg); panelModal.appendChild(panelList);
    panelOv.appendChild(panelModal);
    panelOv.onclick = function(ev){ if(ev.target===panelOv) closePanel(); };
    document.body.appendChild(panelOv);
    document.addEventListener('keydown', function(ev){ if(ev.key==='Escape' && panelOv.className.indexOf('open')>=0) closePanel(); });
  }

  function openPanel(){ if(!panelOv) buildPanel(); panelOv.className='conv-ov open'; refreshPanel(''); }
  function closePanel(){ if(panelOv) panelOv.className='conv-ov'; }

  /* ---------------------------------------------------------------- */
  /* 8) Export / Import JSON                                           */
  /* ---------------------------------------------------------------- */
  var EXPORT_SCHEMA_VERSION = 1;

  function downloadBlob(filename, text){
    try{
      var blob = new Blob([text], { type:'application/json' });
      var url = URL.createObjectURL(blob);
      var a = el('a'); a.href=url; a.download=filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ try{ URL.revokeObjectURL(url); }catch(e){} }, 1000);
    }catch(e){ setPanelMsg('Falha ao gerar download: '+e, true); }
  }

  function buildExportPayload(conversations, messages){
    return JSON.stringify({
      schema_version: EXPORT_SCHEMA_VERSION,
      exported_at: nowTs(),
      conversations: conversations,
      messages: messages
    }, null, 2);
  }

  function exportCurrent(){
    var info = currentModeConvId();
    if(!info){ setPanelMsg('Nenhuma conversa atual para exportar.', true); return; }
    Promise.all([ dbGet('conversations', info.convId), dbGetAllByIndex('messages','conv_id', info.convId) ])
      .then(function(res){
        var conv = res[0], msgs = res[1];
        if(!conv){ setPanelMsg('Conversa atual ainda nao sincronizada.', true); return; }
        var payload = buildExportPayload([conv], msgs);
        downloadBlob('conversa-'+info.localId+'.json', payload);
      })['catch'](function(e){ setPanelMsg('Falha ao exportar: '+e, true); });
  }

  function exportAll(){
    Promise.all([ dbGetAll('conversations'), dbGetAll('messages') ])
      .then(function(res){
        var payload = buildExportPayload(res[0], res[1]);
        downloadBlob('conversas-cylinderui-'+nowTs()+'.json', payload);
      })['catch'](function(e){ setPanelMsg('Falha ao exportar: '+e, true); });
  }

  function validateImportPayload(obj){
    if(!obj || typeof obj!=='object') return false;
    if(!Array.isArray(obj.conversations) || !Array.isArray(obj.messages)) return false;
    for(var i=0;i<obj.conversations.length;i++){
      var c = obj.conversations[i];
      if(!c || typeof c.id!=='string' || typeof c.title!=='string') return false;
    }
    for(var j=0;j<obj.messages.length;j++){
      var m = obj.messages[j];
      if(!m || typeof m.id!=='string' || typeof m.conv_id!=='string' || typeof m.role!=='string' || !('content' in m)) return false;
    }
    return true;
  }

  function importPayload(obj){
    if(!validateImportPayload(obj)) return Promise.reject(new Error('schema invalido'));
    var addedConv=0, addedMsg=0, skippedConv=0, skippedMsg=0;
    var chain = Promise.resolve();
    obj.conversations.forEach(function(c){
      chain = chain.then(function(){
        return dbGet('conversations', c.id).then(function(existing){
          if(existing){ skippedConv++; return; }
          return dbPut('conversations', c).then(function(){ addedConv++; });
        });
      });
    });
    obj.messages.forEach(function(m){
      chain = chain.then(function(){
        return dbGet('messages', m.id).then(function(existing){
          if(existing){ skippedMsg++; return; }
          return dbPut('messages', m).then(function(){ addedMsg++; });
        });
      });
    });
    return chain.then(function(){
      return { addedConv:addedConv, addedMsg:addedMsg, skippedConv:skippedConv, skippedMsg:skippedMsg };
    });
  }

  function importFile(file){
    setPanelMsg('Importando...');
    var rd = new FileReader();
    rd.onload = function(){
      var obj;
      try{ obj = JSON.parse(String(rd.result)); }
      catch(e){ setPanelMsg('JSON invalido.', true); return; }
      importPayload(obj).then(function(res){
        setPanelMsg('Importado: '+res.addedConv+' conversa(s), '+res.addedMsg+' mensagem(ns). ('+res.skippedConv+'/'+res.skippedMsg+' ja existiam)');
        refreshPanel(panelSearch?panelSearch.value:'');
      })['catch'](function(e){ setPanelMsg('Falha ao importar: '+(e&&e.message?e.message:e), true); });
    };
    rd.onerror = function(){ setPanelMsg('Falha ao ler arquivo.', true); };
    rd.readAsText(file);
  }

  /* ---------------------------------------------------------------- */
  /* 9) Botao de topbar (mesmo padrao de mount de rag-js/dir-js/       */
  /*    modelstore-js: polling ate #exWrap existir, grupo .rag-actions */
  /*    compartilhado, idempotente).                                   */
  /* ---------------------------------------------------------------- */
  var HIST_ICON = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 5v5l3 2"/><circle cx="10" cy="10" r="7"/></svg>';

  function mountTopbarBtn(){
    var ex = document.getElementById('exWrap');
    if(!ex || !ex.parentNode) return false;
    if(document.getElementById('convHistBtn')) return true;
    var btn = el('button','ex-btn conv-hist-btn'); btn.id='convHistBtn'; btn.type='button';
    btn.title='Histórico de conversas (IndexedDB)';
    btn.innerHTML = HIST_ICON + '<span>Histórico</span>';
    var grp = ex.parentNode.querySelector('.rag-actions');
    if(!grp){ grp = el('div','rag-actions'); ex.parentNode.insertBefore(grp, ex); grp.appendChild(ex); }
    grp.insertBefore(btn, grp.firstChild);
    btn.onclick = openPanel;
    return true;
  }

  function pollMount(){
    var n=0, t=setInterval(function(){ n++; if(mountTopbarBtn()||n>60) clearInterval(t); }, 150);
    if(document.readyState!=='loading') mountTopbarBtn();
  }

  /* ---------------------------------------------------------------- */
  /* 10) Boot                                                          */
  /* ---------------------------------------------------------------- */
  var bootReady = Promise.resolve();
  function boot(){
    try{ installSaveConvsWrap(); }catch(e){}
    bootReady = runMigration()['catch'](noop).then(function(){
      /* Migracao one-shot (2b) tambem "na inicializacao": cobre o caso
         defensivo de ja existir alguma visao dinamica resolvivel neste
         exato instante (ordem de script incomum, ou MODES pre-populado).
         No fluxo normal (conv-js roda ANTES de visions-js) isto e' um
         no-op silencioso -- getModeKeys() so enxerga os 3 legados aqui, e
         a migracao real das visoes custom acontece via captureNow() no
         primeiro applyMode()/saveConvs() disparado pela ativacao. */
      return migrateKnownDynamicModes();
    })['catch'](noop).then(function(){
      try{ installThreadObserver(); }catch(e){}
    });
    try{ pollMount(); }catch(e){}
    return bootReady;
  }

  try{ boot(); }catch(e){ /* nunca deixa o console quebrar */ }

  /* Exposto so para testes/depuracao -- nao usado pela UI nativa. */
  window.__convIdb = {
    openDb: openDb, reconcileConv: reconcileConv, reconcileMode: reconcileMode,
    reconcileAllModes: reconcileAllModes, runMigration: runMigration,
    dbGet: dbGet, dbGetAll: dbGetAll, dbGetAllByIndex: dbGetAllByIndex, dbPut: dbPut, dbDelete: dbDelete,
    detectMode: detectMode, resolveActiveMode: resolveActiveMode, findModeForConv: findModeForConv, captureNow: captureNow,
    editUserMessageAt: editUserMessageAt, switchSiblingAt: switchSiblingAt,
    loadTreeForConv: loadTreeForConv, siblingsOf: siblingsOf, walkBack: walkBack,
    currentModeConvId: currentModeConvId, applyPathToLiveConv: applyPathToLiveConv,
    exportCurrent: exportCurrent, exportAll: exportAll, importPayload: importPayload,
    validateImportPayload: validateImportPayload, buildExportPayload: buildExportPayload,
    openPanel: openPanel, closePanel: closePanel, refreshPanel: refreshPanel,
    loadPanelConv: loadPanelConv, renamePanelConv: renamePanelConv, deletePanelConv: deletePanelConv,
    decorateThread: decorateThread, LEGACY_MODE_KEYS: LEGACY_MODE_KEYS,
    getModeKeys: getModeKeys, isLegacyMode: isLegacyMode, ensureModeMigrated: ensureModeMigrated,
    migrateKnownDynamicModes: migrateKnownDynamicModes, computeConvIdbConvKey: computeConvIdbConvKey,
    get ready(){ return bootReady; }
  };
})();
</script>

<script id="providers-js">
/* PATCH-PROVIDERS-V1 (Onda 2 / F3 -- paridade llama.ui: seletor de provider LAN)
   Nao destrutivo. Dois pedacos independentes:
   1) Wrap ENCADEADO (4o) de window.chatPayload -- mesmo molde _orig+flag dos 3
      wraps ja existentes (guard/protect-prompt, dir-js/__dirPatched,
      modelstore-js/__msExecPatched): guarda _orig, reatribui window.chatPayload,
      chama a ref anterior via _orig.apply e SO ENTAO acrescenta pl.provider.
      Roda de imediato (fora do polling de montagem de UI), pois so depende de
      chatPayload existir -- nao do DOM.
   2) UI: seletor discreto de provider ao lado de #modelBtn dentro de .comp-bar
      (contrato Onda 0, secao [3] do context-pack) -- polling ate existir, GET
      /api/providers (contrato secao [5]/[8]), fallback silencioso p/ "local"
      em qualquer erro, oculto quando so ha "local".
   Se qualquer etapa falhar, nunca lanca excecao pro console -- na pior hipotese
   o seletor de provider nao aparece e o payload de chat continua sem
   `provider` (=> comportamento identico ao atual, default local). */
(function(){
  var LS_KEY='cylinderui-provider';
  var LOCAL_ID='local';
  var LOCAL_LABEL='Local';
  var API_LIST='/api/providers';
  var API_TEST='/api/providers/test';

  var provList=[{id:LOCAL_ID,nome:LOCAL_LABEL,tipo:'local'}];
  var provCurrent=LOCAL_ID;
  try{
    var saved=localStorage.getItem(LS_KEY);
    if(saved) provCurrent=saved;
  }catch(e){}

  /* ------------------------------------------------------------------ */
  /* 1) chatPayload -- 4o wrap da cadeia (guard -> dir-js -> modelstore-js */
  /*    -> este). Nunca redefine o corpo original, so envolve por cima.   */
  /*    default null == "local" (contrato secao [8]: comportamento atual  */
  /*    intocado quando o usuario nao troca de provider).                 */
  /* ------------------------------------------------------------------ */
  try{
    if(typeof chatPayload==='function' && !chatPayload.__provPatched){
      var _origChatPayloadProv=chatPayload;
      window.chatPayload=function(){
        var pl=_origChatPayloadProv.apply(this,arguments);
        try{
          var pid=provCurrent||LOCAL_ID;
          pl.provider=(pid===LOCAL_ID)? null : pid;
        }catch(e){}
        return pl;
      };
      window.chatPayload.__provPatched=true;
    }
  }catch(e){}

  /* ------------------------------------------------------------------ */
  /* API de debug/teste (mesmo espirito de window.__convIdb no patch W1) */
  /* ------------------------------------------------------------------ */
  var provReadyPromise=null;
  window.__providersPatch={
    list:function(){ return provList.slice(); },
    current:function(){ return provCurrent; },
    select:function(id){ selectProvider(id); },
    test:function(){ return runTest(); },
    fetchProviders:function(){ return fetchProviders(); },
    /* provReadyPromise so' existe depois que mount() roda (polling ate
       .comp-bar/#modelBtn existirem -- normalmente 1a tentativa, ate 9s no
       pior caso). ready() espera esse polling terminar antes de resolver,
       em vez de assumir que ja rodou -- evita corrida em quem chama isto
       logo depois de instalar o patch (ex.: suite de teste). */
    ready:function(){
      return new Promise(function(resolve){
        var n=0;
        var iv=setInterval(function(){
          n++;
          if(provReadyPromise){ clearInterval(iv); resolve(provReadyPromise); }
          else if(n>100){ clearInterval(iv); resolve(false); } // timeout de seguranca (~10s)
        }, 20);
      });
    },
    isVisible:function(){ return !!(wrap && !wrap.hidden); }
  };

  if(document.getElementById('provBtn')) return; // ja montado (idempotencia de UI)

  function el(t,c,h){ var e=document.createElement(t); if(c) e.className=c; if(h!=null) e.innerHTML=h; return e; }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function safeJson(r){ return r.json().catch(function(){ return {}; }); }
  function findProv(id){
    for(var i=0;i<provList.length;i++){ if(provList[i].id===id) return provList[i]; }
    return null;
  }

  function fetchProviders(){
    return fetch(API_LIST,{headers:{'Accept':'application/json'}})
      .then(function(r){ if(!r || !r.ok) throw new Error('http'); return safeJson(r); })
      .then(function(d){
        var raw=(d && (d.providers||d.data)) || (Object.prototype.toString.call(d)==='[object Array]'? d : []);
        var extra=[];
        (raw||[]).forEach(function(p){
          if(!p || !p.id || p.id===LOCAL_ID) return; // ignora entradas invalidas / duplicando "local"
          extra.push({ id:p.id, nome:p.nome||p.name||p.id, base_url:p.base_url||'', tipo:p.tipo||'openai-compatible' });
        });
        provList=[{id:LOCAL_ID,nome:LOCAL_LABEL,tipo:'local'}].concat(extra);
        return true;
      })
      .catch(function(){
        /* fallback silencioso: so' "local" -- nunca quebra o envio */
        provList=[{id:LOCAL_ID,nome:LOCAL_LABEL,tipo:'local'}];
        if(!findProv(provCurrent)) provCurrent=LOCAL_ID;
        return false;
      })
      .then(function(ok){
        refreshUI();
        return ok;
      });
  }

  /* ------------------------------------------------------------------ */
  /* 2) UI -- montagem discreta ao lado de #modelBtn dentro de .comp-bar */
  /* ------------------------------------------------------------------ */
  var wrap=null, btn=null, label=null, menu=null, testBtn=null, testResult=null;

  function buildUI(compBar, modelBtn){
    wrap=el('div','prov-wrap'); wrap.id='provWrap'; wrap.hidden=true; // some ate saber quantos providers ha
    btn=el('button','prov-btn'); btn.id='provBtn'; btn.type='button'; btn.title='Provedor';
    btn.innerHTML='<span id="provBtnLabel">'+esc(LOCAL_LABEL)+'</span> '+
      '<svg class="chev" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8l4 4 4-4"/></svg>';
    label=btn.querySelector('#provBtnLabel');
    btn.onclick=function(ev){ if(ev) ev.stopPropagation(); toggleMenu(); };
    menu=el('div','prov-menu'); menu.id='provMenu'; menu.hidden=true;
    wrap.appendChild(btn); wrap.appendChild(menu);
    if(modelBtn.nextSibling) compBar.insertBefore(wrap, modelBtn.nextSibling);
    else compBar.appendChild(wrap);
    document.addEventListener('click', function(e){
      if(wrap && !menu.hidden && !wrap.contains(e.target)) closeMenu();
    });
  }

  function renderMenu(){
    if(!menu) return;
    menu.innerHTML='';
    provList.forEach(function(p){
      var item=el('button','prov-item'+(p.id===provCurrent? ' active':''));
      item.type='button';
      item.setAttribute('data-id', p.id);
      item.innerHTML='<b>'+esc(p.nome)+'</b>'+((p.id!==LOCAL_ID && p.base_url)? '<i>'+esc(p.base_url)+'</i>':'');
      item.onclick=function(ev){ if(ev) ev.stopPropagation(); selectProvider(p.id); };
      menu.appendChild(item);
    });
    var testRow=el('div','prov-test-row');
    testBtn=el('button','prov-test-btn'); testBtn.id='provTestBtn'; testBtn.type='button'; testBtn.textContent='Testar conexão';
    testBtn.onclick=function(ev){ if(ev) ev.stopPropagation(); runTest(); };
    testResult=el('span','prov-test-result'); testResult.id='provTestResult';
    testRow.appendChild(testBtn); testRow.appendChild(testResult);
    menu.appendChild(testRow);
  }

  function updateLabel(){
    if(!label) return;
    var p=findProv(provCurrent) || provList[0];
    label.textContent=p? p.nome : LOCAL_LABEL;
    if(btn){
      if(provCurrent!==LOCAL_ID) btn.classList.add('prov-nonlocal');
      else btn.classList.remove('prov-nonlocal');
    }
  }

  function applyVisibility(){
    if(!wrap) return;
    wrap.hidden = provList.length<=1; // so' "local": oculto, nao polui a UI
  }

  function refreshUI(){
    renderMenu();
    updateLabel();
    applyVisibility();
  }

  function toggleMenu(){ if(menu) menu.hidden=!menu.hidden; }
  function closeMenu(){ if(menu) menu.hidden=true; }

  function selectProvider(id){
    provCurrent=findProv(id)? id : LOCAL_ID;
    try{ localStorage.setItem(LS_KEY, provCurrent); }catch(e){}
    refreshUI();
    closeMenu();
  }

  function runTest(){
    if(!testResult) return Promise.resolve();
    var id=provCurrent;
    testResult.textContent='...';
    testResult.className='prov-test-result';
    return fetch(API_TEST,{
      method:'POST',
      headers:{'Content-Type':'application/json','Accept':'application/json'},
      body:JSON.stringify({id:id})

      return safeJson(r).then(function(d){ return {status:(r&&r.status)||0, body:d||{}}; });

      var d=res.body||{};
      if(res.status>=200 && res.status<300 && d.ok){
        testResult.textContent='ok'+(d.latency_ms!=null? ' ('+d.latency_ms+'ms)':'');
        testResult.className='prov-test-result ok';
      } else {
        testResult.textContent='erro'+(d.error? ': '+esc(d.error):'');
        testResult.className='prov-test-result err';
      }
    }).catch(function(){
      testResult.textContent='erro de rede';
      testResult.className='prov-test-result err';
    }).then(function(){
      setTimeout(function(){ if(testResult) testResult.textContent=''; }, 5000);
    });
  }

  function mount(){
    var compBar=document.querySelector('.comp-bar');
    var modelBtn=document.getElementById('modelBtn');
    if(!compBar || !modelBtn) return false;
    if(document.getElementById('provBtn')) return true;
    try{
      buildUI(compBar, modelBtn);
      refreshUI();
      provReadyPromise=fetchProviders();
    }catch(e){ /* nunca quebra o console por causa do seletor de provider */ }

  }

<script id="hl-js">
/* PATCH-HIGHLIGHT-V1 (Onda 3 / F4 -- paridade llama.ui: syntax highlighting)

   ~1.44MB, sem espaco pra lib completa).

   `formatContent()` ja gera pra blocos de resposta do assistente -- unico
   lugar no console real que usa essa classe; o terminal do Model Store usa
   `.ms-code`/`#msVbLog`, RAG/Diretorios/Model Store/Conversas/Providers tem
   suas proprias UIs -- nada disso e' tocado aqui).

   3 pecas:
   1) Deteccao de linguagem: class="language-xxx"/"lang-xxx" no <code> (
      convencao markdown generica, p/ reuso fora do console) OU texto do
      `.code-lang` do proprio bloco (convencao do CylinderUI: `formatContent`
      sempre poe lang||"text" ali) -- e, se nenhuma bater numa linguagem
      suportada, heuristica leve por conteudo. Linguagem desconhecida = nunca
      colore, texto fica intacto (nunca quebra).
   2) Highlight: tokenizer proprio por regex "sticky" (uma passada, O(n)),
      idempotente via atributo data-hl-done no <code>.
   3) Observacao: MutationObserver no #thread (container do chat, confirmado
      por grep no index.html servido) p/ pegar mensagens novas e blocos que
      crescem via streaming (o balao do assistente reescreve `body.innerHTML`
      inteiro a cada token -- cada reescrita e' um <code> NOVO, entao a
      idempotencia por atributo nunca duplica, so' evita re-processar o MESMO
      no' duas vezes).

   `<button class="code-copy">` em todo bloco, com handler delegado em
   `#thread` (confirmado por grep). Este patch so' acrescenta um se um

    { cls:'hl-str', re:/`(?:\\.|[^`\\])*`|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'/y },

  GRAMMARS.python = [
    { cls:'hl-com', re:/#[^\n]*/y },
    { cls:'hl-str', re:/(?:[rRbBfFuU]{1,2})?("""[\s\S]*?"""|'''[\s\S]*?'''|"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')/y },
    { cls:'hl-num', re:/\d+(?:\.\d+)?/y },
    { cls:'hl-kw', re:kw(['def','return','if','elif','else','for','while','break','continue','pass',

    { cls:'hl-com', re:/#[^\n]*/y },
    { cls:'hl-str', re:/"(?:\\.|[^"\\])*"|'[^']*'/y },
    { cls:'hl-var', re:/\$\{[^}]*\}|\$[A-Za-z_][A-Za-z0-9_]*|\$[0-9@*#?$!-]/y },

      'set','unset','source','alias','trap']) },

  ];

  GRAMMARS.json = [
    { cls:'hl-attr', re:/"(?:\\.|[^"\\])*"(?=\s*:)/y },
    { cls:'hl-str', re:/"(?:\\.|[^"\\])*"/y },
    { cls:'hl-num', re:/-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?/y },
    { cls:'hl-kw', re:/true|false|null/y }
  ];

  GRAMMARS.html = [
    { cls:'hl-com', re:/<!--[\s\S]*?-->/y },
    { cls:'hl-str', re:/"[^"]*"|'[^']*'/y },
    { cls:'hl-tag', re:/<\/?[A-Za-z][\w:-]*/y },

  GRAMMARS.css = [
    { cls:'hl-com', re:/\/\*[\s\S]*?\*\//y },
    { cls:'hl-str', re:/"[^"]*"|'[^']*'/y },
    { cls:'hl-kw', re:/@[a-zA-Z-]+/y },
    { cls:'hl-attr', re:/[a-zA-Z-]+(?=\s*:)/y },
    { cls:'hl-num', re:/#[0-9a-fA-F]{3,8}\b|\d+(?:\.\d+)?(?:px|em|rem|%|vh|vw|s|ms|deg)?/y }

    { cls:'hl-com', re:/--[^\n]*|\/\*[\s\S]*?\*\//y },

    { cls:'hl-kw', re:kw(['select','from','where','insert','into','values','update','set','delete',

      'between','like','case','when','then','else','end','primary','key','foreign','references',
      'default','index'], 'iy') }
  ];

  GRAMMARS.yaml = [
    { cls:'hl-com', re:/#[^\n]*/y },
    { cls:'hl-str', re:/"(?:\\.|[^"\\])*"|'[^']*'/y },
    { cls:'hl-attr', re:/[ \t]*[\w.-]+(?=\s*:(?:\s|$))/my },

    js:'js', javascript:'js', mjs:'js', cjs:'js', jsx:'js', ts:'js', typescript:'js', tsx:'js', node:'js',
    py:'python', python:'python', python3:'python',
    sh:'bash', bash:'bash', shell:'bash', zsh:'bash', console:'bash', shellsession:'bash',
    json:'json', json5:'json', jsonc:'json',
    html:'html', htm:'html', xml:'html', svg:'html',
    css:'css', scss:'css', less:'css',
    sql:'sql', mysql:'sql', postgresql:'sql', postgres:'sql', psql:'sql', sqlite:'sql',
    yaml:'yaml', yml:'yaml'
  };

  /* ------------------------------------------------------------------ */
  /* Tokenizer -- uma passada por caractere, testa cada regra "sticky"    */
  /* na posicao atual; se nenhuma bater, escapa o caractere e avanca 1.   */
  /* Nunca lanca excecao pra fora (highlightBlock() ja embrulha em try).  */
  /* ------------------------------------------------------------------ */
  function tokenize(code, rules){
    var out = '', i = 0, n = code.length, guard = 0, maxGuard = n * 2 + 1000;
    while(i < n){

      var hit = null;

        var rule = rules[r];

        var m = null;
        try{ m = rule.re.exec(code); }catch(e){ m = null; }
        if(m && m[0] && m[0].length > 0){ hit = { cls: rule.cls, text: m[0] }; break; }
      }
      if(hit){
        out += '<span class="' + hit.cls + '">' + escHtml(hit.text) + '</span>';
        i += hit.text.length;
      } else {
        out += escHtml(code.charAt(i));
        i += 1;
      }

  /* Heuristica leve p/ quando nao ha class="language-xxx" nem .code-lang */
  /* reconhecivel (ex.: bar mostra "text", fallback do formatContent).    */
  /* ------------------------------------------------------------------ */
  function heuristicDetect(text){
    if(!text || !text.trim()) return null;
    var t = text, tt = text.trim();
    var scores = {};
    function add(k, n2){ scores[k] = (scores[k] || 0) + n2; }

    if(tt.charAt(0) === '{' || tt.charAt(0) === '['){
      try{ JSON.parse(tt); add('json', 10); }
      catch(e){ if(/^[\{\[][\s\S]*[\}\]]$/.test(tt)) add('json', 3); }
    }
    var tagMatches = t.match(/<\/?[a-zA-Z][^>]*>/g);
    if(tagMatches) add('html', Math.min(tagMatches.length, 6));
    if(/@media|@import|@keyframes/.test(t)) add('css', 3);
    if(/[.#]?[\w-]+\s*\{[^{}]*:[^{}]*\}/.test(t)) add('css', 3);
    if(/\b(select\s+.+\s+from|insert\s+into|update\s+\w+\s+set|delete\s+from|create\s+table)\b/i.test(t)) add('sql', 6);
    if(/^#!.*\b(bash|sh|zsh)\b/m.test(t)) add('bash', 8);
    if(/^\s*(echo|export|if \[|fi\s*$|\$\{|#!\/)/m.test(t)) add('bash', 2);
    if(/^\s*def\s+\w+\(.*\):/m.test(t)) add('python', 6);
    if(/^\s*(import\s+\w+|from\s+\w+\s+import)\b/m.test(t)) add('python', 3);
    if(/:\s*$/m.test(t) && /^\s*(if|for|while|elif|class)\b.*:$/m.test(t)) add('python', 2);
    if(/\b(function|const|let|=>|console\.log)\b/.test(t)) add('js', 3);
    if(/\bimport\s+.+\bfrom\b.*;?\s*$/m.test(t)) add('js', 2);
    if(/^[ \t]*[\w.-]+:\s*.*$/m.test(t) && !/[{};]/.test(t) && /\n/.test(t)) add('yaml', 2);
    if(/^-\s+\S/m.test(t)) add('yaml', 1);

    var best = null, bestScore = 0;
    for(var k in scores){ if(scores[k] > bestScore){ bestScore = scores[k]; best = k; } }
    return bestScore >= 3 ? best : null;
  }

  function detectLang(codeEl, raw){
    var cls = codeEl.className || '';
    var m = /\b(?:language|lang)-([a-zA-Z0-9+#-]+)\b/.exec(cls);
    var label = m ? m[1] : '';
    if(!label){
      var block = codeEl.closest ? codeEl.closest('.code-block') : null;
      if(block){
        var bar = block.querySelector('.code-lang');
        if(bar) label = (bar.textContent || '').trim();
      }
    }
    var canon = ALIASES[String(label || '').toLowerCase()];
    if(canon) return canon;
    return heuristicDetect(raw);
  }

  function highlightBlock(codeEl){
    if(!codeEl || codeEl.nodeType !== 1) return;
    if(codeEl.getAttribute('data-hl-done') === '1') return; // idempotencia
    codeEl.setAttribute('data-hl-done', '1'); // marca antes: se algo falhar no meio, nunca fica reprocessando
    try{
      var raw = codeEl.textContent;
      if(raw == null) raw = '';
      var lang = detectLang(codeEl, raw);
      if(!lang || !GRAMMARS[lang]) return; // desconhecida: fica intacta, nunca colore
      var html = tokenize(raw, GRAMMARS[lang]);
      codeEl.innerHTML = html;
      codeEl.classList.add('hl-done');
      codeEl.setAttribute('data-hl-lang', lang);
    }catch(e){ /* nunca quebra o balao por causa do highlight */ }
  }

  /* Botao "copiar" -- so' acrescenta se .code-bar existir sem           */
  /* .code-copy (o console real ja tem sempre; isto e' so' defensivo).   */
  /* ------------------------------------------------------------------ */
  function ensureCopyButton(block){
    try{
      var bar = block.querySelector('.code-bar');
      if(!bar) return;
      if(bar.querySelector('.code-copy')) return; // ja existe -- nunca duplica
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'code-copy';
      btn.textContent = 'Copiar';
      btn.addEventListener('click', function(){
        var codeEl = block.querySelector('code');
        var text = codeEl ? codeEl.textContent : '';
        var onDone = function(){
          var orig = btn.textContent;
          btn.textContent = 'Copiado';
          btn.classList.add('copied');
          setTimeout(function(){ btn.textContent = orig; btn.classList.remove('copied'); }, 1400);
        };
        if(navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(text).then(onDone, function(){});
        }
      });
      bar.appendChild(btn);
    }catch(e){}
  }

  function processBlock(block){
    ensureCopyButton(block);
    var codeEl = block.querySelector('pre > code, code');
    if(codeEl) highlightBlock(codeEl);
  }

  function scanRoot(root){
    if(!root || !root.querySelectorAll) return;
    if(root.classList && root.classList.contains('code-block')) processBlock(root);
    var blocks = root.querySelectorAll('.code-block');
    for(var i = 0; i < blocks.length; i++) processBlock(blocks[i]);
  }

  /* ------------------------------------------------------------------ */
  /* Montagem: polling ate #thread existir (mesmo padrao dos outros       */
  /* patches), scan inicial + MutationObserver p/ mensagens novas e       */
  /* blocos que crescem via streaming (cada reescrita de body.innerHTML   */
  /* e' um <code> novo -- a idempotencia por atributo cuida do resto).    */
  /* ------------------------------------------------------------------ */
  var observerRef = null;

  function mount(){
    var thread = document.getElementById('thread');
    if(!thread) return false;
    scanRoot(thread);
    if(!mount.__observing){
      try{
        observerRef = new MutationObserver(function(mutList){
          for(var i = 0; i < mutList.length; i++){
            var added = mutList[i].addedNodes;
            for(var j = 0; j < added.length; j++){
              var node = added[j];
              if(node.nodeType !== 1) continue;
              scanRoot(node);
            }
          }
        });
        observerRef.observe(thread, { childList: true, subtree: true });
        mount.__observing = true;
      }catch(e){ /* sem MutationObserver: highlight so' roda no scan inicial, nunca quebra */ }
    }
    return true;
  }

  window.__hlPatch = {
    scan: scanRoot,
    tokenize: tokenize,
    detectLang: detectLang,
    grammars: function(){ var k = [], g = GRAMMARS; for(var x in g) k.push(x); return k; },
    isObserving: function(){ return !!mount.__observing; },
    ready: function(){
      return new Promise(function(resolve){
        var n = 0;
        var iv = setInterval(function(){
          n++;
          if(mount.__observing){ clearInterval(iv); resolve(true); }
          else if(n > 100){ clearInterval(iv); resolve(false); }
        }, 20);
      });
    }
  };

  var _n = 0, _t = setInterval(function(){ _n++; if(mount() || _n > 60) clearInterval(_t); }, 150);
  if(document.readyState !== 'loading') mount();
})();
</script>

.vis-swatch.vis-selected{border-color:var(--text)}
.vis-radio-group{display:flex;flex-wrap:wrap;gap:8px}
.vis-radio-pill{border:1px solid var(--border);border-radius:999px;padding:6px 11px;font-size:12px;display:flex;align-items:center;gap:5px;background:var(--surface);cursor:pointer}
.vis-radio-pill input{margin:0}
.vis-checkbox-list{display:flex;flex-direction:column;gap:5px;max-height:160px;overflow-y:auto;border:1px solid var(--border-soft);border-radius:9px;padding:8px}
.vis-checkbox-row{display:flex;align-items:center;gap:7px;font-size:12.5px}
.vis-mode-section{border:1px dashed var(--border);border-radius:9px;padding:10px;margin-top:8px;display:none}
.vis-mode-section.vis-show{display:block}
.vis-mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vis-toggle-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.vis-switch{position:relative;width:38px;height:22px;flex-shrink:0;display:inline-block}
.vis-switch input{opacity:0;width:0;height:0}
.vis-switch-track{position:absolute;inset:0;background:var(--border);border-radius:999px;transition:.15s;cursor:pointer}
.vis-switch-track::before{content:'';position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.vis-switch input:checked+.vis-switch-track{background:var(--accent)}
.vis-switch input:checked+.vis-switch-track::before{transform:translateX(16px)}
.vis-btn{border:none;border-radius:9px;padding:9px 14px;font-weight:600;font-size:13px;cursor:pointer;font-family:var(--font-sans)}
.vis-btn-primary{background:var(--accent);color:var(--on-accent)}
.vis-btn-primary:hover{filter:brightness(1.06)}
.vis-btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
.vis-btn-ghost:hover{background:var(--surface-2)}
.vis-btn-danger{background:var(--err);color:#fff}
.vis-delete-body{padding:18px 20px;font-size:13.5px;line-height:1.6;color:var(--text)}
.vis-delete-body b{color:var(--accent)}
/* HERO da Visão (tela de boas-vindas central quando a visão fica ativa) */
.vis-hero{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;padding:52px 24px 40px}
.vis-hero-img{width:min(460px,88%);max-width:460px;max-height:360px;height:auto;object-fit:contain;border-radius:16px;box-shadow:0 10px 34px -14px rgba(0,0,0,.45)}
.vis-hero-title{font-family:var(--font-serif);font-size:27px;line-height:1.15;margin:6px 0 0;color:var(--text)}
.vis-hero-sub{color:var(--text-dim);font-size:14.5px;margin:0;max-width:460px}
.vis-hero-chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.vis-hero-chip{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:999px;padding:8px 14px;font-size:13px;cursor:pointer;font-family:var(--font-sans)}
.vis-hero-chip:hover{background:var(--surface-2)}
/* lápis 'editar hero' sobreposto na tela de boas-vindas da visão ativa */
.empty{position:relative}
.vis-hero-edit{position:absolute;top:14px;right:14px;z-index:5;display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;padding:0;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text-dim);cursor:pointer;opacity:.55;transition:opacity .18s,background .18s,color .18s,border-color .18s}
.vis-hero-edit:hover,.vis-hero-edit:focus-visible{opacity:1;background:var(--surface-2);color:var(--accent);border-color:var(--accent);outline:none}
/* Editor: seção HERO */
.vis-hero-ed-row{display:flex;gap:8px;align-items:center}
.vis-hero-ed-row input[type=text]{flex:1}
.vis-hero-preview{margin-top:8px;min-height:0}
.vis-hero-preview img{max-height:86px;max-width:180px;border-radius:10px;border:1px solid var(--border);display:block}
.vis-hero-ed-fields{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.vis-hero-chips-editor{margin-top:8px}
.vis-hero-chip-list{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.vis-hero-chip-tag{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:4px 6px 4px 11px;font-size:12px}
.vis-hero-chip-del{border:none;background:transparent;cursor:pointer;color:var(--text-dim);font-size:15px;line-height:1;padding:0 2px}
.vis-hero-chip-del:hover{color:var(--err)}
.vis-hero-chip-add{display:flex;gap:8px}
.vis-hero-chip-add input{flex:1}
#side.vis-nav-hidden .side-nav{display:none}
/* Badge (emblema por visão) no topo da sidebar, ao lado do logo CylinderUI.
   Renderizado por renderVisionBadge() a partir de vision.badge (STRING). */
.cyl-vis-badge{display:inline-flex;align-items:center;justify-content:center;flex-shrink:1;min-width:0;max-width:100%;overflow:hidden}
.cyl-vis-badge img{height:34px;width:auto;max-width:100%;object-fit:contain;display:block;border-radius:7px}
/* D5 (QA S2, 2026-08-16): flex-shrink:0 + sem min-width/overflow deixava o
   badge manter a largura "natural" da imagem e vazar pra fora da sidebar
   (overflow:hidden do #side so corta na borda da viewport, nao encolhe o
   conteudo) -- ficava cortado ilegivel sobre o header. Agora o item flex
   pode encolher (min-width:0) e o proprio holder corta em max-width:100%,
   com object-fit:contain na img evitando distorcao. */
/* Badge custom presente => suprime o emblema hardcoded lg-god (badge herdado) para
   não mostrar dois emblemas. Especificidade > `:root.god .logo.lg-god`. */
.side-brand img.logo.lg-god.cyl-vis-badge-suppress-god{display:none!important}
/* Editor: campo Badge (upload+URL+preview) + placeholder tracejado quando vazio. */
.vis-badge-ed-row{display:flex;gap:8px;align-items:center}
.vis-badge-ed-row input[type=text]{flex:1}
.vis-badge-preview{margin-top:8px;min-height:0}
.vis-badge-preview img{max-height:64px;max-width:120px;border-radius:9px;border:1px solid var(--border);display:block}
.vis-badge-placeholder{display:inline-flex;align-items:center;justify-content:center;width:54px;height:54px;border:1.5px dashed var(--border);border-radius:10px;color:var(--text-faint);background:var(--surface)}
</style>
