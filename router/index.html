  function refreshStore(){
    setMsg('msStoreMsg','Buscando…');
    var url=STORE_API+'/search?query='+encodeURIComponent(msState.q||'')+(msState.source? '&source='+encodeURIComponent(msState.source) : '');
    fetch(url,{headers:{'Accept':'application/json'}})
      .then(function(r){ if(!r.ok) throw new Error('http '+r.status); return safeJson(r); })
      .then(function(d){
        var list=(d&&(d.results||d.data||d.items)) || (Object.prototype.toString.call(d)==='[object Array]'? d : []);
        msState.searchResults=list||[];
        setMsg('msStoreMsg','');
        renderStore();
      })
      .catch(function(e){
        msState.searchResults=[];
        renderStore();
        setMsg('msStoreMsg','Falha ao buscar modelos (servidor indisponível ou sem rede). Tente novamente.',true);
      });
  }

  /* search_models() (backend real, Onda 1) devolve item.files como lista
     de NOMES de arquivo (string), nao objetos -- e o tamanho vem so como
     estimativa unica em item.size_q4_estimate_bytes (bytes), sem tamanho
     por arquivo/quant. Normaliza pros dois formatos por seguranca (caso a
     forma mude): string vira {filename,quant}; objeto e' mantido como esta. */
  function fileListOf(item){
    var files=item.files;
    if(files && files.length){
      if(typeof files[0]==='string'){
        return files.map(function(fn){
          var qm=String(fn).match(/(Q[2-8][_A-Z0-9]*|F16|BF16|FP16)/i);
          return {filename:fn, quant: qm? qm[0].toUpperCase() : fn};
        });
      }
      return files;
    }
    if(item.file) return [{filename:item.file, quant:item.quant||'', size_gb:item.size_gb}];
    return [];
  }

  function renderStore(){
    var list=(msState.searchResults||[]).slice();
    var sort=msState.sort;
    list.sort(function(a,b){
      if(sort==='likes') return (b.likes||0)-(a.likes||0);
      if(sort==='recent') return (b.date||0)-(a.date||0);
      return (b.downloads||0)-(a.downloads||0);
    });
    var g=document.getElementById('msStoreGrid'); g.innerHTML='';
    document.getElementById('msStoreEmpty').classList.toggle('hide', list.length>0);
    list.forEach(function(item){
      var repoId=item.id||item.repo_id||item.name||'';
      var name=item.name||repoId;
      var author=item.author||'';
      var src=item.source||item.src||'hf';
      var files=fileListOf(item);
      var estGb=(item.size_q4_estimate_bytes!=null)? (item.size_q4_estimate_bytes/1e9) : null;
      var card=el('div','ms-mcard');
      var quantSel='';
      if(files.length>1){
        quantSel='<select class="ms-select" data-quant style="margin-top:4px">'+files.map(function(f,i){
          return '<option value="'+i+'">'+esc(f.quant||f.filename)+(f.size_gb!=null? ' · '+gbFmt(f.size_gb):'')+'</option>';
        }).join('')+'</select>';
      }
      card.innerHTML=
        '<div class="ms-mc-top"><div class="ms-avatar">'+esc(name.charAt(0).toUpperCase())+'</div>'+
        '<div><div class="ms-mc-name">'+esc(name)+'</div><div class="ms-mc-author">'+esc(author)+(author? ' · ' : '')+esc(src==='hf'?'Hugging Face':src==='modelscope'?'ModelScope':src)+'</div></div></div>'+
        '<div class="ms-mc-desc">'+esc(item.description||item.desc||'')+'</div>'+
        '<div class="ms-badges"><span class="ms-badge">GGUF</span>'+(item.category? '<span class="ms-badge neutral">'+esc(item.category)+'</span>':'')+(estGb!=null? '<span class="ms-badge neutral">~'+gbFmt(estGb)+' (Q4 estimado)</span>':'')+'</div>'+
        quantSel+
        '<div class="ms-mc-foot">'+
          '<span style="font-size:11px;color:var(--ms-text-faint)">'+(item.downloads!=null? '⬇ '+item.downloads : '')+(item.likes!=null? '  ♥ '+item.likes : '')+'</span>'+
          '<button class="ms-btn sm" data-install data-repo="'+esc(repoId)+'" data-source="'+esc(src)+'">Instalar</button>'+
        '</div>';
      g.appendChild(card);
      card.__msFiles=files;
    });
  }

  function doInstall(btn){
    var card=btn.closest('.ms-mcard');
    var files=(card&&card.__msFiles)||[];
    var sel=card&&card.querySelector('[data-quant]');
    var idx=sel? parseInt(sel.value,10) : 0;
    var f=files[idx]||files[0]||{};
    var repo=btn.getAttribute('data-repo');
    var source=btn.getAttribute('data-source')||'hf';
    if(!repo || !f.filename){ setMsg('msStoreMsg','Este modelo não tem um arquivo GGUF identificado para instalar.',true); return; }
    btn.disabled=true; btn.textContent='Instalando…';
    fetch(STORE_API+'/install',{
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({repo_id:repo, file:f.filename, source:source})
    }).then(function(r){ return safeJson(r).then(function(j){ return {ok:r.ok,j:j}; }); })
      .then(function(res){
        if(!res.ok){ setMsg('msStoreMsg','Erro ao instalar: '+((res.j&&res.j.detail)||'falhou'),true); btn.disabled=false; btn.textContent='Instalar'; return; }
        setMsg('msStoreMsg','Download iniciado: '+repo);
        goTab('downloads');
        msFetchModelsForSelector();
      })
      .catch(function(){ setMsg('msStoreMsg','Falha ao instalar (rede/servidor indisponível).',true); btn.disabled=false; btn.textContent='Instalar'; });
  }

  /* ------------------------------------------------------------------ */
  /* 6) Aba Instalados -- ativar/visibilidade/padrao/ordem/desinstalar   */
  /*    /prune, sempre com atualizacao otimista + refresh do servidor.   */
  /* ------------------------------------------------------------------ */
  function wireInstalled(){
    document.getElementById('msInstPanel').addEventListener('click', function(e){
      var row=e.target.closest('.ms-irow'); if(!row) return;
      var id=row.getAttribute('data-id');
      var m=(msState.installed||[]).filter(function(x){ return x.id===id; })[0];
      if(!m) return;
      var idx=msState.installed.indexOf(m);

      if(e.target.closest('[data-up]')){ reorder(idx, idx-1); return; }
      if(e.target.closest('[data-down]')){ reorder(idx, idx+1); return; }
      if(e.target.closest('[data-act]')){ toggleActive(m); return; }
      var visBtn=e.target.closest('[data-vis]');
      if(visBtn){ toggleVisible(m, visBtn.getAttribute('data-vis')); return; }
      var defBtn=e.target.closest('[data-def]');
      if(defBtn){ setDefault(m, defBtn.getAttribute('data-def')); return; }
      var un=e.target.closest('[data-un]');
      if(un && !un.hasAttribute('disabled')){ doUninstall(m); return; }
    });
    document.getElementById('msPruneBtn').addEventListener('click', doPrune);
  }

  function refreshInstalled(){
    setMsg('msInstMsg','Carregando…');
    fetch(MODELS_API,{headers:{'Accept':'application/json'}})
      .then(function(r){ if(!r.ok) throw new Error('http '+r.status); return safeJson(r); })
      .then(function(d){
        var raw=(d&&(d.models||d.data)) || (Object.prototype.toString.call(d)==='[object Array]'? d : []);
        msState.installed=msNormalizeList(raw);
        msModelsData=msState.installed; msMeta=msBuildMeta(msModelsData);
        setMsg('msInstMsg','');
        renderInstalled();
        refreshKpis();
        if(panes.exec && panes.exec.classList.contains('on')) renderExecCards();
        if(panes.bench && panes.bench.classList.contains('on')) msRenderBenchTab();
      })
      .catch(function(){
        setMsg('msInstMsg','Falha ao carregar modelos instalados (servidor indisponível). Tente novamente.',true);
      });
  }

  function isDefaultAnywhere(m){ return !!(m.default_for && m.default_for.length); }

  /* PATCH-MODELSTORE-COSMETIC-4: predicado unico de "candidato a prune" --
     compartilhado entre o modal de selecao manual (buildPruneModal, botao
     "Desinstalar menos usados...") e o novo modal de preview do botao
     "Limpar nao usados" (doPrune, ex-window.confirm()). Mesma regra que ja
     existia solta dentro de msPruneCandidates(): nunca inclui modelo
     store_managed===false (externo/runtime, uninstall bloqueado no backend)
     nem modelo que seja padrao em qualquer interface. */
  function msIsPruneCandidate(m){ return !isDefaultAnywhere(m) && m.store_managed!==false; }

  function ipills(m){
    var vis=m.visible_in||[];
    var def=m.default_for||[];
    var out='';
    IFACES.forEach(function(f){
      var on=vis.indexOf(f.k)>=0, isDef=def.indexOf(f.k)>=0;
      out+='<button type="button" class="ms-ipill'+(on?' vis':'')+'" data-vis="'+f.k+'" title="Aparece no '+esc(f.n)+'">'+f.k+(isDef?' <span class="st">★</span>':'')+'</button>';
    });
    return out;
  }

  function renderInstalled(){
    var list=msState.installed||[];
    var p=document.getElementById('msInstPanel'); p.innerHTML='';
    document.getElementById('msInstEmpty').classList.toggle('hide', list.length>0);
    var nActive=0;
    list.forEach(function(m,idx){
      if(m.active) nActive++;
      var lockDef=isDefaultAnywhere(m);
      var lockExt=(m.store_managed===false);
      var lockUn=lockDef||lockExt;
      var unTitle=lockDef? 'É padrão em alguma interface'
        : (lockExt? 'Instalado fora da Model Store — para remover, edite o llama-swap.yaml manualmente' : '');
      var row=el('div','ms-irow'); row.setAttribute('data-id', m.id);
      var name=m.name||m.id;
      var quant=m.quant||'';
      var sizeGb=(m.size_gb!=null? m.size_gb : m.gb);
      row.innerHTML=
        '<div class="ms-ordbtns"><button class="ms-ordbtn" data-up type="button" '+(idx===0?'disabled':'')+' aria-label="Subir">▲</button><button class="ms-ordbtn" data-down type="button" '+(idx===list.length-1?'disabled':'')+' aria-label="Descer">▼</button></div>'+
        '<span class="ms-sw'+(m.active?' on':'')+'" data-act role="switch" aria-checked="'+(!!m.active)+'" title="'+(m.active?'Ativo':'Inativo')+'"><span class="tr"></span></span>'+
        '<div class="info"><div class="nm">'+esc(name)+(quant? ' <span class="ms-badge neutral">'+esc(quant)+'</span>':'')+
          (lockExt? ' <span class="ms-badge neutral" title="Já existia no servidor, fora da Model Store">existente</span>':'')+
          ' '+ipills(m)+'</div>'+
        '<div class="mt">'+(sizeGb!=null? gbFmt(sizeGb)+' em disco':'')+'</div></div>'+
        '<div class="acts">'+IFACES.map(function(f){
          var isDef=(m.default_for||[]).indexOf(f.k)>=0;
          return isDef? '' : '<button class="ms-btn ghost sm" type="button" data-def="'+f.k+'" title="Tornar padrão do '+esc(f.n)+'">★ '+f.k+'</button>';
        }).join('')+
        '<button class="ms-btn danger sm" type="button" data-un '+(lockUn?'disabled title="'+esc(unTitle)+'"':'')+'>Desinstalar</button></div>';
      p.appendChild(row);
    });
    document.getElementById('msKpiActive').textContent=nActive;
    var nTab=document.getElementById('msNinstalled'); if(nTab) nTab.textContent=list.length;
  }

  function patchModel(id, patch, optimisticFn){
    if(optimisticFn) optimisticFn();
    renderInstalled();
    var body={id:id};
    for(var k in patch) if(patch.hasOwnProperty(k)) body[k]=patch[k];
    return fetch(MODELS_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
      .then(function(r){ if(!r.ok) throw new Error('http '+r.status); return safeJson(r); })
      .then(function(){ refreshInstalled(); msFetchModelsForSelector(); })
      .catch(function(){ setMsg('msInstMsg','Falha ao salvar alteração — revertendo.',true); refreshInstalled(); });
  }

  function toggleActive(m){ var next=!m.active; patchModel(m.id, {active:next}, function(){ m.active=next; }); }

  function toggleVisible(m, ifaceKey){
    var vis=(m.visible_in||[]).slice();
    var i=vis.indexOf(ifaceKey);
    if(i>=0){ vis.splice(i,1); } else { vis.push(ifaceKey); }
    var def=(m.default_for||[]).slice();
    if(i>=0){ var di=def.indexOf(ifaceKey); if(di>=0) def.splice(di,1); }
    patchModel(m.id, {visible_in:vis, default_for:def}, function(){ m.visible_in=vis; m.default_for=def; });
  }

  function setDefault(m, ifaceKey){
    (msState.installed||[]).forEach(function(x){
      if(x.default_for && x.default_for.indexOf(ifaceKey)>=0){ x.default_for=x.default_for.filter(function(k){ return k!==ifaceKey; }); }
    });
    var vis=(m.visible_in||[]).slice(); if(vis.indexOf(ifaceKey)<0) vis.push(ifaceKey);
    var def=(m.default_for||[]).slice(); if(def.indexOf(ifaceKey)<0) def.push(ifaceKey);
    m.visible_in=vis; m.default_for=def;
    renderInstalled();
    fetch(MODELS_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:m.id, visible_in:vis, default_for:def})})
      .then(function(r){ if(!r.ok) throw new Error('http'); return safeJson(r); })
      .then(function(){ refreshInstalled(); msFetchModelsForSelector(); })
      .catch(function(){ setMsg('msInstMsg','Falha ao definir padrão — revertendo.',true); refreshInstalled(); });
  }

  function reorder(i,j){
    var list=msState.installed;
    if(j<0 || j>=list.length) return;
    var m=list[i];
    list.splice(i,1); list.splice(j,0,m);
    renderInstalled();
    var calls=[];
    list.forEach(function(x,idx){
      calls.push(fetch(MODELS_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:x.id, order:idx})}));
    });
    Promise.all(calls).then(function(){ refreshInstalled(); msFetchModelsForSelector(); })
      .catch(function(){ setMsg('msInstMsg','Falha ao salvar ordem — revertendo.',true); refreshInstalled(); });
  }

  /* PATCH-MODELSTORE-COSMETIC-2: window.confirm() nativo travava a UI
     (sincrono) -- troca por modal HTML no mesmo padrao do ms-ov/ms-modal
     ja usado em buildPruneModal(). A chamada de rede continua assincrona
     (fetch), sem nenhum XHR sincrono. Backend/endpoint inalterados. */
  var msUninstallTarget=null;
  function doUninstall(m){
    msUninstallTarget=m;
    if(!ovUninstall) buildUninstallModal();
    renderUninstallModal(m);
    ovUninstall.classList.add('open');
  }
  function closeUninstallModal(){ if(ovUninstall) ovUninstall.classList.remove('open'); msUninstallTarget=null; }
  function renderUninstallModal(m){
    var body=document.getElementById('msUninstallBody'); if(!body) return;
    var sizeGb=(m.size_gb!=null? m.size_gb : m.gb);
    body.innerHTML=
      '<div class="ms-irow" style="pointer-events:none"><div class="info"><div class="nm">'+esc(m.name||m.id)+'</div>'+
      '<div class="mt">'+(sizeGb!=null? gbFmt(sizeGb)+' serão liberados':'tamanho em disco indisponível')+'</div></div></div>'+
      '<div class="ms-msg" style="margin-top:10px">Isso remove o arquivo .gguf do disco e o bloco correspondente do llama-swap.yaml. A ação não pode ser desfeita.</div>';
  }
  function doUninstallConfirmed(){
    var m=msUninstallTarget; if(!m) return;
    var confirmBtn=document.getElementById('msUninstallConfirm');
    if(confirmBtn) confirmBtn.setAttribute('disabled','');
    var before=msState.installed;
    msState.installed=before.filter(function(x){ return x.id!==m.id; });
    renderInstalled();
    /* /api/models/uninstall reaproveita o DirReq existente no main.py real
       (PATCH-DIRTOOLS-V1) -- o campo do corpo chama-se "path", mesmo
       carregando o id/slug do modelo (nao um caminho de disco de verdade).
       Confirmado no bloco PATCH-MODELSTORE-V1 (Onda 1, patch-main.py.txt). */
    fetch(MODELS_API+'/uninstall',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:m.id})})
      .then(function(r){ if(!r.ok) throw new Error('http'); return safeJson(r); })
      .then(function(){ closeUninstallModal(); refreshInstalled(); refreshKpis(); msFetchModelsForSelector(); })
      .catch(function(){ setMsg('msInstMsg','Falha ao desinstalar — revertendo.',true); msState.installed=before; renderInstalled(); closeUninstallModal(); })
      .then(function(){ if(confirmBtn) confirmBtn.removeAttribute('disabled'); });
  }
  function buildUninstallModal(){
    ovUninstall=el('div','ms-ov'); ovUninstall.id='msOvUninstall';
    var modal=el('div','ms-modal'); modal.style.maxWidth='480px';
    var head=el('div','ms-head');
    head.innerHTML='<div><h3 class="ms-title">Desinstalar modelo</h3><div class="ms-sub">Confirme para liberar espaço em disco.</div></div>';
    var xbtn=el('button','ms-x',null); xbtn.type='button'; xbtn.innerHTML='&#10005;'; xbtn.setAttribute('aria-label','Fechar'); xbtn.id='msUninstallClose';
    head.appendChild(xbtn);
    var body=el('div','ms-body'); body.style.paddingTop='4px'; body.id='msUninstallBody';
    var foot=el('div',null); foot.style.cssText='display:flex;justify-content:flex-end;gap:10px;padding:6px 22px 20px';
    foot.innerHTML='<button class="ms-btn ghost" type="button" id="msUninstallCancel">Cancelar</button><button class="ms-btn danger" type="button" id="msUninstallConfirm">Desinstalar</button>';
    modal.appendChild(head); modal.appendChild(body); modal.appendChild(foot);
    ovUninstall.appendChild(modal);
    ovUninstall.onclick=function(e){ if(e.target===ovUninstall) closeUninstallModal(); };
    document.body.appendChild(ovUninstall);
    document.getElementById('msUninstallClose').addEventListener('click', closeUninstallModal);
    document.getElementById('msUninstallCancel').addEventListener('click', closeUninstallModal);
    document.getElementById('msUninstallConfirm').addEventListener('click', doUninstallConfirmed);
  }

  /* PATCH-MODELSTORE-COSMETIC-4: window.confirm() nativo (sincrono) do botao
     "Limpar nao usados" (#msPruneBtn) trocado por modal HTML no mesmo padrao
     ms-ov/ms-modal ja usado em buildUninstallModal()/buildPruneModal(). O
     POST /api/models/prune continua com o MESMO corpo de hoje ('{}', sem
     ids -- politica automatica de orfaos fica inteiramente no backend,
     prune() real nao foi tocado). A lista mostrada no modal e' so uma
     PREVIA client-side: um GET /api/models fresco (nao usa o msState.installed
     que pode estar desatualizado) filtrado com o mesmo msIsPruneCandidate()
     que o modal de selecao manual ja usa, pra dar uma ideia de quem entra
     na faxina antes de confirmar. */
  var msPruneAutoPreview=[];
  function doPrune(){
    if(!ovPruneAuto) buildPruneAutoModal();
    renderPruneAutoLoading();
    ovPruneAuto.classList.add('open');
    fetch(MODELS_API,{headers:{'Accept':'application/json'}})
      .then(function(r){ if(!r.ok) throw new Error('http '+r.status); return safeJson(r); })
      .then(function(d){
        var raw=(d&&(d.models||d.data)) || (Object.prototype.toString.call(d)==='[object Array]'? d : []);
        msPruneAutoPreview=msNormalizeList(raw).filter(msIsPruneCandidate);
        renderPruneAutoBody();
      })
      .catch(function(){ renderPruneAutoBody(true); });
  }
  function closePruneAutoModal(){ if(ovPruneAuto) ovPruneAuto.classList.remove('open'); }
  function renderPruneAutoLoading(){
    var body=document.getElementById('msPruneAutoBody'); if(!body) return;
    body.innerHTML='<div class="ms-msg">Carregando candidatos…</div>';
    var info=document.getElementById('msPruneAutoInfo'); if(info) info.textContent='—';
  }
  function renderPruneAutoBody(loadFailed){
    var body=document.getElementById('msPruneAutoBody'); if(!body) return;
    var info=document.getElementById('msPruneAutoInfo');
    if(loadFailed){
      body.innerHTML='<div class="ms-msg" style="color:var(--ms-err)">Não foi possível carregar a prévia dos candidatos (falha de rede). O backend ainda decide e remove os órfãos reais ao confirmar.</div>';
      if(info) info.textContent='—';
      return;
    }
    var cands=msPruneAutoPreview;
    if(!cands.length){
      body.innerHTML='<div class="ms-empty"><div class="t">Nenhum candidato no momento</div><div>Segundo os dados carregados agora, nenhum modelo está sem uso, não-padrão e gerenciado pela loja. O backend confirma isso na hora de limpar.</div></div>';
      if(info) info.textContent='O backend removerá os órfãos reais (sem uso e sem padrão em nenhuma interface), mesmo que a lista acima esteja vazia agora.';
      return;
    }
    var totalGb=0, knownAll=true;
    body.innerHTML=cands.map(function(m){
      var c=(m.usage&&m.usage.calls)||0;
      var sizeGb=(m.size_gb!=null? m.size_gb : m.gb);
      if(sizeGb!=null) totalGb+=Number(sizeGb)||0; else knownAll=false;
      return '<div class="ms-irow" style="pointer-events:none"><div class="info"><div class="nm">'+esc(m.name||m.id)+
        (m.active?' <span class="ms-chip ok"><span class="dot"></span> ativo</span>':'')+'</div>'+
        '<div class="mt">'+c+' requisições'+(sizeGb!=null? ' · '+gbFmt(sizeGb):'')+'</div></div></div>';
    }).join('');
    var msg='O backend decide os órfãos reais ao confirmar (pode diferir levemente desta prévia). '+cands.length+' candidato(s) agora'+
      (knownAll? ' · até '+gbFmt(totalGb)+' a liberar':'')+'.';
    if(info) info.textContent=msg;
  }
  function doPruneAutoConfirmed(){
    var confirmBtn=document.getElementById('msPruneAutoConfirm');
    if(confirmBtn) confirmBtn.setAttribute('disabled','');
    fetch(MODELS_API+'/prune',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'})
      .then(function(r){ if(!r.ok) throw new Error('http'); return safeJson(r); })
      .then(function(j){
        /* prune() (backend real) devolve {removed:[ids...], skipped:[{id,reason}...]}
           -- nao um numero. Aceita tambem um numero solto, por seguranca. */
        var n=null;
        if(j && Object.prototype.toString.call(j.removed)==='[object Array]') n=j.removed.length;
        else if(j && typeof j.removed==='number') n=j.removed;
        closePruneAutoModal();
        setMsg('msInstMsg', n!=null? (n+' modelo(s) removido(s).') : 'Concluído.');
        refreshInstalled(); refreshKpis(); msFetchModelsForSelector();
      })
      .catch(function(){ closePruneAutoModal(); setMsg('msInstMsg','Falha ao limpar modelos não usados.',true); })
      .then(function(){ if(confirmBtn) confirmBtn.removeAttribute('disabled'); });
  }
  function buildPruneAutoModal(){
    ovPruneAuto=el('div','ms-ov'); ovPruneAuto.id='msOvPruneAuto';
    var modal=el('div','ms-modal'); modal.style.maxWidth='560px';
    var head=el('div','ms-head');
    head.innerHTML='<div><h3 class="ms-title">Limpar não usados</h3><div class="ms-sub">Candidatos: sem uso relevante, gerenciados pela loja e sem padrão em nenhuma interface.</div></div>';
    var xbtn=el('button','ms-x',null); xbtn.type='button'; xbtn.innerHTML='&#10005;'; xbtn.setAttribute('aria-label','Fechar'); xbtn.id='msPruneAutoClose';
    head.appendChild(xbtn);
    var body=el('div','ms-body'); body.style.paddingTop='4px'; body.id='msPruneAutoBody';
    var foot=el('div',null); foot.style.cssText='display:flex;flex-direction:column;gap:8px;padding:6px 22px 20px';
    foot.innerHTML='<div class="ms-msg" id="msPruneAutoInfo">—</div>'+
      '<div style="display:flex;justify-content:flex-end;gap:10px"><button class="ms-btn ghost" type="button" id="msPruneAutoCancel">Cancelar</button><button class="ms-btn danger" type="button" id="msPruneAutoConfirm">Desinstalar selecionados</button></div>';
    modal.appendChild(head); modal.appendChild(body); modal.appendChild(foot);
    ovPruneAuto.appendChild(modal);
    ovPruneAuto.onclick=function(e){ if(e.target===ovPruneAuto) closePruneAutoModal(); };
    document.body.appendChild(ovPruneAuto);
    document.getElementById('msPruneAutoClose').addEventListener('click', closePruneAutoModal);
    document.getElementById('msPruneAutoCancel').addEventListener('click', closePruneAutoModal);
    document.getElementById('msPruneAutoConfirm').addEventListener('click', doPruneAutoConfirmed);
  }

  /* PATCH-MODELSTORE-COSMETIC-3: o STAGE_LABEL do console original (script
     classico, const no topo de arquivo, linha ~548) fica acessivel aqui por
     escopo lexico global compartilhado entre blocos de script classicos da
     mesma pagina -- NAO vira window.STAGE_LABEL, mas o identificador bruto e
     visivel. Merge nao-destrutivo (so acrescenta chaves que faltam) pros
     stages novos do modo dual, sem reescrever o dict original. Se por
     algum motivo ele nao existir nesse escopo, e' um no-op seguro. */
  (function(){
    try{
      if(typeof STAGE_LABEL!=='undefined' && STAGE_LABEL){
        if(STAGE_LABEL.consulting_aux==null) STAGE_LABEL.consulting_aux='Consultando modelo auxiliar…';
        if(STAGE_LABEL.consolidating==null) STAGE_LABEL.consolidating='Consolidando resposta…';
        if(STAGE_LABEL.reviewing==null) STAGE_LABEL.reviewing='Revisando com o auxiliar…';
        if(STAGE_LABEL.drafting==null) STAGE_LABEL.drafting='Rascunhando…';
      }
    }catch(e){}
  })();

  /* ------------------------------------------------------------------ */
  /* 6b) Aba Execucao -- modos por interface (single/dual/agent), Onda 4. */
  /*     GET/POST /api/exec (contrato novo desta onda, ver               */
  /*     backend/patch-main.py.txt PATCH-MODELEXEC-V1). Leitura devolve  */
  /*     um dict por interface com nomes internos (cylinderui/cyber/god,    */
  /*     mesmo vocabulario de vis/def em /api/models) -- traduzido aqui  */
  /*     pro mesmo IFACE_INTERNAL_TO_CODE ja usado por msNormalizeModel, */
  /*     sem introduzir um terceiro dialeto de nomes de interface.       */
  /* ------------------------------------------------------------------ */
  var ROLES=[
    {k:'second', n:'Segunda opinião — os dois respondem, o principal consolida'},
    {k:'review', n:'Revisor — o auxiliar revisa e corrige a resposta'},
    {k:'draft',  n:'Rascunho rápido — o auxiliar rascunha, o principal finaliza'},
    {k:'router', n:'Roteador por tarefa — código/tarefas específicas vão pro auxiliar'}
  ];
  var EXEC_MODES=[
    ['single','Um modelo','resposta direta do modelo escolhido'],
    ['dual','Dois modelos (se revezam)','principal + auxiliar — trocam no llama-swap a cada etapa'],
    ['agent','Agente + modelo','Agent Mode com ferramentas, movido pelo modelo escolhido']
  ];
  var msExec={};   /* {C:{mode,main,aux,role,tools:{files,rag,web}}, CC:{...}, GOD:{...}} */

  function msDefaultExecRec(){
    return {mode:'single', main:null, aux:null, role:'second', tools:{files:false,rag:false,web:false}};
  }
  function msNormalizeExecRec(raw){
    var d=msDefaultExecRec();
    if(!raw) return d;
    if(raw.mode) d.mode=raw.mode;
    d.main=raw.main||null;
    d.aux=raw.aux||null;
    if(raw.role) d.role=raw.role;
    if(raw.tools && typeof raw.tools==='object'){
      ['files','rag','web'].forEach(function(k){ if(k in raw.tools) d.tools[k]=!!raw.tools[k]; });
    }
    return d;
  }
  IFACES.forEach(function(f){ msExec[f.k]=msDefaultExecRec(); });

  function refreshExec(){
    setMsg('msExecMsg','Carregando…');
    fetch(EXEC_API,{headers:{'Accept':'application/json'}})
      .then(function(r){ if(!r.ok) throw new Error('http '+r.status); return safeJson(r); })
      .then(function(d){
        var out={};
        IFACES.forEach(function(f){ out[f.k]=msDefaultExecRec(); });
        Object.keys(d||{}).forEach(function(k){
          var code=IFACE_INTERNAL_TO_CODE[k]||k;
          if(out[code]!==undefined) out[code]=msNormalizeExecRec(d[k]);
        });
        msExec=out;
        setMsg('msExecMsg','');
        renderExecCards();
      })
      .catch(function(){ setMsg('msExecMsg','Falha ao carregar configuração de execução (servidor indisponível).',true); });
  }

  function execModelById(id){ return (msState.installed||[]).filter(function(m){ return m.id===id; })[0]||null; }
  function execModelOptions(selId, excludeId){
    var list=(msState.installed||[]).filter(function(m){ return m.id!==excludeId; });
    var h='<option value="">— escolher —</option>';
    list.forEach(function(m){
      h+='<option value="'+esc(m.id)+'"'+(m.id===selId?' selected':'')+'>'+esc(m.name||m.id)+
         (m.quant?' ('+esc(m.quant)+')':'')+(m.active?'':' · inativo')+'</option>';
    });
    return h;
  }

  function renderExecCards(){
    var g=document.getElementById('msExecGrid'); if(!g) return;
    g.innerHTML='';
    IFACES.forEach(function(f){
      var c=msExec[f.k]||msDefaultExecRec();
      var body='';
      EXEC_MODES.forEach(function(md){
        body+='<div class="ms-modeopt'+(c.mode===md[0]?' sel':'')+'" data-if="'+f.k+'" data-mode="'+md[0]+'"><span class="rd"></span><span><span class="mo-n">'+esc(md[1])+'</span><span class="mo-d">'+esc(md[2])+'</span></span></div>';
      });
      body+='<label class="ms-lbl">Modelo principal</label><select class="ms-select" style="width:100%" data-if="'+f.k+'" data-field="main">'+execModelOptions(c.main,null)+'</select>';
      if(c.mode==='dual'){
        body+='<label class="ms-lbl">Modelo auxiliar (se reveza com o principal)</label><select class="ms-select" style="width:100%" data-if="'+f.k+'" data-field="aux">'+execModelOptions(c.aux,c.main)+'</select>';
        body+='<label class="ms-lbl">Papel do auxiliar</label><select class="ms-select" style="width:100%" data-if="'+f.k+'" data-field="role">'+
          ROLES.map(function(r){ return '<option value="'+r.k+'"'+(c.role===r.k?' selected':'')+'>'+esc(r.n)+'</option>'; }).join('')+
          '</select>';
      }
      if(c.mode==='agent'){
        body+='<label class="ms-lbl">Ferramentas do agente</label><div class="ms-exc-tools">';
        [['files','Arquivos & Diretórios'],['rag','RAG (documentos)'],['web','Internet']].forEach(function(t){
          body+='<span class="ms-sw'+(c.tools[t[0]]?' on':'')+'" data-if="'+f.k+'" data-tool="'+t[0]+'" role="switch" aria-checked="'+c.tools[t[0]]+'" tabindex="0" style="cursor:pointer"><span class="tr"></span> '+t[1]+'</span>';
        });
        body+='</div>';
      }
      var mainM=execModelById(c.main);
      var auxM=c.mode!=='single'? execModelById(c.aux) : null;
      var st;
      if(!mainM){
        st='<span class="ms-chip warn"><span class="dot"></span> escolha o modelo principal</span>';
      } else if(c.mode==='dual' && !auxM){
        st='<span class="ms-chip warn"><span class="dot"></span> escolha o modelo auxiliar</span>';
      } else {
        var inactive=[mainM].concat(auxM?[auxM]:[]).filter(function(m){ return !m.active; });
        if(inactive.length){
          st='<span class="ms-chip warn"><span class="dot"></span> '+inactive.length+' modelo(s) inativo(s)</span> <button class="ms-btn ghost sm" type="button" data-actall data-if="'+f.k+'">Ativar agora</button>';
        } else if(c.mode==='dual'){
          st='<span class="ms-chip ok"><span class="dot"></span> pronto · os modelos se revezam (troca leva alguns segundos)</span>';
        } else {
          st='<span class="ms-chip ok"><span class="dot"></span> pronto</span>';
        }
      }
      var summary=c.mode==='single'?'1 modelo':c.mode==='dual'?'2 modelos':'agente + modelo';
      var card=el('div','ms-exc');
      card.innerHTML='<h4>'+esc(f.n)+' <span class="ms-badge neutral">'+summary+'</span></h4>'+body+
        '<div style="margin-top:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">'+st+'</div>';
      g.appendChild(card);
    });
  }

  function patchExecField(ifaceCode, patch){
    var body={interface:ifaceCode};
    for(var k in patch) if(patch.hasOwnProperty(k)) body[k]=patch[k];
    setMsg('msExecMsg','Salvando…');
    fetch(EXEC_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
      .then(function(r){
        if(!r.ok) return safeJson(r).then(function(j){ throw new Error((j&&j.detail)||('http '+r.status)); });
        return safeJson(r);
      })
      .then(function(j){
        if(j && j.exec) msExec[ifaceCode]=msNormalizeExecRec(j.exec);
        setMsg('msExecMsg','');
        renderExecCards();
      })
      .catch(function(e){
        setMsg('msExecMsg','Falha ao salvar — revertendo. '+(e&&e.message?e.message:''),true);
        refreshExec();
      });
  }

  function wireExec(){
    var grid=document.getElementById('msExecGrid'); if(!grid) return;
    grid.addEventListener('click', function(e){
      var mr=e.target.closest('[data-mode]');
      if(mr){ patchExecField(mr.getAttribute('data-if'), {mode:mr.getAttribute('data-mode')}); return; }
      var tg=e.target.closest('[data-tool]');
      if(tg){
        var fi=tg.getAttribute('data-if'), tool=tg.getAttribute('data-tool');
        var cur=msExec[fi]||msDefaultExecRec();
        var nextTools={}; nextTools[tool]=!cur.tools[tool];
        patchExecField(fi, {tools:nextTools});
        return;
      }
      var aa=e.target.closest('[data-actall]');
      if(aa){
        var f2=aa.getAttribute('data-if'), cc=msExec[f2]||msDefaultExecRec();
        var ids=[cc.main,cc.aux].filter(Boolean);
        var pending=ids.map(function(id){
          var m=execModelById(id);
          if(m && !m.active) return patchModel(id, {active:true}, function(){ m.active=true; });
          return Promise.resolve();
        });
        Promise.all(pending).then(function(){ setMsg('msExecMsg','Modelos ativados.'); refreshInstalled(); refreshExec(); });
        return;
      }
    });
    grid.addEventListener('change', function(e){
      var s=e.target.closest('select[data-field]'); if(!s) return;
      var fi=s.getAttribute('data-if'), field=s.getAttribute('data-field');
      var patch={}; patch[field]=s.value||'';
      patchExecField(fi, patch);
    });
  }

  /* ------------------------------------------------------------------ */
  /* 7) Aba Downloads -- polling a cada 2s SO com o modal aberto         */
  /* ------------------------------------------------------------------ */
  function wireDownloads(){
    document.getElementById('msDlPanel').addEventListener('click', function(e){
      var row=e.target.closest('.ms-dlrow'); if(!row) return;
      var id=row.getAttribute('data-id');
      if(e.target.closest('[data-cancel]')){
        fetch(STORE_API+'/cancel',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({download_id:id})})
          .then(function(){ refreshDownloads(); })
          .catch(function(){ setMsg('msDlMsg','Falha ao cancelar.',true); });
      }
      /* pausar/retomar: endpoints extras do backend real (nao previstos no
         contrato original, mas necessarios pra fila cumprir "pausar/
         cancelar/retomar" -- ver STATUS-onda1.md, decisao 3). */
      if(e.target.closest('[data-pause]')){
        fetch(STORE_API+'/pause',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({download_id:id})})
          .then(function(){ refreshDownloads(); })
          .catch(function(){ setMsg('msDlMsg','Falha ao pausar.',true); });
      }
      if(e.target.closest('[data-resume]')){
        fetch(STORE_API+'/resume',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({download_id:id})})
          .then(function(){ refreshDownloads(); })
          .catch(function(){ setMsg('msDlMsg','Falha ao retomar.',true); });
      }
    });
  }

  function refreshDownloads(){
    fetch(STORE_API+'/downloads',{headers:{'Accept':'application/json'}})
      .then(function(r){ if(!r.ok) throw new Error('http '+r.status); return safeJson(r); })
      .then(function(d){
        var list=(d&&(d.downloads||d.data)) || (Object.prototype.toString.call(d)==='[object Array]'? d : []);
        msState.downloads=list||[];
        setMsg('msDlMsg','');
        renderDownloads();
        refreshKpis();
      })
      .catch(function(){ setMsg('msDlMsg','Falha ao consultar downloads.',true); });
  }

  var DL_ACTIVE_STATUS={queued:1,downloading:1,pausing:1,paused:1};
  function renderDownloads(){
    var list=msState.downloads||[];
    var p=document.getElementById('msDlPanel'); p.innerHTML='';
    document.getElementById('msDlEmpty').classList.toggle('hide', list.length>0);
    list.forEach(function(d){
      var pct=(d.pct!=null? d.pct : (d.progress!=null? d.progress : 0));
      var label=d.repo_id||d.name||'';
      if(d.file) label=label? (label+' · '+d.file) : d.file;
      var sizeTxt='';
      if(d.total!=null && d.total>0){
        sizeTxt=gbFmt((d.bytes||0)/1e9)+' de '+gbFmt(d.total/1e9);
      } else if(d.size_gb!=null){ sizeTxt=gbFmt(d.size_gb); }
      var isPaused=(d.status==='paused');
      var isActive=!!DL_ACTIVE_STATUS[d.status];
      var actions='';
      if(isActive){
        actions+= isPaused
          ? '<button class="ms-btn ghost sm" type="button" data-resume>Retomar</button>'
          : '<button class="ms-btn ghost sm" type="button" data-pause>Pausar</button>';
        actions+='<button class="ms-btn danger sm" type="button" data-cancel>Cancelar</button>';
      } else if(d.status==='done'){
        actions='<span class="ms-badge">Concluído</span>';
      } else if(d.status==='error'){
        actions='<span class="ms-badge neutral">'+esc(d.error||'Erro')+'</span>';
      } else if(d.status==='canceled'){
        actions='<span class="ms-badge neutral">Cancelado</span>';
      }
      var row=el('div','ms-dlrow'); row.setAttribute('data-id', d.id||d.download_id||'');
      row.innerHTML=
        '<div class="ms-dl-top"><div><div class="ms-dl-nm">'+esc(label)+'</div>'+
        '<div class="ms-dl-meta">'+esc(d.status||'')+(sizeTxt? ' · '+sizeTxt:'')+'</div></div>'+
        '<div class="ms-dl-acts">'+actions+'</div></div>'+
        '<div class="ms-dlbar'+(d.status==='error'?' err':(isPaused?' paused':''))+'"><span style="width:'+Math.max(0,Math.min(100,pct))+'%"></span></div>'+
        '<div class="ms-dl-sub"><span>'+Math.round(pct)+'%</span><span>'+(isPaused?'pausado':'')+'</span></div>';
      p.appendChild(row);
    });
    var nTab=document.getElementById('msNdownloads'); if(nTab) nTab.textContent=list.filter(function(x){ return DL_ACTIVE_STATUS[x.status]; }).length;
    var kpiDl=document.getElementById('msKpiDl'); if(kpiDl) kpiDl.textContent=list.filter(function(x){ return DL_ACTIVE_STATUS[x.status]; }).length;
  }

  function startDlPolling(){
    stopDlPolling();
    refreshDownloads();
    msState.dlTimer=setInterval(refreshDownloads, 2000);
  }
  function stopDlPolling(){
    if(msState.dlTimer){ clearInterval(msState.dlTimer); msState.dlTimer=null; }
  }

  /* ------------------------------------------------------------------ */
  /* 8) KPIs do topo do modal                                            */
  /* ------------------------------------------------------------------ */
  function refreshKpis(){
    var installed=msState.installed||[];
    var kc=document.getElementById('msKpiCount'); if(kc) kc.textContent=installed.length;
    var used=installed.reduce(function(a,m){ return a+(Number(m.size_gb!=null?m.size_gb:m.gb)||0); },0);
    var kd=document.getElementById('msKpiDisk'); if(kd) kd.textContent=gbFmt(used);
  }

  /* ------------------------------------------------------------------ */
  /* 9) Aba Benchmark -- resumo de RAM, gauge de contexto (drag/teclado), */
  /*    liga/desliga (mesmo endpoint de ativar), matriz de pares,        */
  /*    ranking de uso + "Desinstalar menos usados..." (modal com        */
  /*    selecao real, POST /api/models/prune {ids:[...]}), e             */
  /*    "Desempenho verificado" (POST /api/bench/run|optimize|cancel +   */
  /*    polling de status/log, 2s, so' com a aba Benchmark visivel).     */
  /*    O backend real (Onda 1) NAO devolve tamanho em disco (size_gb)   */
  /*    dos modelos instalados -- por isso RAM/gauge/matriz caem num     */
  /*    modo "sem dado" honesto (mostra "-" em vez de inventar numero)   */
  /*    sempre que size_gb for null; o orcamento de RAM continua sendo   */
  /*    validado de verdade pelo servidor (PATCH /api/models             */
  /*    {active:true} pode devolver 409 se estourar o orcamento).        */
  /* ------------------------------------------------------------------ */
  var msBench={ running:false, id:null, profile:null, stage:null, timer:null };
  var msGauge={ pct:35, agentOn:true, othersOn:true, modelId:null };

  function benchTabVisible(){
    return !!(ov && ov.classList.contains('open') && panes.bench && panes.bench.classList.contains('on'));
  }
  function stopBenchPolling(){ if(msBench.timer){ clearInterval(msBench.timer); msBench.timer=null; } }
  function ensureBenchTimer(){
    if(msBench.timer || !benchTabVisible()) return;
    msBench.timer=setInterval(refreshBenchStatus,2000);
  }

  function refreshBenchLog(){
    fetch('/api/bench/log?tail=40',{headers:{'Accept':'application/json'}})
      .then(safeJson)
      .then(function(d){
        var lines=(d&&d.lines)||[];
        var log=document.getElementById('msVbLog'); if(!log) return;
        log.textContent=lines.join('\n');
        if(log.parentNode) log.parentNode.scrollTop=log.parentNode.scrollHeight;
      })
      .catch(function(){ /* log e' so cosmetico -- nunca quebra o resto da aba */ });
  }

  function renderBenchStatusUI(){
    var runBtn=document.getElementById('msBtnRunBench');
    var cancelBtn=document.getElementById('msBtnCancelBench');
    var stageEl=document.getElementById('msVbStage');
    var consoleEl=document.getElementById('msVbConsole');
    if(runBtn) runBtn.disabled=msBench.running;
    if(cancelBtn) cancelBtn.classList.toggle('hide', !msBench.running);
    if(msBench.running && consoleEl) consoleEl.classList.remove('hide');
    if(stageEl){
      stageEl.textContent = msBench.running
        ? (msBench.stage||'rodando…')+(msBench.id? ' · '+msBench.id:'')+(msBench.profile? ' · '+(PROF_LABEL[msBench.profile]||msBench.profile):'')
        : (msBench.stage||'aguardando…');
    }
    renderVerified();
  }

  function refreshBenchStatus(){
    if(!benchTabVisible()){ stopBenchPolling(); return; }
    fetch('/api/bench/status',{headers:{'Accept':'application/json'}})
      .then(function(r){ if(!r.ok) throw new Error('http '+r.status); return safeJson(r); })
      .then(function(d){
        var wasRunning=msBench.running;
        msBench.running=!!(d&&d.running); msBench.id=(d&&d.id)||null; msBench.profile=(d&&d.profile)||null; msBench.stage=(d&&d.stage)||null;
        renderBenchStatusUI();
        if(msBench.running){ ensureBenchTimer(); refreshBenchLog(); }
        else{
          stopBenchPolling();
          if(wasRunning){
            msBench.stage='concluído';
            renderBenchStatusUI();
            refreshBenchLog();
            setMsg('msBenchMsg','Benchmark concluído.');
            refreshInstalled();
          }
        }
      })
      .catch(function(){ /* mantem ultimo estado conhecido -- nunca quebra o console */ });
  }

  function doRunBench(){
    if(msBench.running){ setMsg('msBenchMsg','Já existe um benchmark em andamento.',true); return; }
    var sel=document.getElementById('msVbModel');
    var id=sel&&sel.value;
    if(!id){ setMsg('msBenchMsg','Escolha um modelo instalado para testar.',true); return; }
    setMsg('msBenchMsg','Iniciando benchmark…');
    fetch('/api/bench/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:id,profile:msState.vbProf||'medio'})})
      .then(function(r){
        if(r.status===409){ setMsg('msBenchMsg','Já existe um benchmark em andamento — aguarde ou cancele.',true); refreshBenchStatus(); return null; }
        if(!r.ok) throw new Error('http '+r.status);
        return safeJson(r);
      })
      .then(function(d){ if(d===null) return; setMsg('msBenchMsg',''); refreshBenchStatus(); })
      .catch(function(){ setMsg('msBenchMsg','Falha ao iniciar benchmark (servidor indisponível).',true); });
  }

  function doCancelBench(){
    setMsg('msBenchMsg','Cancelando…');
    fetch('/api/bench/cancel',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'})
      .then(function(r){ if(!r.ok) throw new Error('http '+r.status); return safeJson(r); })
      .then(function(){ refreshBenchStatus(); })
      .catch(function(){ setMsg('msBenchMsg','Falha ao cancelar.',true); });
  }

  function doOptimize(id){
    if(msBench.running){ setMsg('msBenchMsg','Já existe um benchmark em andamento.',true); return; }
    setMsg('msBenchMsg','Iniciando otimização de CPU…');
    fetch('/api/bench/optimize',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:id})})
      .then(function(r){
        if(r.status===409){ setMsg('msBenchMsg','Já existe um benchmark em andamento.',true); refreshBenchStatus(); return null; }
        if(!r.ok) throw new Error('http '+r.status);
        return safeJson(r);
      })
      .then(function(d){ if(d===null) return; setMsg('msBenchMsg',''); refreshBenchStatus(); })
      .catch(function(){ setMsg('msBenchMsg','Falha ao otimizar.',true); });
  }

  function renderVbSelect(){
    var s=document.getElementById('msVbModel'); if(!s) return;
    var cur=s.value;
    s.innerHTML='';
    (msState.installed||[]).forEach(function(m){
      var o=document.createElement('option'); o.value=m.id;
      o.textContent=(m.name||m.id)+(msHasBench(m)? ' · já verificado' : '');
      s.appendChild(o);
    });
    if(cur && (msState.installed||[]).some(function(x){ return x.id===cur; })) s.value=cur;
  }

  function renderVerified(){
    renderVbSelect();
    var host=document.getElementById('msVbResults'); if(!host) return;
    host.innerHTML='';
    var res=(msState.installed||[]).filter(msHasBench);
    var empty=document.getElementById('msVbEmpty');
    if(empty) empty.classList.toggle('hide', res.length>0 || msBench.running);
    res.forEach(function(m){
      var b=m.bench, tuned=m.tuned;
      var tgShown = (b.tg!=null)? r1(b.tg*(msHasTuned(m)?1+tuned.gain:1)) : null;
      var row=el('div','ms-irow');
      row.innerHTML=
        '<div class="info"><div class="nm">'+esc(m.name||m.id)+' <span class="ms-badge">verificado</span>'+
        (b.prof? ' <span class="ms-badge neutral">'+esc(PROF_LABEL[b.prof]||b.prof)+'</span>':'')+
        (msHasTuned(m)? ' <span class="ms-badge" style="background:rgba(90,157,107,.14);color:var(--ms-ok);border-color:rgba(90,157,107,.3)">CPU otimizada +'+Math.round(tuned.gain*100)+'%</span>':'')+
        '</div><div class="mt">'+
        (b.pp!=null? 'pp512 '+r1(b.pp)+' t/s · ':'')+
        (b.tg!=null? 'tg128 '+(msHasTuned(m)? r1(b.tg)+' → '+tgShown : r1(b.tg))+' t/s · ':'')+
        (b.lat!=null? '1º token '+b.lat+' s · ':'')+
        (b.threads!=null? '-t '+(msHasTuned(m)?tuned.threads:b.threads):'')+
        (msHasTuned(m)&&tuned.batch!=null? ' --batch '+tuned.batch+' --mlock':'')+
        (b.date? ' · '+esc(msFmtDate(b.date)):'')+
        '</div></div><div class="acts">'+
        (msHasTuned(m)? '<span class="ms-chip ok"><span class="dot"></span> otimizado</span>' : '<button class="ms-btn sm" type="button" data-tune="'+esc(m.id)+'" '+(msBench.running?'disabled':'')+'>Otimizar CPU p/ modelo</button>')+
        '<button class="ms-btn ghost sm" type="button" data-rebench="'+esc(m.id)+'" '+(msBench.running?'disabled':'')+'>Rodar de novo</button>'+
        '</div>';
      host.appendChild(row);
    });
  }

  function renderBenchSummary(){
    var list=msState.installed||[];
    var active=list.filter(function(m){ return m.active; });
    var actEl=document.getElementById('msBenchAct'); if(actEl) actEl.textContent=active.length;
    var haveSizes=active.length>0 && active.every(function(m){ return m.size_gb!=null; });
    var RAM=64, RAM_BUDGET=RAM*0.85;
    var ramTxt=document.getElementById('msBenchRamTxt');
    var meter=document.getElementById('msBenchMeter');
    var hint=document.getElementById('msBenchHint');
    if(haveSizes){
      var used=active.reduce(function(a,m){ return a+m.size_gb*1.15; },0);
      if(ramTxt) ramTxt.textContent=gbFmt(used)+' / '+RAM+' GB';
      if(meter){ meter.className='ms-meter '+(used>RAM_BUDGET?'err':used>RAM*0.6?'warn':'ok'); if(meter.firstElementChild) meter.firstElementChild.style.width=Math.min(100,Math.round(used/RAM*100))+'%'; }
      var sobra=RAM_BUDGET-used;
      if(hint) hint.innerHTML='<span class="dot"></span> '+(sobra>0? 'sobram ~'+gbFmt(sobra)+' para ligar mais modelos':'orçamento de RAM esgotado');
    } else {
      if(ramTxt) ramTxt.textContent='—';
      if(meter){ meter.className='ms-meter'; if(meter.firstElementChild) meter.firstElementChild.style.width='0%'; }
      if(hint) hint.innerHTML='<span class="dot"></span> backend não informa tamanho em disco — orçamento validado ao ativar';
    }
  }

  function renderBenchList(){
    var p=document.getElementById('msBenchList'); if(!p) return;
    p.innerHTML='';
    var list=msState.installed||[];
    if(!list.length){ p.innerHTML='<div class="ms-empty" style="padding:20px"><div class="t">Nenhum modelo instalado</div></div>'; return; }
    list.forEach(function(m){
      var chip = m.active? '<span class="ms-chip ok"><span class="dot"></span> ativo agora</span>' : '<span class="ms-chip"><span class="dot"></span> inativo</span>';
      var row=el('div','ms-irow'); row.setAttribute('data-id', m.id);
      row.innerHTML=
        '<span class="ms-sw'+(m.active?' on':'')+'" data-bact role="switch" aria-checked="'+(!!m.active)+'" title="'+(m.active?'Ativo':'Inativo')+'"><span class="tr"></span></span>'+
        '<div class="info"><div class="nm">'+esc(m.name||m.id)+(m.quant? ' <span class="ms-badge neutral">'+esc(m.quant)+'</span>':'')+'</div>'+
        '<div class="mt">'+(m.size_gb!=null? 'RAM ~'+gbFmt(m.size_gb*1.15)+' quando ativo' : 'RAM estimada indisponível')+'</div></div>'+chip;
      p.appendChild(row);
    });
  }

  function renderBenchMatrix(){
    var panel=document.getElementById('msBenchMatrix'); var note=document.getElementById('msBenchMatrixNote');
    if(!panel) return;
    var list=msState.installed||[];
    if(!list.length){ panel.innerHTML='<div class="ms-empty" style="padding:20px"><div class="t">Nenhum modelo instalado</div></div>'; if(note) note.classList.add('hide'); return; }
    var haveSizes=list.every(function(m){ return m.size_gb!=null; });
    var RAM_BUDGET=64*0.85;
    var t='<table><thead><tr><th>Modelo</th>';
    list.forEach(function(x,i){ t+='<th style="text-align:center">#'+(i+1)+'</th>'; });
    t+='</tr></thead><tbody>';
    list.forEach(function(a,i){
      t+='<tr><td><b>#'+(i+1)+'</b> <span title="'+esc(a.name||a.id)+'">'+esc(shortName(a.name||a.id))+'</span></td>';
      list.forEach(function(b,j){
        if(i===j){ t+='<td class="c cdim">—</td>'; return; }
        if(!haveSizes){ t+='<td class="c cdim">?</td>'; return; }
        var okPair=(a.size_gb*1.15+b.size_gb*1.15)<=RAM_BUDGET;
        t+= okPair? '<td class="c cok">✓</td>' : '<td class="c cerr">✗</td>';
      });
      t+='</tr>';
    });
    panel.innerHTML=t+'</tbody></table>';
    if(note){
      note.classList.toggle('hide', haveSizes);
      note.textContent='Backend não informa tamanho em disco dos modelos — compatibilidade de pares fica indisponível (mostrando "?"). O orçamento de RAM é validado pelo servidor sempre que você ativa um modelo.';
    }
  }

  function renderBenchUsage(){
    var host=document.getElementById('msBenchUsage'); if(!host) return;
    host.innerHTML='';
    var list=(msState.installed||[]).slice().sort(function(a,b){
      return (((b.usage&&b.usage.calls)||0)-((a.usage&&a.usage.calls)||0));
    });
    if(!list.length){ host.innerHTML='<div class="ms-empty" style="padding:20px"><div class="t">Nenhum modelo instalado</div></div>'; return; }
    var max=Math.max(1, (list[0].usage&&list[0].usage.calls)||0);
    list.forEach(function(m,i){
      var c=(m.usage&&m.usage.calls)||0;
      var cold=c<50;
      var badge = (i===0 && c>0)? ' <span class="ms-badge">mais usado</span>' : ((i===list.length-1 && list.length>1)? ' <span class="ms-badge neutral" style="color:var(--ms-err);border-color:var(--ms-err)">menos usado</span>':'');
      var row=el('div','ms-urow'+(cold?' cold':''));
      row.innerHTML=
        '<div class="uinfo"><div class="un">'+esc(m.name||m.id)+badge+'</div><div class="um">último uso: '+esc(fmtLast(m))+'</div></div>'+
        '<div class="ubar"><span style="width:'+Math.max(2,Math.round(c/max*100))+'%"></span></div>'+
        '<div class="uc">'+c+' req.</div>';
      host.appendChild(row);
    });
  }

  function msRenderBenchTab(){
    if(!panes.bench) return;
    renderBenchSummary();
    renderBenchList();
    renderBenchMatrix();
    renderBenchUsage();
    renderGaugeSelect();
    updateGauge();
    renderVerified();
  }

  /* ---- gauge: contexto x tamanho x velocidade ---- */
  function ctxKfromPct(p){ return 4*Math.pow(2,(p/100)*5); }
  function fmtCtx(k){ return (k>=10? Math.round(k) : Math.round(k*10)/10)+'k'; }
  function msGaugeModel(){
    var list=msState.installed||[];
    if(msGauge.modelId){ var m=list.filter(function(x){ return x.id===msGauge.modelId; })[0]; if(m) return m; }
    var m0=list[0]||null; if(m0) msGauge.modelId=m0.id;
    return m0;
  }
  function renderGaugeSelect(){
    var s=document.getElementById('msGModel'); if(!s) return;
    var list=msState.installed||[];
    s.innerHTML= list.length? '' : '<option value="">— nenhum modelo instalado —</option>';
    list.forEach(function(m){
      var o=document.createElement('option'); o.value=m.id; o.selected=(m.id===msGauge.modelId);
      o.textContent=(m.name||m.id)+(m.quant? ' ('+m.quant+')':'');
      s.appendChild(o);
    });
  }
  function updateGauge(){
    var track=document.getElementById('msGTrack'); if(!track) return;
    var thumb=document.getElementById('msGThumb'), fill=document.getElementById('msGFill');
    if(thumb) thumb.style.left=msGauge.pct+'%';
    if(fill) fill.style.width=msGauge.pct+'%';
    var m=msGaugeModel();
    var read=document.getElementById('msGRead'), bar=document.getElementById('msGBar'), legend=document.getElementById('msGLegend'), info=document.getElementById('msGInfo');
    if(!m){
      if(read) read.innerHTML=''; if(bar) bar.innerHTML=''; if(legend) legend.innerHTML='';
      if(info) info.textContent='Instale um modelo para planejar.';
      return;
    }
    var ctxK=ctxKfromPct(msGauge.pct);
    track.setAttribute('aria-valuenow', Math.round(ctxK*1000));
    var verified = msHasBench(m)? m.bench.tg*(msHasTuned(m)?1+m.tuned.gain:1) : null;
    var sizeGb = m.size_gb;
    var speed=null;
    if(verified!=null) speed=Math.max(1,Math.round(verified*1.0625/(1+ctxK/64)));
    else if(sizeGb!=null) speed=Math.max(1,Math.round(240/sizeGb/(1+ctxK/64)));
    var effK = msGauge.agentOn? ctxK*0.7 : ctxK;
    var haveRam = sizeGb!=null;
    var w = haveRam? sizeGb*1.15 : null;
    var kv = haveRam? sizeGb*0.008*ctxK : null;
    var agent = msGauge.agentOn? 0.6 : 0;
    var others = msGauge.othersOn? (msState.installed||[]).reduce(function(a,x){ return a+((x.active && x.id!==m.id && x.size_gb!=null)? x.size_gb*1.15 : 0); },0) : 0;
    var total = haveRam? (w+kv+agent+others) : null;
    var RAM=64, RAM_BUDGET=RAM*0.85;
    var fits = total==null? null : total<=RAM_BUDGET;
    var tight = total==null? null : total>RAM*0.6;
    var verdict = total==null
      ? '<span class="ms-chip"><span class="dot"></span> sem dado de RAM</span>'
      : (!fits? '<span class="ms-chip err"><span class="dot"></span> não cabe</span>' : tight? '<span class="ms-chip warn"><span class="dot"></span> apertado</span>' : '<span class="ms-chip ok"><span class="dot"></span> cabe folgado</span>');
    if(read) read.innerHTML=
      '<div class="ms-gcell"><div class="l">Contexto</div><div class="v">'+fmtCtx(ctxK)+'<small> tokens</small></div><div class="s">'+(msGauge.agentOn? '~'+fmtCtx(effK)+' úteis (agente usa ~30%)':'todo para a conversa')+'</div></div>'+
      '<div class="ms-gcell"><div class="l">Velocidade '+(verified!=null?'verificada':'estimada')+'</div><div class="v">'+(speed!=null? '~'+speed+'<small> tok/s</small>':'—')+'</div><div class="s">'+(speed==null? 'rode o benchmark para estimar' : (speed<8?'lento para uso interativo':speed<15?'ok para agente':'confortável no chat'))+(verified!=null?' · benchmark real ✓':(speed!=null?' · estimativa':''))+'</div></div>'+
      '<div class="ms-gcell"><div class="l">RAM total</div><div class="v">'+(total!=null? gbFmt(total)+'<small> / '+RAM+' GB</small>':'—')+'</div><div class="s">'+(total!=null? 'limite prático '+gbFmt(RAM_BUDGET) : 'backend não informa tamanho em disco')+'</div></div>'+
      '<div class="ms-gcell"><div class="l">Veredicto</div><div class="v" style="font-size:14px;margin-top:6px">'+verdict+'</div><div class="s">'+(total!=null? 'orçamento validado pelo servidor ao ativar':'ative o modelo para ver se o servidor aceita')+'</div></div>';
    function pw(x){ return Math.max(0,Math.min(100, x/RAM*100)); }
    if(bar) bar.innerHTML= haveRam
      ? ('<span class="sg-w" style="width:'+pw(w)+'%"></span><span class="sg-kv" style="width:'+pw(kv)+'%"></span>'+(agent?'<span class="sg-ag" style="width:'+pw(agent)+'%"></span>':'')+(others?'<span class="sg-ot" style="width:'+pw(others)+'%"></span>':''))
      : '';
    if(legend) legend.innerHTML= haveRam
      ? ('<span><span class="sw" style="background:var(--ms-accent)"></span>pesos do modelo '+gbFmt(w)+'</span>'+
         '<span><span class="sw" style="background:var(--ms-warn)"></span>contexto (cache KV) '+gbFmt(kv)+'</span>'+
         (agent? '<span><span class="sw" style="background:var(--ms-ok)"></span>agente '+gbFmt(agent)+'</span>':'')+
         (others? '<span><span class="sw" style="background:var(--ms-text-faint)"></span>outros modelos ativos '+gbFmt(others)+'</span>':''))
      : '';
    if(info) info.innerHTML = total==null
      ? 'Sem tamanho em disco informado pelo backend para <strong>'+esc(m.name||m.id)+'</strong> — não é possível estimar RAM total aqui. O orçamento de RAM continua sendo validado pelo servidor sempre que você ativa um modelo.'
      : (!fits
        ? '<strong>Limite: memória.</strong> Com '+fmtCtx(ctxK)+' de contexto, '+esc(m.name||m.id)+' passaria do orçamento de RAM ('+gbFmt(total)+' &gt; '+gbFmt(RAM_BUDGET)+').'
        : (speed!=null && speed<8)
        ? '<strong>Limite: velocidade.</strong> Cabe na memória, mas a ~'+speed+' tok/s a resposta fica lenta.'
        : tight
        ? '<strong>Apertado, mas roda.</strong> '+esc(m.name||m.id)+' com '+fmtCtx(ctxK)+' de contexto usa '+gbFmt(total)+' — sobra pouco ('+gbFmt(RAM_BUDGET-total)+').'
        : '<strong>Configuração confortável.</strong> '+esc(m.name||m.id)+' com '+fmtCtx(ctxK)+' de contexto usa '+gbFmt(total)+'.');
  }

  function wireGaugeTrack(){
    var track=document.getElementById('msGTrack'); if(!track) return;
    function setFromX(clientX){
      var r=track.getBoundingClientRect(); if(!r.width) return;
      msGauge.pct=Math.max(0,Math.min(100,(clientX-r.left)/r.width*100));
      updateGauge();
    }
    var dragging=false;
    track.addEventListener('pointerdown',function(e){ dragging=true; try{ track.setPointerCapture(e.pointerId); }catch(err){} setFromX(e.clientX); });
    track.addEventListener('pointermove',function(e){ if(dragging) setFromX(e.clientX); });
    ['pointerup','pointercancel'].forEach(function(ev){ track.addEventListener(ev,function(){ dragging=false; }); });
    track.addEventListener('keydown',function(e){
      if(e.key==='ArrowRight'||e.key==='ArrowUp'){ msGauge.pct=Math.min(100,msGauge.pct+5); updateGauge(); e.preventDefault(); }
      if(e.key==='ArrowLeft'||e.key==='ArrowDown'){ msGauge.pct=Math.max(0,msGauge.pct-5); updateGauge(); e.preventDefault(); }
    });
  }

  /* ---- "Desinstalar menos usados..." (modal com selecao real, envia    */
  /*      ids no corpo -- POST /api/models/prune {ids:[...]}) ---- */
  function msPruneCandidates(){
    /* modelos externos/runtime (store_managed===false) nunca entram como
       candidato -- o backend bloqueia o uninstall deles de qualquer jeito
       (yaml compartilhado, nunca editado por segurança), então nem oferece
       a opção de marcar aqui. */
    return (msState.installed||[]).filter(msIsPruneCandidate)
      .sort(function(a,b){ return (((a.usage&&a.usage.calls)||0)-((b.usage&&b.usage.calls)||0)); });
  }
  function renderPruneModal(){
    var cands=msPruneCandidates();
    var l=document.getElementById('msPruneList'); if(!l) return;
    l.innerHTML='';
    var empty=document.getElementById('msPruneEmpty'); if(empty) empty.classList.toggle('hide', cands.length>0);
    cands.forEach(function(m){
      var c=(m.usage&&m.usage.calls)||0;
      var pre = c<50 && !m.active;
      var row=el('label','ms-irow'); row.style.cursor='pointer';
      row.innerHTML=
        '<input type="checkbox" data-prune="'+esc(m.id)+'" '+(pre?'checked':'')+' style="accent-color:var(--ms-err);width:15px;height:15px;flex:none">'+
        '<div class="info"><div class="nm">'+esc(m.name||m.id)+(m.active?' <span class="ms-chip ok"><span class="dot"></span> ativo</span>':'')+'</div>'+
        '<div class="mt">'+c+' requisições · último uso: '+esc(fmtLast(m))+'</div></div>';
      l.appendChild(row);
    });
    updatePruneInfo();
  }
  function updatePruneInfo(){
    var n=0;
    Array.prototype.forEach.call(document.querySelectorAll('#msPruneList [data-prune]'), function(ck){ if(ck.checked) n++; });
    var info=document.getElementById('msPruneInfo'); if(!info) return;
    info.textContent = n
      ? ('Serão removidos '+n+' modelo(s). Arquivos .gguf apagados e entradas do llama-swap removidas (com backup). Modelos ativos serão descarregados antes.')
      : 'Nenhum modelo selecionado.';
  }
  function closePruneModal(){ if(ovPrune) ovPrune.classList.remove('open'); }
  function doPruneSelected(){
    var ids=[];
    Array.prototype.forEach.call(document.querySelectorAll('#msPruneList [data-prune]'), function(ck){ if(ck.checked) ids.push(ck.getAttribute('data-prune')); });
    if(!ids.length){ setMsg('msBenchMsg','Nenhum modelo selecionado.',true); return; }
    fetch(MODELS_API+'/prune',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids:ids})})
      .then(function(r){ if(!r.ok) throw new Error('http '+r.status); return safeJson(r); })
      .then(function(j){
        var n=null;
        if(j && Object.prototype.toString.call(j.removed)==='[object Array]') n=j.removed.length;
        else if(j && typeof j.removed==='number') n=j.removed;
        var skipped=(j&&j.skipped)||[];
        setMsg('msBenchMsg', (n!=null? n+' modelo(s) removido(s).' : 'Concluído.')+(skipped.length? ' '+skipped.length+' não removido(s).':''));
        closePruneModal();
        refreshInstalled(); refreshKpis(); msFetchModelsForSelector();
      })
      .catch(function(){ setMsg('msBenchMsg','Falha ao desinstalar selecionados.',true); });
  }
  function buildPruneModal(){
    ovPrune=el('div','ms-ov'); ovPrune.id='msOvPrune';
    var modal=el('div','ms-modal'); modal.style.maxWidth='560px';
    var head=el('div','ms-head');
    head.innerHTML='<div><h3 class="ms-title">Desinstalar modelos menos usados</h3><div class="ms-sub">Candidatos: pouco uso e sem padrão em nenhuma interface. Marque os que quer remover.</div></div>';
    var xbtn=el('button','ms-x',null); xbtn.type='button'; xbtn.innerHTML='&#10005;'; xbtn.setAttribute('aria-label','Fechar'); xbtn.id='msPruneClose';
    head.appendChild(xbtn);
    var body=el('div','ms-body'); body.style.paddingTop='4px';
    body.innerHTML=
      '<div id="msPruneList"></div>'+
      '<div class="ms-empty hide" id="msPruneEmpty"><div class="t">Nada para limpar</div><div>Todos os modelos estão em uso ou são padrão em alguma interface.</div></div>'+
      '<div class="ms-msg" id="msPruneInfo">—</div>';
    var foot=el('div',null); foot.style.cssText='display:flex;justify-content:flex-end;gap:10px;padding:6px 22px 20px';
    foot.innerHTML='<button class="ms-btn ghost" type="button" id="msPruneCancel">Cancelar</button><button class="ms-btn danger" type="button" id="msPruneConfirm">Desinstalar selecionados</button>';
    modal.appendChild(head); modal.appendChild(body); modal.appendChild(foot);
    ovPrune.appendChild(modal);
    ovPrune.onclick=function(e){ if(e.target===ovPrune) closePruneModal(); };
    document.body.appendChild(ovPrune);
    document.getElementById('msPruneClose').addEventListener('click', closePruneModal);
    document.getElementById('msPruneCancel').addEventListener('click', closePruneModal);
    document.getElementById('msPruneList').addEventListener('change', updatePruneInfo);
    document.getElementById('msPruneConfirm').addEventListener('click', doPruneSelected);
  }

  function wireBench(){
    var profWrap=document.getElementById('msVbProf');
    if(profWrap) profWrap.addEventListener('click', function(e){
      var b=e.target.closest('.ms-fchip'); if(!b || msBench.running) return;
      Array.prototype.forEach.call(profWrap.querySelectorAll('.ms-fchip'), function(x){ x.classList.remove('on'); });
      b.classList.add('on');
      msState.vbProf=b.getAttribute('data-prof');
    });
    var runBtn=document.getElementById('msBtnRunBench'); if(runBtn) runBtn.addEventListener('click', doRunBench);
    var cancelBtn=document.getElementById('msBtnCancelBench'); if(cancelBtn) cancelBtn.addEventListener('click', doCancelBench);
    var vbResults=document.getElementById('msVbResults');
    if(vbResults) vbResults.addEventListener('click', function(e){
      var t=e.target.closest('[data-tune]');
      if(t && !t.hasAttribute('disabled')){ doOptimize(t.getAttribute('data-tune')); return; }
      var rb=e.target.closest('[data-rebench]');
      if(rb && !rb.hasAttribute('disabled')){
        var sel=document.getElementById('msVbModel'); if(sel) sel.value=rb.getAttribute('data-rebench');
        doRunBench();
      }
    });
    var benchList=document.getElementById('msBenchList');
    if(benchList) benchList.addEventListener('click', function(e){
      var sw=e.target.closest('[data-bact]'); if(!sw) return;
      var row=e.target.closest('.ms-irow'); var id=row&&row.getAttribute('data-id');
      var m=(msState.installed||[]).filter(function(x){ return x.id===id; })[0]; if(!m) return;
      toggleActive(m);
    });
    var gModel=document.getElementById('msGModel'); if(gModel) gModel.addEventListener('change', function(){ msGauge.modelId=this.value; updateGauge(); });
    var gAgent=document.getElementById('msGAgent'); if(gAgent) gAgent.addEventListener('click', function(){ this.classList.toggle('on'); msGauge.agentOn=this.classList.contains('on'); this.setAttribute('aria-checked',msGauge.agentOn); updateGauge(); });
    var gOthers=document.getElementById('msGOthers'); if(gOthers) gOthers.addEventListener('click', function(){ this.classList.toggle('on'); msGauge.othersOn=this.classList.contains('on'); this.setAttribute('aria-checked',msGauge.othersOn); updateGauge(); });
    wireGaugeTrack();
    var pruneOpenBtn=document.getElementById('msBtnPruneOpen');
    if(pruneOpenBtn) pruneOpenBtn.addEventListener('click', function(){ renderPruneModal(); if(ovPrune) ovPrune.classList.add('open'); });
  }

  /* ------------------------------------------------------------------ */
  /* 10) Instalar a montagem do botao e a leitura inicial (para o        */
  /*     monkey-patch do seletor funcionar mesmo sem o modal aberto).    */
  /* ------------------------------------------------------------------ */
  var n=0,t=setInterval(function(){ n++; if(mountBtn()||n>60) clearInterval(t); },150);
  if(document.readyState!=='loading') mountBtn();
  msFetchModelsForSelector();
})();
</script>
