    // compat legado: versões antigas guardavam a cor conflada em theme.color (objeto).
    if (v && v.theme && typeof v.theme === 'object' && v.theme.color) return v.theme.color;
    var idx = 0;
    if (v && v.id) { for (var i = 0; i < v.id.length; i++) idx += v.id.charCodeAt(i); idx = idx % COLORS.length; }
    return COLORS[idx];
  }

  /* ---------------------------------------------------------------------- */
  /* 4) API helpers — só GET/POST (router.py não proxia PATCH/DELETE).      */
  /* ---------------------------------------------------------------------- */
  function apiGet(url) {
    return fetch(url, { method: 'GET' }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status + ' ' + url);
      return r.json();
    });
  }
  function apiPost(url, body) {
    return fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body || {})
    }).then(function (r) {
      if (!r.ok) {
        return r.json().catch(function () { return {}; }).then(function (j) {
          var e = new Error('HTTP ' + r.status + ' ' + url);
          e.body = j;
          throw e;
        });
      }
      return r.json();
    });
  }

  /* ---------------------------------------------------------------------- */
  /* 5) Visão <-> MODES — ponto central de integração não destrutiva.       */
  /*    As 3 visões herdadas (id "cylinderui"/"cyber"/"god") mapeiam para as   */
  /*    chaves internas já existentes em MODES ("home"/"cyber"/"godmode"),  */
  /*    preservando cfgKey/cvKey/curKey/emptyHTML originais (mesmas chaves  */
  /*    de conversa de sempre — chaves de conversa herdadas */
  /*    godmode-conversations — para não perder histórico). Visões novas    */
  /*    ganham uma entrada NOVA em MODES, chaveada pelo próprio id.         */
  /* ---------------------------------------------------------------------- */
  /* Cache do emptyHTML ORIGINAL de cada modo herdado (home/cyber/godmode),
     capturado na 1a vez que o vemos -- assim o hero hardcoded do console
     (hero embutido herdado) nunca é perdido, mesmo se sobrescrevermos
     MODES[modo].emptyHTML por causa de um hero.image definido na visão. */
  var builtinEmptyCache = {};

  function heroImageOf(v) {
    return (v && v.hero && typeof v.hero === 'object' && typeof v.hero.image === 'string' && v.hero.image) ? v.hero.image : '';
  }
  /* true se a visão tem QUALQUER conteúdo de hero (image OU title OU subtitle
     OU pelo menos um chip não-vazio). Só quando é 100% vazio caímos no
     emptyHTML herdado / hero padrão CylinderUI. */
  function heroHasContent(v) {
    var h = (v && v.hero && typeof v.hero === 'object') ? v.hero : null;
    if (!h) return false;
    if (typeof h.image === 'string' && h.image) return true;
    if (typeof h.title === 'string' && h.title) return true;
    if (typeof h.subtitle === 'string' && h.subtitle) return true;
    if (Array.isArray(h.chips)) {
      for (var i = 0; i < h.chips.length; i++) {
        if (h.chips[i] != null && h.chips[i] !== '') return true;
      }
    }
    return false;
  }
  function buildHeroMarkup(image, title, subtitle, chips, extraClass) {
    var out = ['<div class="vis-hero' + (extraClass ? ' ' + extraClass : '') + '">'];
    if (image) out.push('<img class="vis-hero-img" alt="" src="' + escapeHtml(image) + '">');
    if (title) out.push('<h2 class="vis-hero-title">' + escapeHtml(title) + '</h2>');
    if (subtitle) out.push('<p class="vis-hero-sub">' + escapeHtml(subtitle) + '</p>');
    if (chips && chips.length) {
      out.push('<div class="vis-hero-chips">');
      for (var i = 0; i < chips.length; i++) {
        var c = chips[i];
        if (c == null || c === '') continue;
        out.push('<button type="button" class="vis-hero-chip" data-chip="' + escapeHtml(c) + '">' + escapeHtml(c) + '</button>');
      }
      out.push('</div>');
    }
    out.push('</div>');
    return out.join('');
  }
  function buildVisionHeroHTML(v) {
    var h = (v && v.hero) || {};
    var title = h.title || (v && v.name) || 'Visão';
    // Imagem: usa hero.image se preenchida; se vazia, cai no logo CylinderUI
    // padrão (mesmo data URI do hero padrão) — os textos/chips permanecem os da
    // visão, sem descartar nada.
    var image = h.image || LOGO_HERO_DATAURI;
    return buildHeroMarkup(image, title, h.subtitle || '', Array.isArray(h.chips) ? h.chips : [], 'vis-hero-custom');
  }
  function buildDefaultCylinderHeroHTML() {
    // HERO PADRÃO para visões NOVAS sem hero próprio: logo grande CylinderUI.
    return buildHeroMarkup(LOGO_HERO_DATAURI, HERO_DEFAULT_TITLE, HERO_DEFAULT_SUBTITLE, [], 'vis-hero-default');
  }

  /* ---------------------------------------------------------------------- */
  /* Lápis 'Editar hero' sobre a tela de boas-vindas da VISÃO ATIVA.        */
  /* Overlay independente do conteúdo: funciona tanto no hero              */
  /* customizado/padrão (buildVisionHeroHTML) quanto no emptyHTML herdado  */
  /* (visões herdadas). Só aparece quando há visão ativa.                */
  /* ---------------------------------------------------------------------- */
  function heroWelcomeContainer() {
    return document.querySelector('.empty') || byId('thread') || document.querySelector('.thread') || null;
  }
  function refreshHeroPencil() {
    var c = heroWelcomeContainer();
    if (!c) return;
    var btn = c.querySelector('.vis-hero-edit');
    if (!visActiveId) { if (btn && btn.parentNode) btn.parentNode.removeChild(btn); return; }
    if (btn) return; /* já presente (idempotente para o MutationObserver) */
    if (!c.style.position) c.style.position = 'relative';
    btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'vis-hero-edit';
    btn.id = 'visHeroEditBtn';
    var lbl = vt('visions.hero.editBtn', 'Editar hero da visão');
    btn.title = lbl;
    btn.setAttribute('aria-label', lbl);
    btn.innerHTML = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"></path></svg>';
    btn.addEventListener('click', function (ev) {
      if (ev) { try { ev.preventDefault(); ev.stopPropagation(); } catch (e) {} }
      var aid = visActiveId;
      if (!aid) return;
      openEditor(aid);
      try {
        var hf = byId('visEdHeroUrl') || byId('visEdHeroTitle');
        if (hf && typeof hf.scrollIntoView === 'function') hf.scrollIntoView({ block: 'center', behavior: 'smooth' });
      } catch (e) {}
    });
    c.appendChild(btn);
  }
  function installHeroPencilObserver() {
    try {
      var chatEl = byId('chat') || document.querySelector('.chat');
      if (!chatEl || typeof MutationObserver === 'undefined' || chatEl.__visHeroObs) return;
      chatEl.__visHeroObs = new MutationObserver(function () { try { refreshHeroPencil(); } catch (e) {} });
      chatEl.__visHeroObs.observe(chatEl, { childList: true, subtree: true });
    } catch (e) {}
  }

  function ensureModeEntry(v) {
    var isBuiltin = !!BUILTIN_ID_TO_MODE[v.id];
    var internalMode = isBuiltin ? BUILTIN_ID_TO_MODE[v.id] : v.id;
    var existing = MODES[internalMode];
    if (isBuiltin && existing && !(internalMode in builtinEmptyCache)) {
      builtinEmptyCache[internalMode] = existing.emptyHTML;
    }
    var title = v.name || (existing && existing.title) || 'Visão';
    var allow = (v.models && v.models.length) ? v.models.slice() : (existing ? (existing.allow || []).slice() : []);
    // emptyHTML / hero:
    //   QUALQUER campo de hero (image/title/subtitle/chips) -> hero DA VISÃO,
    //     inclusive em herdada; imagem vazia usa o logo CylinderUI padrão;
    //   senão herdada         -> emptyHTML herdado do modo;
    //   senão (nova sem hero) -> HERO PADRÃO CylinderUI (logo grande).
    var emptyHTML;
    if (heroHasContent(v)) {
      emptyHTML = buildVisionHeroHTML(v);
    } else if (isBuiltin) {
      emptyHTML = builtinEmptyCache[internalMode] || buildDefaultCylinderHeroHTML();
    } else {
      emptyHTML = buildDefaultCylinderHeroHTML();
    }
    var entry = {
      title: title,
      header: title,
      placeholder: 'Mensagem para o ' + title + '…',
      who: title,
      allow: allow,
      defaultSys: (typeof v.systemPrompt === 'string') ? v.systemPrompt : (existing ? existing.defaultSys : ''),
      cfgKey: (isBuiltin && existing) ? existing.cfgKey : (internalMode + '-config'),
      cvKey: (isBuiltin && existing) ? existing.cvKey : (v.conversationKey || (internalMode + '-conversations')),
      curKey: (isBuiltin && existing) ? existing.curKey : (internalMode + '-current'),
      emptyHTML: emptyHTML
    };
    MODES[internalMode] = entry;
    v.__internalMode = internalMode;
    return internalMode;
  }

  /* Emblema (badge) da visão ativa no topo da sidebar, ao lado do logo
     CylinderUI (.cyl-brand-mark). Dirigido por vision.badge (STRING):
       - badge não-vazio  -> mostra a imagem custom (e suprime o lg-god
         hardcoded, evitando dois emblemas na visão avançada com badge próprio);
       - badge vazio      -> nenhum emblema custom. a visão herdada cai no lg-god
         DEFAULT (mostrado via CSS `:root.god .logo.lg-god`); as demais
         visões ficam só com o logo CylinderUI. */
  function renderVisionBadge(v) {
    try {
      var side = document.getElementById('side');
      var brandEl = side ? side.querySelector('.side-brand') : document.querySelector('.side-brand');
      if (!brandEl) return;
      var badge = (v && typeof v.badge === 'string') ? v.badge.trim() : '';
      var lgGod = brandEl.querySelector('img.logo.lg-god');
      var holder = brandEl.querySelector('.cyl-vis-badge');
      if (badge) {
        if (!holder) {
          holder = document.createElement('span');
          holder.className = 'cyl-vis-badge';
          var mark = brandEl.querySelector('.cyl-brand-mark');
          if (mark && mark.nextSibling) brandEl.insertBefore(holder, mark.nextSibling);
          else if (mark) brandEl.appendChild(holder);
          else brandEl.insertBefore(holder, brandEl.firstChild);
        }
        holder.innerHTML = '<img class="cyl-vis-badge-img" alt="' + escapeHtml((v && v.name) || 'emblema') + '" src="' + escapeHtml(badge) + '">';
        holder.style.display = '';
        if (lgGod) lgGod.classList.add('cyl-vis-badge-suppress-god');
      } else {
        if (holder) { holder.innerHTML = ''; holder.style.display = 'none'; }
        if (lgGod) lgGod.classList.remove('cyl-vis-badge-suppress-god');
      }
    } catch (e) {}
  }

  function activateVision(id) {
    var v = getVisionById(id);
    if (!v) return;
    var internalMode = ensureModeEntry(v);
    try {
      var cfgKeyForV = MODES[internalMode].cfgKey;
      var already = store.get(cfgKeyForV, null);
      if (already === null) {
        store.set(cfgKeyForV, { model: v.defaultModel || '', systemPrompt: v.systemPrompt || '', effort: 'medium' });
      }
    } catch (e) {}
    applyMode(internalMode);
    visActiveId = id;
    try { localStorage.setItem(VIS_ACTIVE_LS_KEY, id); } catch (e) {}
    try { window.applyVisionTheme(v.theme); } catch (e) {}
    visOpenMenuId = null;
    renderVisSidebar();
    renderVisionBadge(v);
    refreshHeroPencil();
  }

  /* ---------------------------------------------------------------------- */
  /* 6) Sidebar de Visões — some por cima da nav fixa de 3 modos.           */
  /* ---------------------------------------------------------------------- */
  function buildSidebarDom() {
    if (byId('visSidebarRoot')) return;
    var root = document.createElement('div');
    root.className = 'vis-sidebar';
    root.id = 'visSidebarRoot';
    root.innerHTML =
      '<div class="vis-sidebar-title" id="visSidebarTitle">' + escapeHtml(vt('visions.title', 'Visões')) + '</div>' +
      '<button type="button" class="vis-add-btn" id="visAddBtn">' + escapeHtml(vt('visions.add', '+ Adicionar Visão')) + '</button>' +
      '<ul class="vis-list" id="visList"></ul>';
    sideEl.insertBefore(root, convListEl);

    var label = document.createElement('div');
    label.className = 'vis-conv-label';
    label.id = 'visConvLabel';
    label.textContent = vt('visions.conversations', 'Conversas');
    sideEl.insertBefore(label, convListEl);

    var addBtn = byId('visAddBtn');
    if (addBtn) addBtn.addEventListener('click', function () { openEditor(null); });
    document.addEventListener('click', function () {
      if (visOpenMenuId) { visOpenMenuId = null; renderVisSidebar(); }
    });
    // Chips do HERO preenchem o composer ao clicar (delegação global, aditiva).
    document.addEventListener('click', function (ev) {
      var chip = ev.target && ev.target.closest ? ev.target.closest('.vis-hero-chip') : null;
      if (!chip) return;
      var text = chip.getAttribute('data-chip') || chip.textContent || '';
      var inp = byId('input');
      if (inp) {
        inp.value = text;
        try { inp.focus(); } catch (e) {}
        try { inp.dispatchEvent(new Event('input', { bubbles: true })); } catch (e) {}
      }
    });
  }

  function renderVisSidebar() {
    var list = byId('visList');
    if (!list) return;
    var htmlParts = [];
    for (var i = 0; i < visVisions.length; i++) {
      var v = visVisions[i];
      var active = v.id === visActiveId;
      var initial = ((v.name || '?').trim().charAt(0) || '?').toUpperCase();
      var menuOpen = visOpenMenuId === v.id;
      var s = '<li class="vis-item' + (active ? ' vis-active' : '') + '" data-vis-id="' + escapeHtml(v.id) + '">';
      s += '<div class="vis-avatar" style="background:' + visionColor(v) + '">' + escapeHtml(initial) + '</div>';
      s += '<div class="vis-meta"><div class="vis-name">' + escapeHtml(v.name) + '</div><div class="vis-model">' + escapeHtml(modelLabel(v.defaultModel)) + '</div></div>';
      s += '<div class="vis-controls">';
      s += '<button type="button" class="vis-icon-btn vis-move-up" title="' + escapeHtml(vt('visions.moveUp', 'Mover para cima')) + '"' + (i === 0 ? ' disabled' : '') + '>▲</button>';
      s += '<button type="button" class="vis-icon-btn vis-move-down" title="' + escapeHtml(vt('visions.moveDown', 'Mover para baixo')) + '"' + (i === visVisions.length - 1 ? ' disabled' : '') + '>▼</button>';
      s += '<button type="button" class="vis-icon-btn vis-menu-toggle" title="' + escapeHtml(vt('visions.more', 'Mais opções')) + '">⋮</button>';
      s += '</div>';
      if (menuOpen) {
        s += '<div class="vis-kebab-menu">' +
          '<button type="button" class="vis-menu-edit">✎ ' + escapeHtml(vt('visions.menu.edit', 'Editar')) + '</button>' +
          '<button type="button" class="vis-menu-dup">⧉ ' + escapeHtml(vt('visions.menu.duplicate', 'Duplicar')) + '</button>' +
          '<button type="button" class="vis-menu-del vis-danger">🗑 ' + escapeHtml(vt('visions.menu.delete', 'Apagar')) + '</button>' +
          '</div>';
      }
      s += '</li>';
      htmlParts.push(s);
    }
    list.innerHTML = htmlParts.join('');

    var items = list.querySelectorAll('.vis-item');
    for (var k = 0; k < items.length; k++) {
      (function (li) {
        var id = li.getAttribute('data-vis-id');
        li.addEventListener('click', function (ev) {
          if ((ev.target.closest && ev.target.closest('.vis-controls')) || (ev.target.closest && ev.target.closest('.vis-kebab-menu'))) return;
          activateVision(id);
        });
        var up = li.querySelector('.vis-move-up');
        if (up) up.addEventListener('click', function (ev) { ev.stopPropagation(); moveVision(id, -1); });
        var down = li.querySelector('.vis-move-down');
        if (down) down.addEventListener('click', function (ev) { ev.stopPropagation(); moveVision(id, 1); });
        var menuBtn = li.querySelector('.vis-menu-toggle');
        if (menuBtn) menuBtn.addEventListener('click', function (ev) { ev.stopPropagation(); visOpenMenuId = (visOpenMenuId === id) ? null : id; renderVisSidebar(); });
        var edit = li.querySelector('.vis-menu-edit');
        if (edit) edit.addEventListener('click', function (ev) { ev.stopPropagation(); openEditor(id); });
        var dup = li.querySelector('.vis-menu-dup');
        if (dup) dup.addEventListener('click', function (ev) { ev.stopPropagation(); duplicateVision(id); });
        var del = li.querySelector('.vis-menu-del');
        if (del) del.addEventListener('click', function (ev) { ev.stopPropagation(); requestDelete(id); });
      })(items[k]);
    }

    var label = byId('visConvLabel');
    if (label) {
      var av = getVisionById(visActiveId);
      var convWord = vt('visions.conversations', 'Conversas');
      label.textContent = av ? (convWord + ' — ' + av.name) : convWord;
    }
  }

  /* ---------------------------------------------------------------------- */
  /* 7) Reorder / Duplicar / Apagar                                        */
  /* ---------------------------------------------------------------------- */
  function moveVision(id, dir) {
    var idx = -1;
    for (var i = 0; i < visVisions.length; i++) if (visVisions[i].id === id) { idx = i; break; }
    if (idx < 0) return;
    var newIdx = idx + dir;
    if (newIdx < 0 || newIdx >= visVisions.length) return;
    var prevOrder = visVisions.slice();
    var tmp = visVisions[idx]; visVisions[idx] = visVisions[newIdx]; visVisions[newIdx] = tmp;
    renderVisSidebar();
    var ids = visVisions.map(function (v) { return v.id; });
    apiPost('/api/visions/reorder', { ids: ids }).catch(function (err) {
      visVisions = prevOrder;
      renderVisSidebar();
      try { console.warn('[visions] falha ao reordenar, revertendo', err); } catch (e) {}
    });
  }

  function duplicateVision(id) {
    var v = getVisionById(id);
    if (!v) return;
    visOpenMenuId = null;
    var payload = {
      name: v.name + ' (cópia)',
      theme: v.theme,   // STRING do tema (independente)
      color: v.color,   // STRING da cor do ícone (independente)
      systemPrompt: v.systemPrompt,
      models: (v.models || []).slice(),
      defaultModel: v.defaultModel,
      exec: v.exec,
      showOtherVisionsChats: !!v.showOtherVisionsChats
    };
    apiPost('/api/visions', payload).then(function (created) {
      visVisions.push(created);
      ensureModeEntry(created);
      renderVisSidebar();
    }).catch(function (err) {
      try { console.warn('[visions] falha ao duplicar visão', err); } catch (e) {}
      renderVisSidebar();
    });
  }

  function requestDelete(id) {
    visDeleteTargetId = id;
    visOpenMenuId = null;
    renderVisSidebar();
    var v = getVisionById(id);
    var body = byId('visDeleteBody');
    if (body) body.innerHTML = 'Tem certeza que deseja apagar a visão <b>' + escapeHtml(v ? v.name : '') + '</b>? Ela some da lista de Visões; as conversas continuam salvas localmente neste navegador. Esta ação não pode ser desfeita no servidor.';
    var overlay = byId('visDeleteOverlay');
    if (overlay) overlay.classList.add('vis-open');
  }
  function hideDeleteModal() {
    var overlay = byId('visDeleteOverlay');
    if (overlay) overlay.classList.remove('vis-open');
    visDeleteTargetId = null;
  }
  function confirmDelete() {
    var id = visDeleteTargetId;
    if (!id) { hideDeleteModal(); return; }
    apiPost('/api/visions/delete', { id: id }).then(function () {
      visVisions = visVisions.filter(function (v) { return v.id !== id; });
      hideDeleteModal();
      if (visActiveId === id) {
        var next = visVisions[0];
        if (next) activateVision(next.id); else { visActiveId = null; renderVisSidebar(); }
      } else {
        renderVisSidebar();
      }
    }).catch(function (err) {
      try { console.warn('[visions] falha ao apagar visão', err); } catch (e) {}
      hideDeleteModal();
    });
  }

  /* ---------------------------------------------------------------------- */
  /* 8) Editor de Visão (modal Add/Editar)                                  */
  /* ---------------------------------------------------------------------- */
  function onExecModeChange() {
    var checked = document.querySelector('input[name="visEdExecMode"]:checked');
    var mode = checked ? checked.value : 'single';
    var dualEl = byId('visModeDual'), agentEl = byId('visModeAgent');
    if (dualEl) dualEl.classList.toggle('vis-show', mode === 'dual');
    if (agentEl) agentEl.classList.toggle('vis-show', mode === 'agent');
  }
  function getCheckedModelIds() {
    var out = [];
    var boxes = document.querySelectorAll('.vis-ed-model-cb');
    for (var i = 0; i < boxes.length; i++) if (boxes[i].checked) out.push(boxes[i].value);
    return out;
  }
  function renderModelCheckboxes(selectedIds) {
    var wrap = byId('visEdModels');
    if (!wrap) return;
    var source = visModelsCache.length ? visModelsCache : selectedIds.map(function (id) { return { id: id, name: id }; });
    if (!source.length) {
      wrap.innerHTML = '<div class="vis-hint">Não foi possível carregar a lista de modelos (/api/models). Os modelos já salvos na visão continuam preservados ao salvar.</div>';
      return;
    }
    wrap.innerHTML = source.map(function (m) {
      var checked = selectedIds.indexOf(m.id) >= 0;
      return '<label class="vis-checkbox-row"><input type="checkbox" class="vis-ed-model-cb" value="' + escapeHtml(m.id) + '"' + (checked ? ' checked' : '') + '> ' + escapeHtml(m.name || m.id) + '</label>';
    }).join('');
    var boxes = wrap.querySelectorAll('.vis-ed-model-cb');
    for (var i = 0; i < boxes.length; i++) boxes[i].addEventListener('change', function () { populateModelSelects(getCheckedModelIds()); });
  }
  function populateModelSelects(ids) {
    var optionsHtml = ids.map(function (id) { return '<option value="' + escapeHtml(id) + '">' + escapeHtml(modelLabel(id)) + '</option>'; }).join('');
    ['visEdDefaultModel', 'visEdMain', 'visEdAux', 'visEdAgentMain'].forEach(function (selId) {
      var el = byId(selId);
      if (!el) return;
      var prev = el.value;
      el.innerHTML = optionsHtml;
      if (ids.indexOf(prev) >= 0) el.value = prev;
    });
  }

  function buildModalDom() {
    if (byId('visEditorOverlay')) return;
    var overlay = document.createElement('div');
    overlay.className = 'vis-modal-overlay';
    overlay.id = 'visEditorOverlay';
    overlay.innerHTML =
      '<div class="vis-modal">' +
        '<div class="vis-modal-header"><h3 id="visEditorTitle">Nova Visão</h3><button type="button" class="vis-icon-btn" id="visEditorClose">✕</button></div>' +
        '<div class="vis-modal-body">' +
          '<div class="vis-field"><label>Nome da visão</label><input type="text" id="visEdName" placeholder="ex.: Pesquisa"></div>' +
          '<div class="vis-field"><label>Cor</label><div class="vis-swatches" id="visEdSwatches"></div><div class="vis-hint">Cor do ícone desta visão na barra lateral.</div></div>' +
          '<div class="vis-field" id="visEdThemeField"><label>Tema</label>' +
            '<div class="vis-radio-group" id="visEdThemeGroup">' +
              '<label class="vis-radio-pill"><input type="radio" name="visEdTheme" value="cylinderui" checked> Warm</label>' +
              '<label class="vis-radio-pill"><input type="radio" name="visEdTheme" value="chatgpt"> Estilo ChatGPT</label>' +
              '<label class="vis-radio-pill"><input type="radio" name="visEdTheme" value="ios9"> Estilo Apple</label>' +
            '</div>' +
            '<div class="vis-hint">Define o visual (tema) desta visão.</div></div>' +
          '<div class="vis-field"><label>Modelos permitidos</label><div class="vis-checkbox-list" id="visEdModels"></div></div>' +
          '<div class="vis-field"><label>Modelo padrão</label><select id="visEdDefaultModel"></select></div>' +

    document.body.appendChild(overlay);

    document.body.appendChild(delOverlay);

    var sw = byId('visEdSwatches');
    sw.innerHTML = COLORS.map(function (c) { return '<button type="button" class="vis-swatch" data-color="' + c + '" style="background:' + c + '"></button>'; }).join('');
    var swSelected = COLORS[0];
    function updateSwatchSelection() {
      var btns = sw.querySelectorAll('.vis-swatch');
      for (var i = 0; i < btns.length; i++) btns[i].classList.toggle('vis-selected', btns[i].getAttribute('data-color') === swSelected);
    }
    sw.addEventListener('click', function (ev) {
      var btn = ev.target.closest ? ev.target.closest('.vis-swatch') : null;
      if (!btn) return;
      swSelected = btn.getAttribute('data-color');

    });
    sw.__getSelected = function () { return swSelected; };
    sw.__setSelected = function (c) { swSelected = c || COLORS[0]; updateSwatchSelection(); };

    var modeGroup = byId('visEdModeGroup');
    var MODE_OPTIONS = [{ v: 'single', l: '1 modelo' }, { v: 'dual', l: '2 modelos + papel' }, { v: 'agent', l: 'Agente + ferramentas' }];
    modeGroup.innerHTML = MODE_OPTIONS.map(function (o, i) {
      return '<label class="vis-radio-pill"><input type="radio" name="visEdExecMode" value="' + o.v + '"' + (i === 0 ? ' checked' : '') + '> ' + o.l + '</label>';
    }).join('');
    modeGroup.addEventListener('change', onExecModeChange);

    var roleSel = byId('visEdRole');
    roleSel.innerHTML = EXEC_ROLES.map(function (r) { return '<option value="' + r + '">' + r + '</option>'; }).join('');

    /* ---- Editor HERO: imagem (upload -> data URI OU URL), preview e chips ---- */
    var heroChips = [];
    var heroChipList = byId('visEdHeroChipList');
    function renderHeroPreview() {
      var p = byId('visEdHeroPreview'); if (!p) return;
      var img = byId('visEdHeroImage').value;
      p.innerHTML = img ? '<img alt="preview" src="' + escapeHtml(img) + '">' : '';
    }
    function renderHeroChips() {
      if (!heroChipList) return;
      heroChipList.innerHTML = heroChips.map(function (c, i) {
        return '<span class="vis-hero-chip-tag" data-i="' + i + '">' + escapeHtml(c) + '<button type="button" class="vis-hero-chip-del" data-i="' + i + '" title="Remover">×</button></span>';
      }).join('');
    }
    function addHeroChip() {
      var inp = byId('visEdHeroChipInput');
      var val = (inp.value || '').trim();
      if (!val) { inp.focus(); return; }
      if (heroChips.length >= 4) return; // até 4 chips
      heroChips.push(val);
      inp.value = '';
      renderHeroChips();
    }
    heroChipList.__getChips = function () { return heroChips.slice(); };
    heroChipList.__setChips = function (arr) {
      heroChips = (Array.isArray(arr) ? arr.slice(0, 4) : []).filter(function (c) { return c != null && c !== ''; });
      renderHeroChips();
    };
    heroChipList.addEventListener('click', function (ev) {
      var del = ev.target.closest ? ev.target.closest('.vis-hero-chip-del') : null;
      if (!del) return;
      var i = parseInt(del.getAttribute('data-i'), 10);
      if (!isNaN(i)) { heroChips.splice(i, 1); renderHeroChips(); }
    });
    byId('visEdHeroChipAdd').addEventListener('click', addHeroChip);
    byId('visEdHeroChipInput').addEventListener('keydown', function (ev) { if (ev.key === 'Enter') { ev.preventDefault(); addHeroChip(); } });
    byId('visEdHeroUploadBtn').addEventListener('click', function () { var f = byId('visEdHeroFile'); if (f) f.click(); });
    byId('visEdHeroFile').addEventListener('change', function () {
      var f = this.files && this.files[0];
      if (!f) return;
      try {
        var reader = new FileReader();
        reader.onload = function () {
          byId('visEdHeroImage').value = String(reader.result || '');
          var u = byId('visEdHeroUrl'); if (u) u.value = '';
          renderHeroPreview();
        };
        reader.readAsDataURL(f);
      } catch (e) { try { console.warn('[visions] falha ao ler imagem do hero', e); } catch (_e) {} }
    });
    byId('visEdHeroUrl').addEventListener('input', function () {
      byId('visEdHeroImage').value = (this.value || '').trim();
      renderHeroPreview();
    });
    byId('visEdHeroImage').__renderPreview = renderHeroPreview;

    /* ---- Editor BADGE: imagem (upload -> data URI OU URL) + preview com
       PLACEHOLDER tracejado (quadradinho + ícone "+") quando vazio. ---- */
    var BADGE_PLACEHOLDER =
      '<span class="vis-badge-placeholder" title="Sem emblema">' +
        '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">' +
          '<path d="M12 5v14M5 12h14"/>' +
        '</svg>' +
      '</span>';
    function renderBadgePreview() {
      var p = byId('visEdBadgePreview'); if (!p) return;
      var img = byId('visEdBadge').value;
      p.innerHTML = img ? '<img alt="preview do emblema" src="' + escapeHtml(img) + '">' : BADGE_PLACEHOLDER;
    }
    byId('visEdBadgeUploadBtn').addEventListener('click', function () { var f = byId('visEdBadgeFile'); if (f) f.click(); });
    byId('visEdBadgeFile').addEventListener('change', function () {
      var f = this.files && this.files[0];
      if (!f) return;
      try {
        var reader = new FileReader();
        reader.onload = function () {
          byId('visEdBadge').value = String(reader.result || '');
          var u = byId('visEdBadgeUrl'); if (u) u.value = '';
          renderBadgePreview();
        };
        reader.readAsDataURL(f);
      } catch (e) { try { console.warn('[visions] falha ao ler imagem do badge', e); } catch (_e) {} }
    });
    byId('visEdBadgeUrl').addEventListener('input', function () {
      byId('visEdBadge').value = (this.value || '').trim();
      renderBadgePreview();
    });
    byId('visEdBadge').__renderPreview = renderBadgePreview;

    byId('visEditorClose').addEventListener('click', closeEditor);
    byId('visEditorCancel').addEventListener('click', closeEditor);
    byId('visEditorSave').addEventListener('click', function () { saveEditor(); });
    byId('visDeleteClose').addEventListener('click', hideDeleteModal);
    byId('visDeleteCancel').addEventListener('click', hideDeleteModal);
    byId('visDeleteConfirm').addEventListener('click', confirmDelete);
  }

  function openEditor(id) {
    visEditingId = id;
    visOpenMenuId = null;
    renderVisSidebar();
    var v = id ? getVisionById(id) : null;
    byId('visEditorTitle').textContent = v ? vt('visions.editor.editTitle', 'Editar Visão') : vt('visions.editor.newTitle', 'Nova Visão');
    byId('visEdName').value = v ? (v.name || '') : '';
    byId('visEdSwatches').__setSelected(v ? visionColor(v) : COLORS[0]);

    // Tema (STRING): edição pré-seleciona vision.theme; visão nova = "cylinderui".
    // (o seletor vive no modal desde buildModalDom; independe do wrapper da VF2.)
    var _themeName = 'cylinderui';
    if (v) {
      if (typeof v.theme === 'string' && v.theme) _themeName = v.theme;
      else if (v.theme && typeof v.theme === 'object' && v.theme.name) _themeName = v.theme.name; // compat legado
    }
    var _themeRadios = document.querySelectorAll('input[name="visEdTheme"]');
    for (var _ti = 0; _ti < _themeRadios.length; _ti++) _themeRadios[_ti].checked = (_themeRadios[_ti].value === _themeName);

    var allowed = (v && v.models && v.models.length) ? v.models.slice() : (visModelsCache[0] ? [visModelsCache[0].id] : []);
    renderModelCheckboxes(allowed);
    populateModelSelects(allowed);
    byId('visEdDefaultModel').value = (v && v.defaultModel) ? v.defaultModel : (allowed[0] || '');

    var execIn = (v && v.exec) ? v.exec : { mode: 'single', main: null, aux: null, role: 'review', tools: { files: false, rag: false, web: false } };
    var wantedMode = execIn.mode || 'single';
    var modeRadio = document.querySelector('input[name="visEdExecMode"][value="' + wantedMode + '"]');
    var fallbackRadio = document.querySelector('input[name="visEdExecMode"][value="single"]');
    if (modeRadio) modeRadio.checked = true; else if (fallbackRadio) fallbackRadio.checked = true;
    onExecModeChange();
    byId('visEdMain').value = execIn.main || '';
    byId('visEdAux').value = execIn.aux || '';
    byId('visEdRole').value = execIn.role || 'review';
    byId('visEdAgentMain').value = execIn.main || '';
    byId('visEdToolFiles').checked = !!(execIn.tools && execIn.tools.files);
    byId('visEdToolRag').checked = !!(execIn.tools && execIn.tools.rag);
    byId('visEdToolWeb').checked = !!(execIn.tools && execIn.tools.web);

    byId('visEdSystemPrompt').value = v ? (v.systemPrompt || '') : '';
    byId('visEdShowOther').checked = v ? !!v.showOtherVisionsChats : false;

    // HERO: pré-preenche do hero atual da visão (ou vazio em visão nova).
    var hero = (v && v.hero && typeof v.hero === 'object') ? v.hero : {};
    var heroImg = (typeof hero.image === 'string') ? hero.image : '';
    byId('visEdHeroImage').value = heroImg;
    // URL (não data URI) volta ao campo de texto pra edição; data URIs de upload
    // ficam só no hidden (grandes demais pro input visível).
    byId('visEdHeroUrl').value = (heroImg && heroImg.slice(0, 5) !== 'data:') ? heroImg : '';
    byId('visEdHeroTitle').value = (typeof hero.title === 'string') ? hero.title : '';
    byId('visEdHeroSubtitle').value = (typeof hero.subtitle === 'string') ? hero.subtitle : '';
    byId('visEdHeroChipList').__setChips(Array.isArray(hero.chips) ? hero.chips : []);
    try { byId('visEdHeroImage').__renderPreview(); } catch (e) {}

    // BADGE: pré-preenche do badge atual da visão (STRING; "" em visão nova).
    var badgeVal = (v && typeof v.badge === 'string') ? v.badge : '';
    byId('visEdBadge').value = badgeVal;
    // URL (não data URI) volta ao campo de texto pra edição; data URIs ficam
    // só no hidden (grandes demais pro input visível). Igual ao hero.
    byId('visEdBadgeUrl').value = (badgeVal && badgeVal.slice(0, 5) !== 'data:') ? badgeVal : '';
    try { byId('visEdBadge').__renderPreview(); } catch (e) {}

    var overlay = byId('visEditorOverlay');
    if (overlay) overlay.classList.add('vis-open');
  }
  function closeEditor() {
    var overlay = byId('visEditorOverlay');
    if (overlay) overlay.classList.remove('vis-open');
    visEditingId = undefined;
  }
  function saveEditor() {
    var nameEl = byId('visEdName');
    var name = (nameEl.value || '').trim();
    if (!name) { nameEl.focus(); return; }
    var color = byId('visEdSwatches').__getSelected();
    var models = getCheckedModelIds();
    var defaultModel = byId('visEdDefaultModel').value || models[0] || '';
    var checkedModeInput = document.querySelector('input[name="visEdExecMode"]:checked');
    var mode = checkedModeInput ? checkedModeInput.value : 'single';
    var tools = { files: byId('visEdToolFiles').checked, rag: byId('visEdToolRag').checked, web: byId('visEdToolWeb').checked };
    var execOut;
    if (mode === 'dual') {
      execOut = { mode: 'dual', main: byId('visEdMain').value || null, aux: byId('visEdAux').value || null, role: byId('visEdRole').value || 'review', tools: tools };
    } else if (mode === 'agent') {
      execOut = { mode: 'agent', main: byId('visEdAgentMain').value || null, aux: null, role: 'review', tools: tools };
    } else {
      execOut = { mode: 'single', main: defaultModel || null, aux: null, role: 'review', tools: tools };
    }
    // Seletor de Tema (3 opções, injetado no editor pela VF2). O backend agora
    // tem DOIS campos de 1º nível INDEPENDENTES: `theme` (STRING do estilo da UI:
    // "cylinderui"|"chatgpt"|"ios9") e `color` (STRING hex da cor do ícone). Cada um
    // viaja como campo separado no payload — nada de empacotar em objeto. O
    // update_vision do backend faz merge parcial, então mandar os dois lado a
    // lado é seguro (ver STATUS-fixB.md).
    var themeName = 'cylinderui';
    var themeRadio = document.querySelector('input[name="visEdTheme"]:checked');
    if (themeRadio) { themeName = themeRadio.value; }
    else if (visEditingId) {
      var _curV = getVisionById(visEditingId);
      if (_curV) {
        if (typeof _curV.theme === 'string' && _curV.theme) themeName = _curV.theme;
        else if (_curV.theme && typeof _curV.theme === 'object' && _curV.theme.name) themeName = _curV.theme.name; // compat legado
      }
    }
    // HERO (objeto completo, sempre enviado inteiro — backend substitui o hero
    // inteiro no create/update, nunca faz merge de sub-campos). image aceita
    // data URI (upload) OU URL; pode ser "".
    var heroImageEl = byId('visEdHeroImage');
    var heroChipListEl = byId('visEdHeroChipList');
    var hero = {
      image: (heroImageEl && heroImageEl.value) ? heroImageEl.value : '',
      title: byId('visEdHeroTitle').value || '',
      subtitle: byId('visEdHeroSubtitle').value || '',
      chips: (heroChipListEl && heroChipListEl.__getChips) ? heroChipListEl.__getChips() : []
    };
    // BADGE (STRING: data URI de upload OU URL; pode ""). Campo de 1º nível
    // independente, merge igual a color/theme no backend (ver STATUS-badge-*).
    var badgeEl = byId('visEdBadge');
    var badge = (badgeEl && badgeEl.value) ? badgeEl.value : '';
    var payload = {
      name: name,
      theme: themeName,   // STRING do tema (campo independente)
      color: color,       // STRING hex da cor do ícone (campo independente)
      badge: badge,       // STRING do emblema no topo (campo independente)
      systemPrompt: byId('visEdSystemPrompt').value || '',
      models: models,
      defaultModel: defaultModel,
      exec: execOut,
      hero: hero,         // objeto completo do hero (image/title/subtitle/chips)
      showOtherVisionsChats: byId('visEdShowOther').checked
    };

    var req;
    if (visEditingId) {
      var body = {};
      for (var k in payload) body[k] = payload[k];
      body.id = visEditingId;
      req = apiPost('/api/visions/update', body);
    } else {
      req = apiPost('/api/visions', payload);
    }
    req.then(function (result) {
      if (visEditingId) {
        var idx = -1;
        for (var i = 0; i < visVisions.length; i++) if (visVisions[i].id === visEditingId) { idx = i; break; }
        if (idx >= 0) visVisions[idx] = result;
        ensureModeEntry(result);
        if (visActiveId === result.id) activateVision(result.id);
      } else {
        visVisions.push(result);
        ensureModeEntry(result);
      }
      closeEditor();
      renderVisSidebar();
    }).catch(function (err) {
      try { console.warn('[visions] falha ao salvar visão', err); } catch (e) {}
    });
  }

  /* ---------------------------------------------------------------------- */
  /* 9) Boot — carrega /api/visions (+ /api/models best-effort) e só então  */
  /*    instala a sidebar. Qualquer falha em /api/visions = no-op total.    */
  /* ---------------------------------------------------------------------- */
  function installSidebar() {
    try {
      for (var i = 0; i < visVisions.length; i++) ensureModeEntry(visVisions[i]);
      buildSidebarDom();
      buildModalDom();
      var savedActive = null;
      try { savedActive = localStorage.getItem(VIS_ACTIVE_LS_KEY); } catch (e) {}
      var target = (savedActive && getVisionById(savedActive)) ? savedActive : (visVisions[0] ? visVisions[0].id : null);
      if (target) activateVision(target); else renderVisSidebar();
      sideEl.classList.add('vis-nav-hidden');
      installHeroPencilObserver();
      refreshHeroPencil();
    } catch (e) {
      try { console.warn('[visions] falha ao instalar sidebar dinâmica, mantendo a visão padrão do console', e); } catch (_e) {}
    }
  }

  function boot() {
    var visionsP = apiGet('/api/visions').then(function (data) {
      if (!data || !Array.isArray(data.visions)) throw new Error('formato inesperado em /api/visions');
      visVisions = data.visions.slice();
      visApiOk = true;
    });
    var modelsP = apiGet('/api/models').then(function (data) {
      if (data && Array.isArray(data.models)) visModelsCache = data.models;
    }).catch(function () { /* lista de modelos é best-effort no boot */ });

    return Promise.all([visionsP, modelsP]).then(function () {
      installSidebar();
    }).catch(function (err) {
      visApiOk = false;
      try { console.warn('[visions] /api/visions indisponível — mantendo a visão padrão do console', err); } catch (e) {}
    });
  }

  var readyPromise;
  try {
    readyPromise = boot();
  } catch (e) {
    readyPromise = Promise.resolve();
    try { console.warn('[visions] falha inesperada no boot, mantendo a visão padrão do console', e); } catch (_e) {}
  }

  /* Acesso de depuração/teste (mesmo padrão de window.__convIdb em conv-js). */
  window.__visions = {
    ready: readyPromise,
    getState: function () { return { visions: visVisions.slice(), activeId: visActiveId, apiOk: visApiOk }; },
    activate: activateVision,
    move: moveVision,
    duplicate: duplicateVision,
    requestDelete: requestDelete,
    confirmDelete: confirmDelete,
    hideDeleteModal: hideDeleteModal,
    openEditor: openEditor,
    closeEditor: closeEditor,
    saveEditor: saveEditor,
    refreshHeroPencil: refreshHeroPencil,
    renderVisionBadge: renderVisionBadge
  };
})();
</script>

   dark mode ligado, os seletores usam a forma dupla
   `html.cyl-theme-X, html.cyl-theme-X.dark` — a segunda tem 1 classe a mais
   que `:root.dark` e vence. O tema "cylinderui" NÃO usa essa forma dupla de
   propósito: continua cedendo pra `:root.dark`, preservando o dark/light
   toggle exatamente como hoje (decisão documentada em STATUS-vf2.md). */

html.cyl-theme-cylinderui,
html.cyl-theme-chatgpt,
html.cyl-theme-ios9,
html.cyl-theme-cylinderui.dark,
html.cyl-theme-chatgpt.dark,
html.cyl-theme-ios9.dark {

html.cyl-theme-cylinderui body,

.side, .topbar, .composer, .drawer, .vis-modal, .msg.user .body,

/* O botão de troca rápida de tema (#cylThemeToggle) foi REMOVIDO: o tema
   agora é definido por Visão (no editor), não por um toggle global solto no
   rodapé da sidebar. Mantemos a regra abaixo só como cinto-de-segurança para
   esconder qualquer instância remanescente (ex.: página servida antes de
   recarregar), sem quebrar o grid do rodapé (Router/Internet/Shield/Advanced). */
#cylThemeToggle { display: none !important; }
</style>
<script id="themes-js">
/* ============================================================================
   PATCH-THEMES-FRONTEND-V2 (VF2) — CylinderUI: 3 temas por Visão
   ----------------------------------------------------------------------------
   Cola DEPOIS de patch-visions.html (visions-js) e ANTES de </body>. Reescreve
   window.applyVisionTheme (a VF1 só define um placeholder condicional, ver
   patch-visions.html §2) e integra com o editor/ativação de Visão da VF1
   através dos hooks públicos expostos em window.__visions (activate,
   openEditor, saveEditor) — SEM editar patch-visions.html.

   FALLBACK: se window.__visions não existir (VF1 não instalada ou
   /api/visions fora do ar), o sistema de temas ainda funciona como skin
   global do console (classe em <html> + botão de troca rápida), só sem
   persistência por Visão (usa localStorage). Tema desconhecido/ausente
   sempre cai em "cylinderui".
   ============================================================================ */
(function () {
  'use strict';
  if (window.__themesPatchInstalled) return;
  window.__themesPatchInstalled = true;
  if (typeof document === 'undefined') return;

  var THEME_NAMES = ['cylinderui', 'chatgpt', 'ios9'];
  var DEFAULT_THEME = 'cylinderui';
  var CONSOLE_THEME_LS_KEY = 'cylinderui-console-theme';

  var visionThemeCache = {};   // id da visão -> theme (STRING: "cylinderui"|"chatgpt"|"ios9")
  var currentEditingId;        // undefined = editor fechado; null = criando; string = editando

  function byId(id) { try { return document.getElementById(id); } catch (e) { return null; } }

  function normalizeThemeName(theme) {
    var name = null;
    if (typeof theme === 'string') name = theme;
    else if (theme && typeof theme === 'object' && typeof theme.name === 'string') name = theme.name;
    return (THEME_NAMES.indexOf(name) >= 0) ? name : DEFAULT_THEME;
  }

  /* ---------------------------------------------------------------------- */
  /* 1) window.applyVisionTheme — substitui incondicionalmente o hook       */
  /*    placeholder da VF1 (que só marcava data-vis-theme/--vis-active-     */
  /*    color). Reestiliza o console inteiro via classe em <html>.          */
  /* ---------------------------------------------------------------------- */
  window.applyVisionTheme = function (theme) {
    try {
      var root = document.documentElement;
      var name = normalizeThemeName(theme);
      for (var i = 0; i < THEME_NAMES.length; i++) root.classList.remove('cyl-theme-' + THEME_NAMES[i]);
      // limpa também a marca antiga vis-theme-* deixada pelo placeholder da VF1
      var old = (root.className || '').match(/\bvis-theme-\S+/g);
      if (old) { for (var j = 0; j < old.length; j++) root.classList.remove(old[j]); }
      root.classList.add('cyl-theme-' + name);
      root.setAttribute('data-vis-theme', name);
      if (theme && typeof theme === 'object' && theme.color) {
        root.style.setProperty('--vis-active-color', theme.color);
      }
    } catch (e) {}
  };

  /* ---------------------------------------------------------------------- */
  /* 2) API helper (duplicado minimalista do apiPost da VF1 — não é         */
  /*    exposto pelo módulo dela, então replicamos só o necessário aqui).   */
  /* ---------------------------------------------------------------------- */
  function apiPostThemeUpdate(id, theme) {
    return fetch('/api/visions/update', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: id, theme: theme })
    }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status + ' /api/visions/update');
      return r.json();
    });
  }

  function getVisionFromState(id) {
    try {
      var state = window.__visions.getState();
      for (var i = 0; i < state.visions.length; i++) if (state.visions[i].id === id) return state.visions[i];
    } catch (e) {}
    return null;
  }

  /* ---------------------------------------------------------------------- */
  /* 3) Campo "Tema" no editor de Visão (injeta no modal da VF1, reaproveita */
  /*    as classes .vis-field/.vis-radio-group/.vis-radio-pill já criadas   */
  /*    por patch-visions.html — nenhum CSS novo necessário pra isso).      */
  /* ---------------------------------------------------------------------- */
  function bindThemeChange(field) {
    if (!field) return;
    var group = field.querySelector('#visEdThemeGroup');
    if (group && !group.__themeChangeBound) {
      group.addEventListener('change', onThemeRadioChange);
      group.__themeChangeBound = true;
    }
  }
  function ensureThemeFieldDom() {
    // O seletor de tema agora nasce no próprio modal (buildModalDom da VF1), pois
    // os botões "Nova/Editar Visão" chamam o openEditor LOCAL — não o
    // window.__visions.openEditor que este wrapper decora — então a injeção
    // tardia daqui nunca disparava no app servido. Se o campo já existe, apenas
    // garantimos o listener de troca-em-tempo-real (idempotente). O fallback de
    // criação segue vivo p/ qualquer caminho que abra o editor sem o campo.
    var existing = byId('visEdThemeField');
    if (existing) { bindThemeChange(existing); return existing; }
    var swatchInput = byId('visEdSwatches');
    var colorField = swatchInput ? swatchInput.closest('.vis-field') : null;
    if (!colorField || !colorField.parentNode) return null;

    var field = document.createElement('div');
    field.className = 'vis-field';
    field.id = 'visEdThemeField';
    field.innerHTML =
      '<label>Tema</label>' +
      '<div class="vis-radio-group" id="visEdThemeGroup">' +
        '<label class="vis-radio-pill"><input type="radio" name="visEdTheme" value="cylinderui"> Warm</label>' +
        '<label class="vis-radio-pill"><input type="radio" name="visEdTheme" value="chatgpt"> Estilo ChatGPT</label>' +
        '<label class="vis-radio-pill"><input type="radio" name="visEdTheme" value="ios9"> Estilo Apple</label>' +
      '</div>' +
      '<div class="vis-hint">Define o visual (tema) desta visão.</div>';
    colorField.parentNode.insertBefore(field, colorField.nextSibling);

    bindThemeChange(field);
    return field;
  }

  function onThemeRadioChange(ev) {
    var id = currentEditingId;
    if (!id) return; // visão nova (ainda sem id) -- tema fica "cylinderui" ate a 1a edição depois de criada
    // theme é STRING; a cor do ícone é um campo `color` separado da visão e não
    // é tocada aqui (update_vision faz merge parcial, então mandar só `theme`
    // preserva `color` intacto no backend).
    var name = normalizeThemeName(ev.target.value);
    visionThemeCache[id] = name;

    var state = null;
    try { state = window.__visions.getState(); } catch (e) {}
    if (state && state.activeId === id) {
      try { window.applyVisionTheme(name); } catch (e) {}
    }

    apiPostThemeUpdate(id, name).then(function (updated) {
      visionThemeCache[id] = (updated && typeof updated.theme === 'string') ? updated.theme : name;
    }).catch(function (err) {
      try { console.warn('[themes] falha ao salvar tema da visão', id, err); } catch (e) {}
    });
  }

  function populateThemeField(id) {
    var field = ensureThemeFieldDom();
    if (!field) return;
    // Seletor de tema agora aparece TAMBÉM ao criar visão nova (o tema
    // escolhido viaja no POST /api/visions de criação, via saveEditor da VF1);
    // visões novas (sem id ainda) pré-selecionam o padrão "cylinderui".
    field.style.display = '';
    var name = DEFAULT_THEME;
    if (id) {
      var v = getVisionFromState(id);
      // vision.theme é STRING; normalizeThemeName tolera objeto legado {name}.
      var known = visionThemeCache[id] || (v && v.theme) || DEFAULT_THEME;
      name = normalizeThemeName(known);
      visionThemeCache[id] = name;
    }
    var radios = field.querySelectorAll('input[name="visEdTheme"]');
    for (var i = 0; i < radios.length; i++) radios[i].checked = (radios[i].value === name);
  }

  /* NOTA (fixB): a VF1 agora manda `theme` (string) e `color` (string) como
     campos SEPARADOS e independentes no POST de Salvar, e o update_vision faz
     merge parcial — logo o "name" do tema não é mais apagado por uma troca de
     cor. O antigo reinforceThemeName (que reenviava o name por cima) deixou de
     ser necessário e foi removido. */

  /* ---------------------------------------------------------------------- */
  /* 4) Integração não-destrutiva com window.__visions (VF1) — só           */
  /*    monkey-patch de propriedades públicas já expostas, nada de reescrever*/
  /*    patch-visions.html.                                                 */
  /* ---------------------------------------------------------------------- */
  function wrapVisionsIntegration() {
    var v = window.__visions;
    if (!v || v.__themesWrapped) return;
    v.__themesWrapped = true;

    var origActivate = v.activate;
    if (typeof origActivate === 'function') {
      v.activate = function (id) {
        var r = origActivate.apply(v, arguments);
        try {
          var override = visionThemeCache[id];
          if (override) window.applyVisionTheme(override);
        } catch (e) {}
        return r;
      };
    }

    var origOpenEditor = v.openEditor;
    if (typeof origOpenEditor === 'function') {
      v.openEditor = function (id) {
        var r = origOpenEditor.apply(v, arguments);
        currentEditingId = (id === undefined) ? null : id;
        try { populateThemeField(currentEditingId); } catch (e) {}
        return r;
      };
    }

    // saveEditor não precisa mais de wrapper: a VF1 já persiste theme+color
    // como campos separados no próprio POST de Salvar (fixB).
  }

  /* ---------------------------------------------------------------------- */
  /* 5) Botão de troca rápida (side-foot) — alterna cylinderui -> chatgpt ->   */
  /*    ios9 -> cylinderui. Se há visão ativa, persiste nela; senão só troca   */
  /*    a skin do console localmente (localStorage).                        */
  /* ---------------------------------------------------------------------- */
  function currentAppliedThemeName() {
    var root = document.documentElement;
    for (var i = 0; i < THEME_NAMES.length; i++) if (root.classList.contains('cyl-theme-' + THEME_NAMES[i])) return THEME_NAMES[i];
    return DEFAULT_THEME;
  }

  function applyAndPersist(name) {
    var state = null;
    try { state = window.__visions && window.__visions.getState(); } catch (e) {}
    var activeId = state && state.activeId;
    // theme é STRING; a cor do ícone (campo `color`) não é mexida pela troca
    // rápida de tema.
    window.applyVisionTheme(name);
    try { localStorage.setItem(CONSOLE_THEME_LS_KEY, name); } catch (e) {}
    if (activeId) {
      visionThemeCache[activeId] = name;
      apiPostThemeUpdate(activeId, name).catch(function (err) {
        try { console.warn('[themes] falha ao persistir tema via troca rápida', err); } catch (e) {}
      });
    }
  }

  function cycleTheme() {
    var cur = currentAppliedThemeName();
    var idx = THEME_NAMES.indexOf(cur);
    var next = THEME_NAMES[(idx + 1) % THEME_NAMES.length];
    applyAndPersist(next);
  }

  /* O botão de troca rápida de tema foi REMOVIDO do rodapé da sidebar (o
     usuário achou o ícone solto/confuso e o tema agora é por Visão). Esta
     função virou uma limpeza idempotente: se uma instância antiga do
     #cylThemeToggle ainda estiver no DOM (ex.: página servida antes de
     recarregar), ela é removida. cycleTheme/applyAndPersist continuam
     existindo e são expostos em window.__themes.cycle (usado por
     integrações/testes), só sem o botão visível. */
  function removeQuickToggle() {
    var btn = byId('cylThemeToggle');
    if (btn && btn.parentNode) btn.parentNode.removeChild(btn);
  }

  /* ---------------------------------------------------------------------- */
  /* 6) Boot                                                                 */
  /* ---------------------------------------------------------------------- */
  function seedThemeCache(visions) {
    if (!visions) return;
    for (var i = 0; i < visions.length; i++) visionThemeCache[visions[i].id] = visions[i].theme;
  }

  function fallbackApply() {
    var saved = null;
    try { saved = localStorage.getItem(CONSOLE_THEME_LS_KEY); } catch (e) {}
    window.applyVisionTheme(saved || DEFAULT_THEME);
  }

  function initialApply() {
    if (window.__visions && window.__visions.ready && typeof window.__visions.ready.then === 'function') {
      window.__visions.ready.then(function () {
        try {
          var state = window.__visions.getState();
          seedThemeCache(state.visions);
          var active = null;
          for (var i = 0; i < state.visions.length; i++) if (state.visions[i].id === state.activeId) active = state.visions[i];
          window.applyVisionTheme(active ? active.theme : null);
        } catch (e) { fallbackApply(); }
      }).catch(fallbackApply);
    } else {
      fallbackApply();
    }
  }

  function boot() {
    try { removeQuickToggle(); } catch (e) {}
    try { wrapVisionsIntegration(); } catch (e) {}
    try { initialApply(); } catch (e) { fallbackApply(); }
  }

  try {
    boot();
  } catch (e) {
    try { fallbackApply(); } catch (_e) {}
  }

  /* Acesso de depuração/teste, mesmo padrão de window.__visions. */
  window.__themes = {
    names: THEME_NAMES.slice(),
    defaultName: DEFAULT_THEME,
    normalize: normalizeThemeName,
    current: currentAppliedThemeName,
    cycle: cycleTheme,
    getCache: function () { return Object.assign({}, visionThemeCache); },
    _setEditingId: function (id) { currentEditingId = id; } // só p/ testes
  };
})();
</script>

/* ==========================================================================
   CylinderUI -- Rebrand do PRODUTO (VF3). Cola em qualquer posicao depois
   de patch-visions.html/patch-themes.html, antes de </body> (ordem nao e
   estritamente necessaria pro brand-js funcionar sozinho, mas mantem a
   convencao das ondas anteriores).

   aba) de "CylinderUI" para "CylinderUI". NAO mexe em nomes de Visoes: a
   visao herdada "CylinderUI" continua se chamando "CylinderUI" em todo o resto
   da UI (lista de Visoes da VF1, "who" das mensagens, placeholder do
   composer -- ja tratado pela VF1) -- ver STATUS-vf3.md para o
   detalhamento da fronteira entre "marca do produto" x "nome da visao".

   --font-serif) -- funciona nos 3 temas da VF2 (cylinderui/chatgpt/ios9) e em
   dark/light sem nenhuma regra extra por tema (ver decisao de contraste no
   STATUS-vf3.md). */
.side-brand{justify-content:flex-start;align-items:center;gap:10px}
.cyl-hidden-legacy-logo{display:none!important}
/* Logo HORIZONTAL JUSTO do CylinderUI (cilindro + wordmark "CylinderUI for
   Llama.cpp" na propria imagem, ratio ~5.5:1, ja com fundo escuro proprio,
   sem sobra de fundo preto ao redor). Como a imagem se auto-contem, NAO usamos
   mais moldura/padding/box-shadow (--surface-2/--border) -- isso so criava uma
   "caixa" com espaco vazio. Exibimos o logo grande e ocupando bem a largura do
   topo da sidebar (width ~186px, height auto, object-fit contain), com cantos
   levemente arredondados. Contrasta naturalmente nos 3 temas. O texto
   "CylinderUI" NAO e renderizado a parte (ja vem na imagem). */

.cyl-brand-mark img{width:186px;height:auto;max-width:100%;object-fit:contain;display:block}

      mark.className = 'cyl-brand-mark';
      var img = document.createElement('img');
      img.alt = PRODUCT_NAME;
      img.src = LOGO_DATAURI;
      mark.appendChild(img);

      // O logo compacto ja contem o wordmark "CylinderUI" -- nao inserimos mais
      // um <span class="cyl-brand-name"> a parte, para nao duplicar o texto.
      brandEl.insertBefore(mark, brandEl.firstChild);
    } catch (e) {}

  function boot() {
    rebrandTitle();
    buildBrandMark();
  }

  try { boot(); } catch (e) {}

  window.__brand = {

<script id="visconv-js">
/* ============================================================================
   PATCH-VISCONV-JS (VF4) — CylinderUI: ponte conv-js × visions-js.
   ----------------------------------------------------------------------------
   Aplica a flag `showOtherVisionsChats` da Visão ATIVA à lista de conversas
   renderizada em #convList. Contrato: staging-visions/context-pack-vf4.md
   §5 (CONTRATO VF4).

   Não reescreve NADA: só envolve window.renderConvs (molde _orig+flag, igual
   installSaveConvsWrap de conv-js / chatPayload de visions-js), instalado via
   polling (mesmo padrão de pollMount em conv-js/patch-providers.html) até o
   alvo existir. Colado DEPOIS de visions-js no index real — pode assumir que
   conv-js/visions-js já existem quando os alvos aparecerem, mas degrada
   graciosamente sem eles (ver §3 abaixo).

   Comportamento:
   - flag false/ausente (default) -> NÃO mexe em nada; renderConvs() nativo já
     mostra só as conversas da visão ativa (comportamento atual, correto).
   - flag true -> depois do renderConvs() nativo rodar, substitui o conteúdo
     de #convList por uma lista agregada: conversas da visão ativa primeiro,
     depois um grupo por visão (rótulo discreto + linhas), lidas direto de
     localStorage pelo cvKey de cada visão (mesma técnica de leitura direta
     que conv-js já usa via lsGetArr). Clique em qualquer linha (da visão
     ativa ou de outra) grava o id da conversa no curKey daquela visão e chama
     window.__visions.activate(<id da visão dona>) — que já dispara
     applyMode()->renderConvs()->renderThread() nativos (ver ensureModeEntry/
     activateVision em visions-js), mantendo MODE/chatPayload().interface
     consistentes. Reativar a MESMA visão ativa é seguro: activateVision() não
     tem atalho de "já ativa", sempre relê o curKey e re-renderiza.

   Reage a troca de visão e a edição da flag no editor SEM hook adicional:
   ambos os fluxos (clique na sidebar -> activateVision(id) direto; saveEditor
   da visão ativa -> activateVision(result.id)) passam por applyMode(), que já
   chama a função global renderConvs() nativa — como window.renderConvs foi
   reatribuído para a versão empacotada, essa chamada "nua" dentro do script
   principal resolve para o mesmo binding global e cai no nosso wrap
   automaticamente (mesma garantia que já sustenta installSaveConvsWrap em
   conv-js). Não precisamos (e não tentamos) encadear window.__visions.activate/
   saveEditor: são apenas os valores externos expostos em window.__visions —
   as chamadas internas de visions-js usam a função local `activateVision`
   diretamente, então empacotar a cópia exposta em window não seria
   observado por elas.

   ARMADILHA DE ORDEM (achado desta onda, ver installWrap abaixo): dentro de
   activateVision() (patch-visions.html), applyMode(internalMode) — e portanto
   este renderConvs() nativo — roda ANTES de `visActiveId = id` ser atualizado.
   Se aplicássemos o filtro de forma síncrona dentro do wrap, toda troca de
   visão leria window.__visions.getState() ainda com o id da visão ANTERIOR.
   Por isso o pós-processamento é adiado por uma microtask (Promise.resolve().
   then), que já roda depois de `visActiveId = id` (mesmo bloco síncrono de
   activateVision) — sem precisar tocar em visions-js.

   FALLBACK OBRIGATÓRIO: sem visão ativa (window.__visions ausente, ou
   getState().activeId nulo, ou id sem correspondência em getState().visions)
   -> a função de pós-processamento simplesmente não faz nada; o wrap em si
   sempre chama a função original primeiro, então mesmo instalado o console
   funciona exatamente como hoje. Tudo dentro de try/catch amplos por camada.

   Rotas de atalho herdadas: fora de escopo desta onda (ver context-pack-vf4.md
   §3/§5 — decisão adiada; router real diverge da cópia local analisada).
   ============================================================================ */
(function () {
  'use strict';
  if (window.__visConvPatchInstalled) return;
  window.__visConvPatchInstalled = true;

  /* ---------------------------------------------------------------------- */
  /* 0) Helpers de leitura direta de localStorage (mesmo padrão de conv-js) */
  /* ---------------------------------------------------------------------- */
  function lsGetArr(key) {
    if (!key) return [];
    try {
      var raw = localStorage.getItem(key);
      if (raw == null) return [];
      var p = JSON.parse(raw);
      return Array.isArray(p) ? p : [];
    } catch (e) { return []; }
  }

  function lsGetJson(key) {
    if (!key) return null;
    try {
      var raw = localStorage.getItem(key);
      return raw == null ? null : JSON.parse(raw);
    } catch (e) { return null; }
  }

  /* ---------------------------------------------------------------------- */
  /* 1) Resolução de estado de Visões — sempre defensivo, nunca assume que  */
  /*    visions-js está presente.                                           */
  /* ---------------------------------------------------------------------- */
  function getVisionsState() {
    try {
      if (!window.__visions || typeof window.__visions.getState !== 'function') return null;
      var st = window.__visions.getState();
      if (!st || st.activeId == null || !Array.isArray(st.visions)) return null;
      return st;
    } catch (e) { return null; }
  }

  function findVision(list, id) {
    for (var i = 0; i < list.length; i++) {
      if (list[i] && list[i].id === id) return list[i];
    }
    return null;
  }

  /* IMPORTANTE: MODES é `const` de nível superior no script principal (não
     window.MODES) -- só é alcançável por referência léxica direta ao
     identificador `MODES`, exatamente como visions-js já faz (ver
     `MODES[internalMode] = entry` em ensureModeEntry). window.MODES NÃO
     existiria (const/let de topo não vira propriedade do objeto global).
     Isso só funciona porque este bloco, como todo <script id="..."> do
     index.html real, roda no MESMO ambiente léxico global do script
     principal -- confirmado no harness de teste (mesmo motivo pelo qual
     jsdom-visions.js injeta os blocos como <script> reais, não via eval
     indireto). */
  function modesEntryFor(internalMode) {
    try {
      if (typeof MODES !== 'undefined' && MODES && internalMode && MODES[internalMode]) return MODES[internalMode];
    } catch (e) {}
    return null;
  }

  function cvKeyForVision(v) {
    try {
      var im = v && v.__internalMode;
      var entry = modesEntryFor(im);
      if (entry && entry.cvKey) return entry.cvKey;
      if (v && v.conversationKey) return v.conversationKey;
      if (im) return im + '-conversations';
    } catch (e) {}
    return null;
  }

  function curKeyForVision(v) {
    try {
      var im = v && v.__internalMode;
      var entry = modesEntryFor(im);
      if (entry && entry.curKey) return entry.curKey;
      if (im) return im + '-current';
    } catch (e) {}
    return null;
  }

  /* ---------------------------------------------------------------------- */
  /* 2) Seleção de conversa (própria da visão ativa OU de outra visão) —    */
  /*    grava o curKey e reativa a visão dona via window.__visions.activate.*/
  /* ---------------------------------------------------------------------- */
  function selectVisionConv(vision, conv) {
    try {
      var curKey = curKeyForVision(vision);
      if (curKey) {
        if (typeof store !== 'undefined' && store && typeof store.set === 'function') {
          store.set(curKey, conv.id);
        } else {
          localStorage.setItem(curKey, JSON.stringify(conv.id));
        }
      }
    } catch (e) {}
    try {
      if (window.__visions && typeof window.__visions.activate === 'function') {
        window.__visions.activate(vision.id);
      }
    } catch (e) {}
  }

  /* ---------------------------------------------------------------------- */
  /* 3) Render agregado — substitui #convList quando showOtherVisionsChats  */
  /*    da visão ativa é true.                                              */
  /* ---------------------------------------------------------------------- */
  function escapeForTitle(s) {
    return String(s == null ? '' : s);
  }

  function buildLabel(vision) {
    var label = document.createElement('div');
    label.className = 'visconv-label';
    label.textContent = (vision && vision.name) ? vision.name : '';
    return label;
  }

  function buildRow(vision, conv, isActive) {
    var row = document.createElement('div');
    row.className = 'visconv-row' + (isActive ? ' visconv-row-active' : '');
    row.setAttribute('data-visconv-vision', vision.id);
    row.setAttribute('data-visconv-conv', conv.id);
    var t = document.createElement('div');
    t.className = 'visconv-row-title';
    var title = escapeForTitle(conv && conv.title) || '(sem título)';
    t.textContent = title;
    row.title = title;
    row.appendChild(t);
    row.addEventListener('click', function () { selectVisionConv(vision, conv); });
    return row;
  }

  function renderAggregated(convListEl, state) {
    var list = state.visions;
    var active = findVision(list, state.activeId);
    if (!active) return;

    var ordered = [active];
    for (var i = 0; i < list.length; i++) {
      if (list[i] && list[i].id !== active.id) ordered.push(list[i]);
    }

    var activeCurKey = curKeyForVision(active);
    var activeCurId = activeCurKey ? lsGetJson(activeCurKey) : null;

    var frag = document.createDocumentFragment();
    for (var j = 0; j < ordered.length; j++) {
      var v = ordered[j];
      var cvKey = cvKeyForVision(v);
      var convs = cvKey ? lsGetArr(cvKey) : [];
      if (!convs.length) continue;
      frag.appendChild(buildLabel(v));
      for (var k = 0; k < convs.length; k++) {
        var c = convs[k];
        if (!c || c.id == null) continue;
        var isActive = (v.id === active.id) && activeCurId != null && c.id === activeCurId;
        frag.appendChild(buildRow(v, c, isActive));
      }
    }

    convListEl.innerHTML = '';
    convListEl.appendChild(frag);
  }

  function applyShowOther() {
    var convListEl;
    try { convListEl = document.getElementById('convList'); } catch (e) { return; }
    if (!convListEl) return;

    var state = getVisionsState();
    if (!state) return; /* sem visões / sem visão ativa -> nativo intocado */

    var active = findVision(state.visions, state.activeId);
    if (!active || !active.showOtherVisionsChats) return; /* default -> nativo intocado */

    try { renderAggregated(convListEl, state); } catch (e) {}
  }

  /* ---------------------------------------------------------------------- */
  /* 4) Instalação — wrap não destrutivo sobre window.renderConvs (molde    */
  /*    _orig+flag) via polling até o alvo existir.                         */
  /* ---------------------------------------------------------------------- */
  function installWrap() {
    if (typeof window.renderConvs !== 'function') return false;
    if (window.renderConvs.__visShowOtherPatched) return true;
    var _orig = window.renderConvs;
    var wrapped = function () {
      var r = _orig.apply(this, arguments);
      /* Adiado por microtask (não síncrono): activateVision() em visions-js
         chama applyMode(internalMode) -- que é quem dispara este renderConvs()
         nativo -- ANTES de atualizar `visActiveId = id` (ver §5 do
         context-pack-vf4.md / linhas ~444-453 de patch-visions.html). Se
         aplicássemos o filtro aqui dentro, de forma síncrona, getState()
         ainda devolveria a visão ATIVA ANTERIOR (estado obsoleto) em toda
         troca de visão. Como `visActiveId = id` roda logo em seguida, ainda
         dentro do mesmo bloco síncrono de activateVision(), uma microtask
         (Promise.resolve().then) já é suficiente pra rodar depois que esse
         valor for atualizado -- sem introduzir um hook adicional em
         visions-js (fora de escopo desta onda). */
      try {
        if (typeof Promise === 'function') {
          Promise.resolve().then(function () { try { applyShowOther(); } catch (e) {} });
        } else {
          setTimeout(function () { try { applyShowOther(); } catch (e) {} }, 0);
        }
      } catch (e) {
        try { applyShowOther(); } catch (e2) {}
      }
      return r;
    };
    wrapped.__visShowOtherPatched = true;
    wrapped.__visConvOrig = _orig;
    window.renderConvs = wrapped;
    return true;
  }

  function pollMount() {
    /* window.renderConvs é definido pelo script principal, sempre carregado
       ANTES de qualquer patch -- então normalmente já existe na primeira
       tentativa, independente de document.readyState (ao contrário de alvos
       DOM tardios como #exWrap em conv-js). Tenta de imediato e mantém o
       polling como rede de segurança (mesmo padrão de pollMount em conv-js/
       patch-providers.html) caso a ordem de carregamento um dia mude. */
    if (installWrap()) return;
    var n = 0, t = setInterval(function () { n++; if (installWrap() || n > 60) clearInterval(t); }, 150);
  }

  try { pollMount(); } catch (e) {}

  /* Exposto só para testes/depuração — não usado pela UI nativa. */
  window.__visConv = {
    applyShowOther: applyShowOther,
    installWrap: installWrap,
    cvKeyForVision: cvKeyForVision,
    curKeyForVision: curKeyForVision
  };
})();
</script>
<!-- END CYLINDER patch-visconv.html -->
